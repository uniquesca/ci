name: AI folder map

description: A short map of the folders git tracks in the checkout, with how many files are under each, as a paragraph to interpolate into an agent's prompt

inputs:
  depth:
    description: 'How many levels of folders to show at most. A map over `max_lines` shows fewer'
    required: false
    default: '3'
  max_lines:
    description: 'How long the map may be, in lines'
    required: false
    default: '100'

outputs:
  text:
    description: 'The paragraph with the map in it, as markdown. Empty when git tracks no folders'
    value: ${{ steps.map.outputs.text }}

runs:
  using: composite
  steps:
    - id: map
      shell: bash
      env:
        INPUT_DEPTH: ${{ inputs.depth }}
        INPUT_MAX_LINES: ${{ inputs.max_lines }}
      run: node "$GITHUB_ACTION_PATH/map.js"
