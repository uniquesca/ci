name: AI run report

description: Read a Claude Code execution log - print what the agent did, and hand back its final message, what the run cost and why it stopped

inputs:
  execution_file:
    description: 'Path to the agent execution log, the `execution_file` output of claude-code-action'
    required: false
    default: ''
  verb:
    description: 'Past-tense verb the summary opens with, for example `Planned` or `Implemented`'
    required: false
    default: 'Ran'
  kind:
    description: 'What the run was doing - `plan`, `implement` or `review`. Recorded in `cost_line`, where it is what tells one kind of spend from another'
    required: false
    default: ''
  issue:
    description: 'Issue the run belongs to. Recorded in `cost_line`, and what a cost report groups by - a plan, the rounds that built it and the reviews of those rounds are all spend on one issue'
    required: false
    default: ''
  pull_request:
    description: 'Pull request the run belongs to, where there is one'
    required: false
    default: ''
  round:
    description: 'Which round this run was, where the caller counts them'
    required: false
    default: ''

outputs:
  has_result:
    description: 'Whether the agent produced a final message - "true" or "false"'
    value: ${{ steps.report.outputs.has_result }}
  result_file:
    description: 'Path to a file holding the agent final message, empty when there is none. A file rather than a string, because a plan can run to tens of kilobytes'
    value: ${{ steps.report.outputs.result_file }}
  summary:
    description: 'What the run cost, for example `Planned in 6m 44s, 18 turns, 1250000 tokens, ~$3.41`. Empty when the log recorded none of it'
    value: ${{ steps.report.outputs.summary }}
  reason:
    description: 'Why the run stopped, truncated to 200 characters, for a failure comment'
    value: ${{ steps.report.outputs.reason }}
  completed:
    description: 'Whether the agent finished of its own accord, from its own closing record - "true" or "false". False when it was cut off, when it died, and when it wrote no closing record at all. This is not the same thing as the agent step going green: claude-code-action fails a step whose run overran `--max-turns`, and a run it fails that way is still `completed`'
    value: ${{ steps.report.outputs.completed }}
  turns:
    description: 'How many turns the run took, for a caller that has to compare it with the budget it set. Empty when the log recorded none'
    value: ${{ steps.report.outputs.turns }}
  cost_usd:
    description: 'What the run cost in US dollars, as a bare number the caller can compare or add up - for example `3.41`. The agent''s own estimate from its token counts, not a billed figure. Empty when the log recorded none'
    value: ${{ steps.report.outputs.cost_usd }}
  cost_line:
    description: 'The whole run as one hidden HTML comment - `<!-- ai-cost {"v":1,"kind":"plan",...} -->`. Put it on the last line of the comment the run posts and the spend is recorded where the work is, for `bin/ai-cost-report.sh` to read back. Empty when there was no execution log to read'
    value: ${{ steps.report.outputs.cost_line }}

runs:
  using: composite
  steps:
    # The agent narrates as it works, but that narration is buried in a JSON transcript
    # that is unreadable at a glance. Pull out what it said and what it touched, and leave
    # the raw transcript to the caller's `debug`. This runs on failed runs too - a run that
    # died partway is exactly when you want to see how far it got.
    - name: Show what the agent did
      shell: bash
      env:
        EXECUTION_FILE: ${{ inputs.execution_file }}
      run: |
        if [[ -z "$EXECUTION_FILE" || ! -f "$EXECUTION_FILE" ]]; then
          echo "No execution log was produced - re-run with debug: true for the raw output"
          exit 0
        fi

        jq -rs '
          flatten
          | map(select(.type == "assistant"))
          | .[].message.content[]?
          | if .type == "text" then
              (.text | select(length > 0) | "💬 " + .)
            elif .type == "tool_use" then
              "🔧 " + .name + "("
                + ((.input // {})
                   | to_entries
                   | map("\(.key)=\(.value | tostring | .[0:60])")
                   | join(", "))
                + ")"
            else empty end
        ' "$EXECUTION_FILE" 2>/dev/null || echo "Could not read the execution log"

    - name: Read the result
      id: report
      shell: bash
      env:
        EXECUTION_FILE: ${{ inputs.execution_file }}
        VERB: ${{ inputs.verb }}
        KIND: ${{ inputs.kind }}
        ISSUE: ${{ inputs.issue }}
        PULL_REQUEST: ${{ inputs.pull_request }}
        ROUND: ${{ inputs.round }}
      run: |
        # Outside the checkout on purpose: a workflow that commits its working tree must
        # not be able to sweep the agent's own output into the commit
        out="$RUNNER_TEMP/ai-run-report"
        mkdir -p "$out"

        has_result='false'; result_file=''; summary=''; reason=''; completed='false'; turns=''
        cost_usd=''; cost_line=''

        if [[ -n "$EXECUTION_FILE" && -f "$EXECUTION_FILE" ]]; then
          # Whether the agent stopped because it had nothing left to do, which is the one
          # thing the step's own outcome does not tell a caller. `claude-code-action` fails
          # the step when a finished run overran `--max-turns` - see the note where each
          # workflow acts on this - so red does not mean unfinished. A run genuinely cut off
          # at its limit says `error_max_turns` here, an API failure says its own subtype,
          # and a killed step never writes this record at all: all false.
          completed=$(
            jq -rs 'flatten | (map(select(.type == "result")) | last) as $r
                    | if ($r.subtype // "") == "success" and ($r.is_error != true)
                      then "true" else "false" end' "$EXECUTION_FILE" 2>/dev/null || true
          )
          # Anything but a clear yes is a no - a log this cannot be read out of is not
          # evidence that the work is finished
          [[ "$completed" == 'true' ]] || completed='false'

          # Why the run stopped. Surfacing this turns "the run went red" into something
          # actionable - an exhausted credit balance and a genuine bug look identical
          # otherwise.
          reason=$(
            jq -rs 'flatten | (map(select(.type == "result")) | last) as $r
                    | [ ($r.result // ""), ($r.terminal_reason // "") ]
                    | map(select(. != "")) | first // ""
                    | .[0:200]
                    | gsub("\\s+"; " ") | ltrimstr(" ") | rtrimstr(" ")' "$EXECUTION_FILE" 2>/dev/null || true
          )
          # A step output holds a single line, and this is one line of diagnostics either
          # way. Collapsed to nothing when there was nothing but whitespace to report, so
          # the caller's `if [[ -n ... ]]` does the right thing.
          [[ "$reason" == null ]] && reason=''

          # The agent's final message. It used to come back through a one-field
          # --json-schema, which meant generating the whole thing as a single escaped JSON
          # string - slower, and prone to failing outright on a long answer. `result` on
          # the closing record is the same text without that cost. On an `api_error` that
          # field holds the error rather than an answer, so it is not one.
          jq -rs 'flatten
                  | (map(select(.type == "result")) | last) as $r
                  | if ($r.terminal_reason // "") == "api_error" then ""
                    else ($r.result // "") end' "$EXECUTION_FILE" > "$out/result.md" 2>/dev/null || true

          # A final message fenced from top to bottom renders as a wall of source wherever a
          # caller posts it, and a model does this occasionally whatever the prompt asks for.
          # So it is undone here, once, for every caller - none of them can tell from the file.
          #
          # Only a fence around the whole message goes: the opening fence has to be the first
          # thing in the file and the fence that closes it the last, which is what separates a
          # wrapped report from one that legitimately contains code blocks. The awk exits
          # non-zero when there is nothing to undo, and always prints the message either way,
          # so a rewrite that decided nothing cannot empty the file.
          if unfenced=$(awk '
            { line[NR] = $0; if ($0 !~ /^[[:space:]]*$/) { if (!first) first = NR; last = NR } }
            END {
              strip = 0
              if (first && match(line[first], /^(`{3,}|~{3,})[^`~]*$/)) {
                fence = line[first]; sub(/[^`~].*$/, "", fence)
                for (i = first + 1; i <= NR && !close_at; i++)
                  if (line[i] ~ "^" substr(fence, 1, 1) "{" length(fence) ",}[[:space:]]*$") close_at = i
                if (close_at == last) strip = 1
              }
              if (strip) { for (i = first + 1; i < close_at; i++) print line[i] }
              else       { for (i = 1; i <= NR; i++) print line[i] }
              exit strip ? 0 : 1
            }
          ' "$out/result.md"); then
            printf '%s\n' "$unfenced" > "$out/result.md"
            echo "::warning title=The agent fenced its whole final message::It came back as one code block, which would have posted as a wall of source - the fence was removed"
          fi

          if [[ -s "$out/result.md" && -n "$(tr -d '[:space:]' < "$out/result.md")" ]]; then
            has_result='true'
            result_file="$out/result.md"
          else
            rm -f "$out/result.md"
            echo "The agent returned no final message"
          fi

          # What the run cost. These numbers exist only in the agent's own execution log,
          # and every one of them is optional - a field that is missing drops out of the
          # line rather than failing the report.
          mapfile -t stats < <(
            jq -rs 'flatten | (map(select(.type == "result")) | last) as $r
                    | [ ($r.total_cost_usd // ""),
                        ($r.duration_ms // ""),
                        ($r.num_turns // ""),
                        (if $r.usage
                         then ($r.usage.input_tokens // 0)
                            + ($r.usage.output_tokens // 0)
                            + ($r.usage.cache_read_input_tokens // 0)
                            + ($r.usage.cache_creation_input_tokens // 0)
                         else "" end) ]
                    | .[] | tostring' "$EXECUTION_FILE" 2>/dev/null || true
          )
          cost=${stats[0]:-}; duration=${stats[1]:-}; turns=${stats[2]:-}; tokens=${stats[3]:-}
          # The summary line below reads these for prose and can leave a missing one out.
          # `turns` also goes back to the caller as a number to compare with its own budget,
          # so a missing one has to come back empty rather than as the string `null`.
          [[ "$turns" == null ]] && turns=''

          if [[ -n "$duration" && "$duration" != null ]]; then
            secs=$(( duration / 1000 ))
            if (( secs >= 60 )); then
              summary="$VERB in $(( secs / 60 ))m $(( secs % 60 ))s"
            else
              summary="$VERB in ${secs}s"
            fi
          fi
          [[ -n "$turns" && "$turns" != null ]] && summary="${summary:+$summary, }${turns} turns"
          [[ -n "$tokens" && "$tokens" != null ]] && summary="${summary:+$summary, }${tokens} tokens"
          if [[ -n "$cost" && "$cost" != null ]]; then
            # The agent's own estimate from its token counts, not a billed figure
            summary="${summary:+$summary, }~\$$(awk -v c="$cost" 'BEGIN { printf (c < 0.01 ? "%.4f" : "%.2f"), c }')"
            cost_usd="$cost"
          fi

          # The same run again, as one line a machine can read. The prose above is for whoever
          # opens the issue; this is what a cost report adds up, and the caller carries it on
          # the last line of whatever it posts. Nothing else keeps these numbers - the execution
          # log dies with the runner.
          #
          # Everything the log did not record drops out of the object rather than arriving as a
          # null, so a report can tell a run that recorded no cost from one that cost nothing.
          # The token counters stay separate here, unlike in the prose: cache reads are most of
          # the volume and a fraction of the price, and a rise in spend cannot be explained
          # without them.
          #
          # The model comes off the last assistant message, which is the one that produced the
          # result. Not from the result's `modelUsage`: that lists every model the run had
          # configured - the main one and the small one the harness keeps for its own chores -
          # with no usage figures to tell them apart, so any pick from it is a guess.
          cost_line=$(
            jq -rs --arg kind "$KIND" \
                   --arg repo "${GITHUB_REPOSITORY:-}" \
                   --arg issue "$ISSUE" \
                   --arg pull_request "$PULL_REQUEST" \
                   --arg round "$ROUND" \
                   --arg run_id "${GITHUB_RUN_ID:-}" \
                   --arg run_attempt "${GITHUB_RUN_ATTEMPT:-}" \
                   --arg actor "${GITHUB_ACTOR:-}" \
                   --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
              def num: if . == "" then null else (tonumber? // null) end;
              flatten
              | (map(select(.type == "result")) | last) as $r
              | (map(select(.type == "assistant")) | last) as $a
              | {v: 1, kind: $kind, repo: $repo, at: $at,
                 issue: ($issue | num), pull_request: ($pull_request | num),
                 round: ($round | num),
                 run_id: ($run_id | num), run_attempt: ($run_attempt | num), actor: $actor,
                 cost_usd: $r.total_cost_usd, turns: $r.num_turns,
                 duration_ms: $r.duration_ms,
                 input_tokens: $r.usage.input_tokens,
                 output_tokens: $r.usage.output_tokens,
                 cache_read_tokens: $r.usage.cache_read_input_tokens,
                 cache_write_tokens: $r.usage.cache_creation_input_tokens,
                 model: $a.message.model,
                 completed: (($r.subtype // "") == "success" and $r.is_error != true)}
              | with_entries(select(.value != null and .value != ""))
              | "<!-- ai-cost " + tojson + " -->"' "$EXECUTION_FILE" 2>/dev/null || true
          )
          [[ -n "$cost_line" ]] || echo "::warning title=The run cost was not recorded::The execution log could not be read as JSON, so this run is missing from the cost report"
        else
          echo "No execution log to read"
        fi

        # Written once each - a key repeated in $GITHUB_OUTPUT has no defined winner
        {
          printf 'has_result=%s\n' "$has_result"
          printf 'result_file=%s\n' "$result_file"
          printf 'summary=%s\n' "$summary"
          printf 'reason=%s\n' "$reason"
          printf 'completed=%s\n' "$completed"
          printf 'turns=%s\n' "$turns"
          printf 'cost_usd=%s\n' "$cost_usd"
          printf 'cost_line=%s\n' "$cost_line"
        } >> "$GITHUB_OUTPUT"

        echo "$summary"
