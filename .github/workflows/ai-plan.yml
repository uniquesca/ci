name: AI Plan

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key used to call the AI planning agent'
        required: true
    inputs:
      command:
        description: 'Comment command that triggers the planning, has to be at the very beginning of the comment'
        required: false
        default: '/ai-plan'
        type: string
      allowed_permissions:
        description: 'Space-separated repository permission levels allowed to run the command. Github reports the maintain role as `write` and the triage role as `read`, so `admin write` covers owners, maintainers and developers'
        required: false
        default: 'admin write'
        type: string
      timeout_minutes:
        description: 'How long to wait for the planning agent before giving up'
        required: false
        default: 30
        type: number
      max_turns:
        description: 'How many turns the agent may spend reading the repository before it has to plan with what it found'
        required: false
        default: 30
        type: number
      model:
        description: 'Model used to produce the plan'
        required: false
        default: 'claude-opus-4-8'
        type: string
      debug:
        description: 'Log every step the agent takes to the run log. On by default while the planner is being piloted. Tool results contain whatever the agent read, so turn this off in a public repository'
        required: false
        default: true
        type: boolean

jobs:
  plan:
    name: Plan the issue
    # Only react to a fresh comment on a real issue that starts with the command
    if: >-
      ${{ github.event_name == 'issue_comment'
      && github.event.action == 'created'
      && !github.event.issue.pull_request
      && startsWith(github.event.comment.body, inputs.command) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      issues: write
    env:
      # Set for every `gh` call below - no checkout is needed to resolve the repository this way
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      COMMENTER: ${{ github.event.comment.user.login }}
    steps:
      - name: Check the commenter permissions
        id: permissions
        env:
          ALLOWED: ${{ inputs.allowed_permissions }}
        run: |
          if permission=$(gh api "repos/$GH_REPO/collaborators/$COMMENTER/permission" --jq '.permission' 2> error.log); then
            echo "@$COMMENTER has the '$permission' permission in $GH_REPO"
          elif grep -q 'Not Found' error.log; then
            # Not a collaborator at all - expected, no permission to run the command
            permission='none'
          else
            # Anything other than a 404 is a real failure, do not silently treat it as a refusal
            cat error.log
            echo "::error title=Permission check failed::Could not read the permissions of @$COMMENTER"
            exit 1
          fi

          allowed='false'
          for level in $ALLOWED; do
            if [[ "$permission" == "$level" ]]; then
              allowed='true'
              break
            fi
          done

          echo "permission=$permission" >> "$GITHUB_OUTPUT"
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

      # Refusals stop the job, so the steps below only ever run for an allowed commenter
      - name: Refuse the request
        if: ${{ steps.permissions.outputs.allowed != 'true' }}
        env:
          COMMAND: ${{ inputs.command }}
          PERMISSION: ${{ steps.permissions.outputs.permission }}
        run: |
          gh issue comment "$ISSUE" --body "@$COMMENTER you are not allowed to run \`$COMMAND\` in this repository - your access level is \`$PERMISSION\`. Ask an owner, a maintainer or a developer to run it for you."
          echo "::error title=Permission denied::@$COMMENTER ($PERMISSION) is not allowed to run $COMMAND"
          exit 1

      - name: Make sure there is something to plan
        id: task
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          if [[ -n "${BODY//[[:space:]]/}" ]]; then
            echo "has_task=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Nothing to plan is not a failure - say so on the issue and stop quietly
          echo "has_task=false" >> "$GITHUB_OUTPUT"
          gh issue comment "$ISSUE" --body "Cannot trigger AI planner - issue body is empty"
          echo "Issue #$ISSUE has an empty body, nothing to plan"

      # The agent plans against the real code, so the repository has to be on disk.
      # An issue comment always resolves to the default branch - there is no ref to
      # infer from the event, and planning an issue is a question about the
      # mainline, not about whatever branch happens to be open.
      - name: Check out the repository
        if: ${{ steps.task.outputs.has_task == 'true' }}
        uses: actions/checkout@v6

      # The agent reads the issue itself rather than having its body interpolated into
      # this file - issue text is written by whoever opened it, and it has no business
      # being expanded into the workflow. Only the issue number and the commenter's
      # username go in, both of which Github restricts to safe characters.
      - name: Generate the plan
        id: plan
        if: ${{ steps.task.outputs.has_task == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Passed explicitly so the workflow works without the Claude Github App
          # installed, and so the agent is bound by this job's `contents: read`
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Off by default - this prints every tool call and every tool result, and a tool
          # result is whatever the agent just read out of the repository
          show_full_output: ${{ inputs.debug }}
          prompt: |
            You are a senior software architect. Plan the work described in issue
            #${{ github.event.issue.number }} of this repository.

            Return the finished plan as the `plan` field of your structured output. It is
            posted verbatim as a comment on the issue, so it is the plan and nothing else
            - no preamble about what you are about to do, no sign-off, no commentary on
            how the investigation went.

            Start by reading the issue and every comment on it. If a plan has been posted
            before - a comment whose first line is the `<!-- ai-plan -->` marker - take
            the most recent one as your starting point and revise it, rather than
            planning again from nothing. Anything said after that plan was posted is
            feedback on it: apply it. Keep the parts nobody objected to. A re-run that
            quietly discards the discussion is worse than no re-run at all.

            Then investigate the repository before you plan
            anything: find the code the task touches, read it, and learn the conventions
            actually in use - how modules are structured, how errors are handled, how
            things are tested, and what already exists that the task should reuse rather
            than duplicate. Check the callers, tests and documentation that would go
            stale. A plan built on what the code actually does is worth far more than one
            built on assumptions about what it probably does.

            This repository may commit its dependencies. Ignore `node_modules`, `vendor`,
            `dist` and `build` unless the task is specifically about one of them.

            The plan is markdown, in this order:

            - A short summary of the approach, in prose. If you are revising an earlier
              plan, open with one sentence on what changed and why.
            - The steps, as a markdown task list - `- [ ] 1. Short imperative title`,
              each followed by an indented paragraph on what to do and why, and the real
              files it touches. Note explicitly where a step depends on an earlier one.
            - Risks, unknowns and assumptions worth flagging. Where you could not
              determine something from the code, say so plainly rather than filling the
              gap with a guess.
            - Concrete checks that would prove the task is complete.

            Do not write the `<!-- ai-plan -->` marker or a `Requested by` line yourself -
            the workflow adds both. Name real files throughout: the plan is executed later
            by another agent that has only this comment to work from. Stay under 60000
            characters; Github rejects a comment longer than 65536.

            Do not implement the task. Do not modify, create, commit or push any file.
            Your only output is the comment.
          # The schema is a transport, not a second copy of the plan - one string field,
          # so the markdown comes back through a documented output instead of having to
          # be scraped out of the run's execution file
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --disallowedTools "Edit,Write,Replace,NotebookEdit,Bash"
            --json-schema '{"type":"object","properties":{"plan":{"type":"string"}},"required":["plan"],"additionalProperties":false}'
            ${{ inputs.debug && '--debug' || '' }}

      - name: Post the plan
        if: ${{ steps.task.outputs.has_task == 'true' }}
        env:
          PLAN_JSON: ${{ steps.plan.outputs.structured_output }}
        run: |
          # Parsed with jq rather than fromJSON() so that an empty or malformed output
          # fails here, with a message, instead of blowing up during expression evaluation
          plan=$(printf '%s' "$PLAN_JSON" | jq -r '.plan // empty')
          if [[ -z "$plan" ]]; then
            echo "::error title=No plan produced::The agent returned no plan - see the run log"
            exit 1
          fi

          # The marker and the footer are added here rather than asked of the model, so
          # they are always present and always exactly right
          {
            printf '<!-- ai-plan -->\n\n'
            printf '%s\n\n' "$plan"
            printf -- '---\n\n'
            printf 'Requested by @%s.\n' "$COMMENTER"
          } > plan-comment.md

          # Keep a copy in the run itself, so a failing comment post does not lose the plan
          cat plan-comment.md >> "$GITHUB_STEP_SUMMARY"

          size=$(wc -c < plan-comment.md)
          if [[ "$size" -gt 65536 ]]; then
            echo "::error title=Plan too large::The plan is $size bytes, Github caps a comment at 65536 - see the run summary for the full plan"
            exit 1
          fi

          gh issue comment "$ISSUE" --body-file plan-comment.md
