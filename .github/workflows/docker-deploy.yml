name: Deploy

on:
  workflow_call:
    secrets:
      SSH_KEY:
        description: 'SSH private key to use to connect to the host'
        required: true
      UNIQUES_GITHUB_ACCESS_TOKEN:
        description: 'Access token for cloning Uniques private repositories from GitHub'
        required: true
      NODE_AUTH_TOKEN:
        description: 'Access token for authentication with the NPM registry'
        required: false
      ENV_VARIABLES:
        description: 'Environment variables to set on the remote server'
        required: false
    inputs:
      host:
        description: 'Address of the server'
        required: true
        type: string
      username:
        description: 'SSH login'
        required: true
        type: string
      port:
        description: 'SSH password'
        required: false
        default: '22'
        type: string
      deployment_path:
        description: 'Working directory of the project on the server'
        required: true
        type: string
      ref:
        description: 'Git branch or tag to use for the project on the server'
        required: true
        type: string
      docker_up_args:
        description: 'Arguments to pass to docker up command'
        required: false
        type: string
        default: '--force-recreate --remove-orphans --build'
      pre_cmd:
        description: 'Command to execute on the REMOTE after pulling latest code and before everything else'
        required: false
        default: ''
        type: string
      post_cmd:
        description: 'Command to execute on the REMOTE after deployment is complete'
        required: false
        default: ''
        type: string
      prepare_environment:
        description: 'Flag whether environment configs should be processed'
        required: false
        default: true
        type: boolean
      npm_working_directory:
        description: 'Directory where npm commands should be executed'
        required: false
        type: string
        default: '.'
      composer_working_directory:
        description: 'Directory where composer commands should be executed'
        required: false
        type: string
        default: '.'
      timeout:
        description: 'Timeout for the deployment'
        required: false
        type: string
        default: '5m'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v6
        if: ${{ inputs.prepare_environment }}
        with:
          ref: ${{ inputs.ref }}

      # DIRTY - we want to download configs instead of building them locally
      - name: Pre-process command
        if: ${{ inputs.prepare_environment }}
        run: |
          # Always parse init_script from JSON (if the file exists)
          if [ -f "_ci_environment.json" ]; then
            INIT_SCRIPT="$(jq -r '.init_script // empty' _ci_environment.json)"
          else
            echo "⚠️ _ci_environment.json not found — skipping init_script pre-processing"
            INIT_SCRIPT=""
          fi

          # Run init script if it's provided and it's a freshly initialized repo 
          if [ -n "$INIT_SCRIPT" ]; then
            # Create a secure temporary file
            VARIABLES_FILE=$(mktemp)
          
            VARIABLES='${{ secrets.ENV_VARIABLES }}'
            echo "$VARIABLES" > "$VARIABLES_FILE"
        
            # Export so INIT_SCRIPT can access it
            export VARIABLES_FILE
        
            echo "Running init script: $INIT_SCRIPT"
            bash "$INIT_SCRIPT"
        
            # Cleanup
            rm -f "$VARIABLES_FILE"
          fi

      # This has to be done before the configs are uploaded
      - name: Initialize deployment environment if necessary
        uses: appleboy/ssh-action@v1
        id: initialize
        with:
          host: ${{ inputs.host }}
          username: ${{ inputs.username }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ inputs.port }}
          command_timeout: 5m
          capture_stdout: true
          script: |
            # Making it more strict for the script to fail in case of an error.
            # `pipefail` because without it only the last command of a pipeline is allowed to fail
            # the script, and the failure of anything upstream of a `|` is discarded
            set -euxo pipefail;

            # Whatever stops this script names itself and carries its status out
            trap 'status=$?; set +x; echo "❌ Initialization failed at line $LINENO: $BASH_COMMAND (exit $status)"; exit $status' ERR

            # TODO might wanna log into ghcr.io
            
            # Check if it's already a git repo
            if [ ! -d "${{ inputs.deployment_path }}/.git" ]; then
              echo "Git not initialized, cloning repository..."
              git clone "git@github.com:${{ github.repository }}.git" "${{ inputs.deployment_path }}"
              cd "${{ inputs.deployment_path }}"
              git checkout "${{ inputs.ref }}"
              echo "<<<OUTPUT::0>>>"
            else
              echo "<<<OUTPUT::1>>>"
            fi

      - name: Process configs
        if: ${{ inputs.prepare_environment }}
        uses: uniquesca/ci/prepare-environment@v11
        with:
          env_variables: ${{ secrets.ENV_VARIABLES }}

      - name: Prepare upload paths
        id: upload_paths
        # Same condition as the checkout above: without one there is no environment file to read
        # here, and a deployment that only wanted the code updated must not fail over a config
        # step it turned off
        if: ${{ inputs.prepare_environment }}
        run: |
          if [ ! -f "_ci_environment.json" ]; then
            echo "⚠️ _ci_environment.json not found — no configs to upload"
            echo "paths=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # We upload configs + _ci_environment.json file to cover the case
          # when it  was just introduced
          #
          # `.configs[]?` rather than `.configs[]`: an environment file that declares only
          # token_fallbacks has no configs to iterate, and that is a repository to deploy rather
          # than an error
          PATHS=$(jq -r '[.configs[]?.path] + ["_ci_environment.json"] | join(",")' _ci_environment.json)
          echo "paths=$PATHS" >> $GITHUB_OUTPUT

      - name: Upload configs
        # An empty source uploads the whole working directory, so the paths have to be there
        if: ${{ inputs.prepare_environment && steps.upload_paths.outputs.paths != '' }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ inputs.host }}
          username: ${{ inputs.username }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ inputs.port }}
          source: ${{ steps.upload_paths.outputs.paths }}
          target: ${{ inputs.deployment_path }}
          command_timeout: 1m

      - name: Checking if the repo was just initialized
        id: previously_initialized
        # Read through the environment rather than interpolated into the script: this is output
        # from the server, and `${{ }}` would paste it into the shell as code
        env:
          INITIALIZE_STDOUT: ${{ steps.initialize.outputs.stdout }}
        run: |
          RESULT=$(printf %s "$INITIALIZE_STDOUT" | grep -o '<<<OUTPUT::[01]>>>' | tail -n1 | sed -E 's/<<<OUTPUT::([01])>>>/\1/' || true)

          # The initialize script prints one of the two markers on every path it can exit through,
          # so its absence means it never got there. Left empty this would read as "not a fresh
          # clone" and quietly skip the one-time init script
          if [ -z "$RESULT" ]; then
            echo "::error::The initialization step did not report whether the repository was just cloned"
            exit 1
          fi

          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Connect and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ inputs.host }}
          username: ${{ inputs.username }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ inputs.port }}
          timeout: ${{ inputs.timeout }}
          command_timeout: ${{ inputs.timeout }}
          script: |
            # Making it more strict for the script to fail in case of an error.
            # `pipefail` because without it only the last command of a pipeline is allowed to fail
            # the script, and the failure of anything upstream of a `|` is discarded - a deployment
            # that carries on because `git ... | wc -l` reported zero lines is exactly the kind of
            # green run this guards against
            set -euxo pipefail;

            # Where this script records its verdict for the verification step below. The run and
            # attempt number make it this deployment's alone, so no previous run's file can be
            # mistaken for this one's
            DEPLOYMENT_STATUS_FILE="/tmp/ci-deployment-${{ github.run_id }}-${{ github.run_attempt }}.status"

            # Whatever stops this script names itself, writes that down and carries its status out,
            # so a failure ten commands deep is not reported as "the last thing I ran was fine".
            # Not `-E`: an ERR trap inherited by the subshell of a `cmd | while read` would report
            # the failure twice, once from inside and once from the pipeline itself
            trap 'status=$?; set +x; echo "❌ Deployment failed at line $LINENO: $BASH_COMMAND (exit $status)"; echo "failed at line $LINENO: $BASH_COMMAND (exit $status)" > "$DEPLOYMENT_STATUS_FILE"; exit $status' ERR

            # Change into the directory
            cd ${{ inputs.deployment_path }}

            # Check if the repo was previously initialized
            INITALIZED="${{ steps.previously_initialized.outputs.result }}"

            # Always parse init_script from JSON (if the file exists). A repository without one has
            # no init script either, and `set -e` above would otherwise end the deployment here
            if [ -f "_ci_environment.json" ]; then
              INIT_SCRIPT="$(jq -r '.init_script // empty' _ci_environment.json)"
            else
              echo "⚠️ _ci_environment.json not found — skipping init_script"
              INIT_SCRIPT=""
            fi

            # Run init script if it's provided and it's a freshly initialized repo
            if [ "$INITALIZED" = "0" ] && [ -n "$INIT_SCRIPT" ]; then
              # Create a secure temporary file
              VARIABLES_FILE=$(mktemp)
            
              VARIABLES='${{ secrets.ENV_VARIABLES }}'
              echo "$VARIABLES" > "$VARIABLES_FILE"
              
              # Export so INIT_SCRIPT can access it
              export VARIABLES_FILE
              
              echo "Running init script: $INIT_SCRIPT"
              bash "$INIT_SCRIPT"
              
              # Cleanup
              rm -f "$VARIABLES_FILE"
            fi

            echo "Cleaning git"
            git clean -fd
            
            echo "Ensuring we are not on a deleted branch"
            git checkout --detach || true
            
            echo "Removing stale remote-tracking refs"
            git for-each-ref --format='%(refname)' refs/remotes/origin/ | while read ref; do
              if ! git ls-remote --exit-code origin "${ref#refs/remotes/origin/}" >/dev/null 2>&1; then
                echo "Deleting stale ref: $ref"
                git update-ref -d "$ref"
              fi
            done
            
            echo "Deleting local branches that no longer exist on origin"
            for branch in $(git for-each-ref --format='%(refname:short)' refs/heads/); do
              if ! git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
                echo "Deleting stale local branch: $branch"
                git branch -D "$branch"
              fi
            done

            echo "Retrieving the latest updates and pruning stale remote-tracking refs"
            git fetch --prune origin

            echo "Deleting local branches with no upstream or missing remote counterpart"
            git for-each-ref --format='%(refname:short) %(upstream:short) %(upstream:track)' refs/heads/ |
            while read branch upstream track; do
              if [ -z "$upstream" ]; then
                echo "Deleting local branch without upstream: $branch"
                git branch -D "$branch"
                continue
              fi

              if [ "$track" = "[gone]" ]; then
                echo "Deleting local branch with missing upstream: $branch -> $upstream"
                git branch -D "$branch"
              fi
            done

            # This part is commented because it doesn't work well - if there are any changes done, 
            # or some commits are ahead autodeployment will fail
            # if git show-ref -q --verify "refs/heads/${{ inputs.ref }}" 2>/dev/null; then
            #   echo "Branch detected, switching and pulling"
            #   git checkout ${{ inputs.ref }}
            #   git pull
            # else
            #   echo "Non-branch detected, performing get reset"
            
            echo "Checking if it's a pull request"
            ref="${{ inputs.ref }}"
            if [[ ${{ inputs.ref }} =~ ^refs/pull/[0-9]+/merge$ ]]; then
              echo "Pull request detected"
              # Handling pull requests
              echo "Performing hard reset"
              git reset --hard
              echo "Switching to PR branch with detached HEAD"
              git fetch -u origin pull/${{ github.event.pull_request.number }}/head && git checkout FETCH_HEAD
            else
              echo "Pull request not detected"
              echo "Checking if remote branch exists"
              # This is just regular branch
              branch_exists="$(git ls-remote --heads origin "$ref" | wc -l)"

              if [[ "$branch_exists" -gt 0 ]]; then
                echo "Remote branch $ref exists, performing hard reset to it"
            
                # Force-create the remote-tracking branch
                git fetch origin "$ref:refs/remotes/origin/$ref"

                git reset --hard "origin/$ref"
              else
                echo "Remote branch $ref not found, performing hard reset"
                git reset --hard $ref
              fi
            fi
            
            echo "Stopping Docker Services"
            ./task.sh down
            
            echo "Starting Docker Services"
            ./task.sh up -d ${{ inputs.docker_up_args }}
            
            echo "Executing pre-deployment command"
            ${{ inputs.pre_cmd }}
            
            rm -f ${{ inputs.composer_working_directory }}/auth.json
            if [ -f "${{ inputs.composer_working_directory }}/composer.json" ]; then
              echo "Installing composer dependencies"
              ./task.sh composer config --auth github-oauth.github.com ${{ secrets.UNIQUES_GITHUB_ACCESS_TOKEN }}
              ./task.sh composer install
            fi
            rm -f ${{ inputs.composer_working_directory }}/auth.json
            
            rm -f ${{ inputs.npm_working_directory }}/.npmrc
            if [ -f "${{ inputs.npm_working_directory }}/package.json" ]; then
              echo "Preparing .npmrc file"
              echo "@uniquesca:registry=https://npm.pkg.github.com/" > ${{ inputs.npm_working_directory }}/.npmrc
              echo "//npm.pkg.github.com/:_authToken=${{ secrets.NODE_AUTH_TOKEN }}" >> ${{ inputs.npm_working_directory }}/.npmrc
              echo "always-auth=true" >> ${{ inputs.npm_working_directory }}/.npmrc
            
              if [ -f "${{ inputs.npm_working_directory }}/yarn.lock" ]; then
                echo "Installing Yarn - first attempt"

                # Temporarily disable exit on error to handle yarn failure
                set +e
                output=$(./task.sh yarn install 2>&1)
                exit_code=$?
                set -e

                if [ $exit_code -ne 0 ]; then
                  if echo "$output" | grep -q '401 Unauthorized' && [ -f "${{ inputs.npm_working_directory }}/yarn.lock" ]; then
                    echo "Detected 401 Unauthorized error. Removing yarn.lock and retrying..."
                    rm ${{ inputs.npm_working_directory }}/yarn.lock

                    # Retry — if this fails, the script exits naturally due to set -e
                    ./task.sh yarn install
                  else
                    # Failed for a reason other than 401, show error output
                    echo "$output"
                    exit $exit_code
                  fi
                fi
            
              else 
                echo "Installing NPM"
                ./task.sh npm install
              fi
            fi
            rm -f ${{ inputs.npm_working_directory }}/.npmrc
            
            if ./task.sh supports clear-cache > /dev/null; then
              echo "Clearing cache"
              ./task.sh clear-cache
            fi
            
            if ./task.sh supports migrate > /dev/null; then
              echo "Running migrations"
              ./task.sh migrate
            fi
            
            echo "Executing post-deployment command"
            ${{ inputs.post_cmd }}
            
            if ./task.sh supports init > /dev/null; then
              ./task.sh init
            fi

            # Reached only if every command above succeeded - this is what the step below looks for
            echo "complete" > "$DEPLOYMENT_STATUS_FILE"

      # A deployment is called successful on two conditions, not one: the step above did not fail,
      # AND the script itself says it reached its last line. The second is what makes the verdict
      # independent of an exit code surviving the trip back through the remote shell, the SSH
      # session and the action - if the script stopped early it wrote why, and if it never got to
      # write anything at all the file is missing. Either way this step fails, whatever the step
      # above concluded. It catches a dropped session and a killed shell for the same reason
      - name: Verify the deployment ran to completion
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ inputs.host }}
          username: ${{ inputs.username }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ inputs.port }}
          command_timeout: 1m
          script: |
            set -eu

            status_file="/tmp/ci-deployment-${{ github.run_id }}-${{ github.run_attempt }}.status"

            if [ ! -f "$status_file" ]; then
              echo "❌ The deployment left no status behind - it did not reach its last line, so the server is in an unknown state. The deployment output above ends where it stopped"
              exit 1
            fi

            status="$(cat "$status_file")"
            rm -f "$status_file"

            if [ "$status" != "complete" ]; then
              echo "❌ The deployment reported: $status"
              exit 1
            fi

            echo "✅ The deployment script ran to completion"
