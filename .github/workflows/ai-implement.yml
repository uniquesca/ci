name: AI Implement

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key used to call the AI implementing agent'
        required: true
      AI_IMPLEMENT_APP_ID:
        description: 'GitHub App id for the AI Implement app. The app pushes branches and opens or updates pull requests, so QA workflows start from a real app event and the pull request author is distinct from the reviewer'
        required: true
      AI_IMPLEMENT_PRIVATE_KEY:
        description: 'Private key for the AI Implement GitHub App. Used only to mint a short-lived installation token; never passed to the agent'
        required: true
      COMPOSER_ACCESS_TOKEN:
        description: 'Access token for cloning Uniques private Composer repositories, so that the agent can run this project''s checks against installed dependencies rather than guessing at what they would have said. Optional: without it a repository whose dependencies are all public still installs, and one with private dependencies falls back to the artifact reports as before'
        required: false
      NPM_ACCESS_TOKEN:
        description: 'Access token for the Uniques private NPM registry on npm.pkg.github.com, which is where the `@uniquesca` scope is served from. The Composer token''s counterpart for a JavaScript repository, and it buys the same thing: `node_modules` is where `tsc`, the framework CLI and the test runners live, so an agent without it has nothing to run. Optional, on the same terms'
        required: false
      ENV_VARIABLES:
        description: 'JSON object of configuration tokens this repository''s config templates are rendered with. Read only when the application is brought up, which is what renders the templates. These reach a shell the agent controls, so give it a test environment''s credentials and never production''s'
        required: false
    inputs:
      command:
        description: 'Comment command that triggers the implementation, has to be at the very beginning of the comment. On an issue it starts the work - or runs a round on the pull request already implementing it, when the plan has been revised since that work last read it; on the pull request it always runs a round'
        required: false
        default: '/ai-do'
        type: string
      allowed_permissions:
        description: 'Space-separated repository permission levels allowed to run the command. Github reports the maintain role as `write` and the triage role as `read`, so `admin write` covers owners, maintainers and developers'
        required: false
        default: 'admin write'
        type: string
      allowed_bots:
        description: 'Space-separated bot logins allowed to trigger a round. The collaborators API has no answer for a bot, so bots are checked against this list instead. This is what a reviewing agent has to be named to hand work back, so it has to carry the AI Review app''s own bot login - `<app-slug>[bot]`, which is the app name lowercased and hyphenated. A review from a login that is not here starts no round, and says so on the pull request'
        required: false
        default: 'github-actions[bot] ai-review[bot]'
        type: string
      timeout_minutes:
        description: 'How long the whole job may run. Keep it a few minutes above agent_timeout_minutes, so that a run the agent overruns still has time to say so'
        required: false
        default: 65
        type: number
      agent_timeout_minutes:
        description: 'How long the implementing agent itself may run before it is given up on'
        required: false
        default: 60
        type: number
      max_turns:
        description: 'How many turns the agent may spend before it has to stop with what it has. A ceiling to work under rather than one the agent is held to - the SDK enforces it exactly on a short run and lets a long one past it, so leave room above what a round here actually costs'
        required: false
        default: 60
        type: number
      model:
        description: 'Model used to implement the plan and to act on review feedback'
        required: false
        default: 'claude-opus-4-8'
        type: string
      branch_prefix:
        description: 'Prefix of the branch the work is pushed to. The branch is this plus `issue-<number>`, which is what ties a pull request back to its issue. Only branches carrying this prefix are ever worked on, which is also what keeps a review on somebody else fork from starting an agent'
        required: false
        default: 'ai-feature/'
        type: string
      max_unattended_rounds:
        description: 'How many rounds in a row a bot may trigger before a person has to look. Rounds a person asked for are not counted and reset this to zero. Without a bound, a reviewing agent and this one can hand work back and forth until the API key runs dry'
        required: false
        default: 5
        type: number
      ignore_check_patterns:
        description: 'Case-insensitive regular expression matching check runs to leave out of the feedback. The AI workflows report their own check runs on the same commit, and a run that reads its own red status back as a code defect goes in circles'
        required: false
        default: '(ai.implement|ai.plan|ai.review)'
        type: string
      dispatch_review:
        description: 'Ask a reviewing agent to look at the work as soon as it is pushed, by sending a `repository_dispatch` event. Off by default: turn it on once a workflow is subscribed to that event, or the dispatch goes nowhere. Nothing is dispatched for a round that changed no file - re-reviewing the same commit produces the same review and the loop makes no progress'
        required: false
        default: false
        type: boolean
      review_dispatch_type:
        description: 'The `repository_dispatch` event type the reviewing workflow listens for. Keep it the same as the reviewing workflow dispatch_type'
        required: false
        default: 'ai-review'
        type: string
      request_review:
        description: 'Ask the person who triggered a round to review the pull request when it finishes. Submitting a review clears their pending request, so this is what puts an answered round back in their queue - including a round that changed no file, where the agent pushed back with a reason they need to read. Skipped when a bot triggered the round, and when that person opened the pull request themselves - Github rejects both as requested reviewers'
        required: false
        default: true
        type: boolean
      review_check_patterns:
        description: 'Case-insensitive regular expression matching the reviewing agent own check runs. A round triggered by one of the two things that run after a push waits for the other to finish, and this is how it recognises the reviewer still working. Deliberately separate from `ignore_check_patterns`, which hides those same check runs from the feedback - the gate has to see what the feedback must not'
        required: false
        default: 'ai.review'
        type: string
      provision_checks:
        description: 'Set the runner up before the agent starts - bring this repository''s application up in Docker with its config templates rendered, install its dependencies - and tell it the exact commands CI will check its work with, so that it finds a broken linter itself instead of on the next round. Detected from the repository rather than configured: what is there decides what is done. The master switch for all of it: turn it off and nothing is prepared, and the agent works out what it can run for itself'
        required: false
        default: true
        type: boolean
      spin_up_docker:
        description: 'Bring this repository''s application up in Docker before the agent starts, when it has a `task.sh` or a compose file. That is what lets a repository whose checks run inside its container have them run at all - the agent is given the `task.sh` commands it supports. Costs whatever pulling the images and starting the containers takes, so `timeout_minutes` needs room above `agent_timeout_minutes` for it'
        required: false
        default: true
        type: boolean
      docker_profile:
        description: 'Docker Compose profile to bring up, for a repository whose test services are behind one'
        required: false
        default: ''
        type: string
      node_version:
        description: 'Node version the JavaScript dependencies are installed under, and the one the agent runs this project''s Node tooling with. The same default as the NPM QA checks workflow, so the two agree unless both are changed. `_ci_environment.json` describes only PHP, so there is nothing in the repository to read this from'
        required: false
        default: 20
        type: number
      debug:
        description: 'Log the raw agent transcript as JSON, on top of the readable summary that is always printed. Tool results contain whatever the agent read, so do not turn this on in a public repository'
        required: false
        default: false
        type: boolean

jobs:
  implement:
    name: Implement the plan
    # Four ways in. `/ai-do` on an issue starts the work. `/ai-do` on the pull request runs
    # another round of it. A submitted review asking for changes runs a round without anybody
    # typing a command - which is the whole point, because that review may come from an agent.
    # And a finished QA workflow runs one too, so that a red check reaches the agent even when
    # the reviewer had nothing to say about it.
    #
    # The last two race each other: they start in parallel after a push and finish in either
    # order. Neither is filtered on its outcome here - the gate below works out whether the
    # other one is still running, and `has_feedback` works out whether there is anything to do.
    # A `cancelled` or `skipped` QA run is the one case worth dropping outright, because it
    # concluded without ever reporting on the commit.
    #
    # The webhook reports `changes_requested`, while the REST API reports
    # `CHANGES_REQUESTED` for the same review. It does not matter here, because `==` in a
    # Github expression is case-insensitive - but it matters anywhere the two are compared in
    # bash or jq, which is why the staging action lowercases what it reads from REST.
    #
    # An `approved` or `commented` review deliberately does not trigger a round by itself.
    # Requesting changes is a decision, and it batches every inline comment in that review into
    # one round. A `commented` review still reaches the agent - the next round to run for any
    # reason stages it out of the feedback like anything else.
    #
    # Both of those broad triggers are narrowed to branches this workflow could have pushed,
    # because both fire on pull requests that have nothing to do with it - every review in the
    # repository, and every QA run on every branch. This is a job-level `if`, so a run that does
    # not match is reported as *skipped* and never takes a runner. Nothing else can produce that
    # conclusion: a job that has started can only end up success, failure, cancelled or timed
    # out, so a job that works out it has nothing to do after starting is green at best.
    #
    # A pre-filter and not the real test. `startsWith` in a Github expression is case-insensitive
    # while git branch names are not, and neither branch here proves the pull request is open or
    # that its head is what the event claimed. `Resolve the pull request` below re-checks all of
    # it against what the API says, and that check is the one that decides.
    if: >-
      ${{ (github.event_name == 'issue_comment'
           && github.event.action == 'created'
           && startsWith(github.event.comment.body, inputs.command))
          || (github.event_name == 'pull_request_review'
              && github.event.action == 'submitted'
              && github.event.review.state == 'changes_requested'
              && github.event.pull_request.head.repo.full_name == github.repository
              && startsWith(github.event.pull_request.head.ref, inputs.branch_prefix))
          || (github.event_name == 'workflow_run'
              && github.event.workflow_run.conclusion != 'cancelled'
              && github.event.workflow_run.conclusion != 'skipped'
              && github.event.workflow_run.head_repository.full_name == github.repository
              && startsWith(github.event.workflow_run.head_branch, inputs.branch_prefix)) }}
    runs-on: ubuntu-latest
    # Github expressions have no arithmetic, so this cannot be derived from the agent's
    # budget - the two are separate inputs, and the defaults leave five minutes between
    # them. That gap matters: a job timeout cancels every remaining step, so if the agent
    # were allowed to run right up to it, it would take the failure comment down with it
    # and nothing would be said anywhere.
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # Two rounds on one pull request must not run at once - they would push over each other
    # on the same branch. Queued rather than cancelled, so the second round starts from what
    # the first one pushed.
    #
    # Cancelling instead would be worse than the duplicate it prevents: a round killed
    # mid-flight loses whatever the agent had edited but not pushed, or lands commits whose
    # replies never get posted so every review thread still reads unanswered - and the agent
    # tokens are spent either way. A queued duplicate is cheap, because the first round's push
    # moves the head SHA and the gate below then stands the duplicate down in seconds.
    #
    # Keyed on whatever the event can say about the work, which is not the same thing in each
    # of them, and no expression here can look anything up. A `workflow_run` carries only the
    # branch. A comment on an *issue* carries only the issue number - and a round can start from
    # one, so it is keyed on the branch that issue builds rather than on the number, which is
    # what puts it in the same group as the QA-triggered rounds already running on that branch.
    #
    # A comment on a pull request, and a review, carry only the number: neither payload says
    # which branch it is about, so those two share a group with each other and cannot be made to
    # share one with the other two without a separate job to resolve the branch first. What that
    # leaves is two people acting on the same work in the same minute - and the loser of that
    # race has its push refused as non-fast-forward rather than pushing over anything.
    concurrency:
      group: >-
        ai-implement-${{ github.repository }}-${{
          github.event.issue.pull_request == null
            && github.event.issue.number
            && format('{0}issue-{1}', inputs.branch_prefix, github.event.issue.number)
          || github.event.issue.number
          || github.event.pull_request.number
          || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      # Wider than the planner needs, because this one pushes a branch and opens a pull
      # request. It never writes to the default branch: everything lands on a branch of
      # its own, behind a pull request somebody has to review and merge.
      contents: write
      issues: write
      pull-requests: write
      # Failing checks are part of the feedback, and their annotations are what make a broken
      # linter as actionable as a review comment. Without this the checks are simply staged
      # as an empty list.
      checks: read
      # Artifacts live under the Actions API, so without this the check reports cannot be
      # listed or downloaded and the agent is back to guessing at why a check went red. A
      # reusable workflow cannot hold a permission its caller does not grant, so the caller
      # needs this too.
      actions: read
      # What lets the run's own token pull this organisation's images from ghcr.io when the
      # application is brought up. The same caller rule applies as above.
      #
      # Not sufficient on its own: an image first pushed to ghcr.io with a personal access token
      # is linked to no repository, and `GITHUB_TOKEN` is refused for it until that package grants
      # this repository the Read role under Package settings, Manage Actions access.
      packages: read
    env:
      # Set for every `gh` call below - no checkout is needed to resolve the repository this way
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # Everything that pushes, or that opens the pull request, runs on the AI Implement app's
      # installation token instead. It is minted in a step rather than here, because job env cannot
      # call an action: the two git steps and the pull request step read it out of
      # `steps.ai_implement`.
      #
      # Why the app and not this job's own token. Github will not start a workflow run from an event
      # made with `GITHUB_TOKEN`, and `workflow_run` inherits that from the run it chains to - so a
      # branch pushed by `GITHUB_TOKEN` produces a `pull_request` run parked at `action_required`
      # whose completion then starts nothing. An app is a real identity, so the QA trigger fires.
      #
      # It is also what keeps the review loop legal. Github rejects `REQUEST_CHANGES` from the
      # identity that opened the pull request, so the implementing app opens it and a *second* app
      # reviews it. Two apps, never one.

      # Any guard below can set this to false in $GITHUB_ENV, and every step after it stands
      # down. A job cannot stop itself early without failing, and failing is wrong for most
      # of what the guards catch - running the command too early, or on the wrong pull
      # request, is not a CI error. Nor can a running job report itself as *skipped*: that
      # conclusion only comes from the job-level `if`, which is why the branch check above is
      # duplicated there for the triggers whose payload can answer it.
      #
      # **Every step that does work must test `env.PROCEED == 'true'` in its `if`.** The three
      # that deliberately do not are the two `always()` reporters at the end and the step that
      # answers a stood-down command - and that one fires precisely *because* PROCEED is false.
      # Missing this test does not fail loudly: the step simply runs after the job has given up,
      # against half-set outputs. That is how `Resolve the pull request` came to run with an
      # empty pull request number and take the whole job down with `gh pr view ""` on every
      # push to a branch with no open pull request.
      PROCEED: 'true'
      # Shared with the staging and reply actions, which look for exactly these. The round
      # marker is how a later round finds the previous one; the reply marker is how it tells
      # a thread the agent has answered from one still waiting.
      ROUND_MARKER: '<!-- ai-implement-round -->'
      REPLY_MARKER: '<!-- ai-implement-reply -->'
      # The pair that delimits the plan's QA criteria in the pull request body. Printed empty
      # when the body is composed, so the block lands where it belongs rather than at the end,
      # and filled in - and refilled, whenever the plan moves - by `ai-qa-criteria`. Both ends
      # are named here because the workflow and the action have to agree on them.
      QA_MARKER: '<!-- ai-qa-criteria -->'
      QA_END_MARKER: '<!-- /ai-qa-criteria -->'
      # First line of a review the reviewing workflow submitted. Identity is not enough to
      # recognise one: which login the reviewer arrives as is the caller's to decide - the AI
      # Review app is named per repository, and a caller still on a machine user's token reads
      # as a `User` rather than a `Bot` at all. Keying off the marker as well is what keeps the
      # unattended round cap working whatever the reviewer was configured with.
      REVIEW_MARKER: '<!-- ai-review -->'
    steps:
      # Minted once and used only by workflow-owned git and API steps. The agent never receives it,
      # and the checkout still persists no credentials, so the app can push and open the pull
      # request without giving the agent a way to do either itself.
      #
      # Unconditional, and first. Both secrets are `required: true`, so there is nothing to guard
      # against - and a guard here would be worse than none: a skipped step still leaves its
      # outputs readable as empty strings, which is how the commit identity below would end up
      # being the literal `[bot]` and the push would quietly fall back to a token that triggers
      # nothing. Failing loudly on an app that is not installed on this repository is the point.
      - name: Create AI Implement app token
        id: ai_implement
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AI_IMPLEMENT_APP_ID }}
          private-key: ${{ secrets.AI_IMPLEMENT_PRIVATE_KEY }}

      # Both of these run before anything else, because `Work out what this run is` needs their
      # answers to say what this run is: the command on an issue whose work is already open and
      # whose plan has moved is a round, and a round has to be one from the start - the mode, the
      # pull request and the branch are settled in that step and read by every step after it.
      #
      # Read-only, and in front of the permission gate for that reason. Neither answers anybody
      # or writes anything; the gate still stands in front of every step that does.
      - name: Find the pull request for the issue
        id: existing_pr
        if: >-
          ${{ success()
          && github.event_name == 'issue_comment'
          && github.event.issue.pull_request == null }}
        env:
          ISSUE: ${{ github.event.issue.number }}
          BRANCH: ${{ inputs.branch_prefix }}issue-${{ github.event.issue.number }}
        run: |
          gh pr list --head "$BRANCH" --state all --json number,state,url,baseRefName,createdAt \
            --jq 'sort_by(.number) | last // {}' > "$RUNNER_TEMP/existing.json"

          number=$(jq -r '.number // ""' "$RUNNER_TEMP/existing.json")
          state=$(jq -r '.state // ""' "$RUNNER_TEMP/existing.json")

          # Where the last round drew its watermark, or when the pull request was opened if no
          # round has run yet. `ai-stage-pull-request` works `since` out exactly this way for a
          # round, off the same marker comments and the metadata line under each - done here
          # because the question of whether this run is a round at all is what needs the answer.
          since=''
          if [[ "$state" == 'OPEN' ]]; then
            since=$(
              gh api --paginate --slurp "repos/$GH_REPO/issues/$number/comments" \
                | jq -r --arg marker "$ROUND_MARKER" '
                    flatten
                    | map(select(.user.type == "Bot" and (.body | startswith($marker))))
                    | map(.body
                          | split("\n")
                          | (.[1] // "")
                          | ltrimstr("<!-- ") | rtrimstr(" -->")
                          | (try fromjson catch {}))
                    | last | .staged_at // ""'
            )
            [[ -z "$since" ]] && since=$(jq -r '.createdAt // ""' "$RUNNER_TEMP/existing.json")
          fi

          {
            printf 'state=%s\n' "$state"
            printf 'number=%s\n' "$number"
            printf 'since=%s\n' "$since"
          } >> "$GITHUB_OUTPUT"

          if [[ -n "$state" ]]; then
            echo "Issue #$ISSUE has a pull request at #$number ($state)${since:+, standing at $since}"
          else
            echo "Issue #$ISSUE has no pull request yet"
          fi

      # When the plan was posted, which is the other half of that comparison. Only worth asking
      # when there is an open pull request to compare it against.
      #
      # The staging action rather than a filter of its own: which comment is the plan is that
      # action's rule - bot-authored, carrying the marker, newest of them - and a second copy of
      # the rule here is one that drifts out of step with it. Into `$RUNNER_TEMP` because nothing
      # is checked out yet; the staging the agent reads happens further down, into the working
      # tree, and this one is thrown away with the runner.
      - name: Find when the plan was last posted
        id: plan_at
        if: ${{ success() && steps.existing_pr.outputs.state == 'OPEN' }}
        uses: uniquesca/ci/ai-stage-issue@main
        with:
          issue: ${{ github.event.issue.number }}
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          directory: ${{ runner.temp }}/existing-plan-check

      # Two event shapes carry the same work, and nothing below should have to care which one
      # it got. Everything after this reads these outputs rather than `github.event`, which is
      # also where the next trigger - a reviewing agent, a red suite - will slot in.
      - name: Work out what this run is
        id: event
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Github sets this object only on a comment that belongs to a pull request. It is
          # the only thing separating the two `issue_comment` cases.
          IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
          COMMENT_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
          COMMENT_ACTOR_TYPE: ${{ github.event.comment.user.type }}
          # Untrusted text, on the same terms as the review body below. Only the first line is
          # looked at, and only for an argument on the command.
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMAND: ${{ inputs.command }}
          REVIEW_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ACTOR: ${{ github.event.review.user.login }}
          REVIEW_ACTOR_TYPE: ${{ github.event.review.user.type }}
          # Untrusted text, read here and never interpolated into a script. Only its first line
          # is ever looked at, and only to compare against a marker.
          REVIEW_BODY: ${{ github.event.review.body }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
          RUN_ACTOR_TYPE: ${{ github.event.workflow_run.actor.type }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          # What the two steps above found: the open pull request already implementing this
          # issue, the watermark its work stands at, and when the plan was last posted. All
          # three are empty for every other trigger, and for an issue with nothing open.
          OPEN_PR: ${{ steps.existing_pr.outputs.state == 'OPEN' && steps.existing_pr.outputs.number || '' }}
          PLAN_SINCE: ${{ steps.existing_pr.outputs.since }}
          PLAN_AT: ${{ steps.plan_at.outputs.plan_created_at }}
        run: |
          if [[ "$EVENT_NAME" == 'workflow_run' ]]; then
            mode='round'; trigger='checks'
            issue=''
            actor="$RUN_ACTOR"; actor_type="$RUN_ACTOR_TYPE"

            # Resolved from the branch rather than from `workflow_run.pull_requests`: that array
            # is empty whenever the workflow it describes was triggered by a push, which is the
            # ordinary case for a branch this workflow pushed. The branch is what ties the two
            # together, and it is unique per pull request here.
            pull_request=$(gh pr list --head "$RUN_BRANCH" --state open \
              --json number --jq '.[0].number // empty' 2> /dev/null || true)

            if [[ -z "$pull_request" ]]; then
              echo "PROCEED=false" >> "$GITHUB_ENV"
              echo "'$RUN_NAME' finished on $RUN_BRANCH, which has no open pull request - nothing to do"
            fi
          elif [[ "$EVENT_NAME" == 'pull_request_review' ]]; then
            mode='round'; trigger='review'
            pull_request="$REVIEW_NUMBER"; issue=''
            actor="$REVIEW_ACTOR"; actor_type="$REVIEW_ACTOR_TYPE"
          elif [[ "$IS_PULL_REQUEST" == 'true' ]]; then
            mode='round'; trigger='pr-command'
            pull_request="$COMMENT_NUMBER"; issue=''
            actor="$COMMENT_ACTOR"; actor_type="$COMMENT_ACTOR_TYPE"
          else
            trigger='issue-command'
            issue="$COMMENT_NUMBER"
            actor="$COMMENT_ACTOR"; actor_type="$COMMENT_ACTOR_TYPE"

            # The command on an issue starts the work. Once the work is open it is a round
            # instead, and only when the plan has moved since that work last read it: somebody
            # has revised the plan and is asking for the branch to be brought in line with it,
            # which is the one thing this command can do that a review cannot. An open pull
            # request whose plan has not moved is not this run's business - the step further
            # down points the person at it and stands the run down.
            #
            # Both timestamps are fixed-width UTC, which is what makes comparing them as strings
            # the same as comparing them as times - `Notice a plan revised since the last round`
            # sets that out at length. That step asks the same question again once the round is
            # under way, off the same two values, and its answer is what the agent is told.
            if [[ -n "$OPEN_PR" && -n "$PLAN_AT" && -n "$PLAN_SINCE" && "$PLAN_AT" > "$PLAN_SINCE" ]]; then
              mode='round'; pull_request="$OPEN_PR"
              echo "The plan was revised at $PLAN_AT, after the $PLAN_SINCE #$OPEN_PR stands at - running a round there rather than starting the work again"
            else
              mode='initial'; pull_request=''
            fi
          fi

          # `base=<branch>` on the command, which asks for the work to be based on something
          # other than the default branch. Read only from the very start of the first line:
          # everything else in the comment is instruction text for the agent, and a sentence
          # that happens to mention `base=` is not a request to retarget anything.
          #
          # Parsed here and judged later. This step runs in front of the permission gate, so
          # nothing here may answer the commenter or look anything up on their behalf - all it
          # does is say what was asked for.
          #
          # The code below also lives in ai-plan.yml, which takes the same argument on its own
          # command. Keep the two identical: the test extracts both and runs them against one
          # case list, so a change to one of them fails until the other follows.
          base_given='false'
          requested_base=''
          if [[ -n "$COMMENT_BODY" ]]; then
            first_line=${COMMENT_BODY%%$'\n'*}
            # Github stores comment bodies with CRLF line endings
            first_line=${first_line%$'\r'}

            # The job gate is a `startsWith`, so a comment opening with `/ai-doughnut` reaches
            # this too. Requiring whitespace after the command is what stops the tail of a
            # longer word being read as an argument.
            rest=${first_line#"$COMMAND"}

            if [[ "$rest" =~ ^[[:space:]]+base=([^[:space:]]*) ]]; then
              base_given='true'
              requested_base="${BASH_REMATCH[1]}"

              # ``base=`develop` `` is what somebody writing markdown types, and the backticks
              # are not part of the branch name. One wrapping pair, of one kind.
              for quote in '`' "'" '"'; do
                if [[ "$requested_base" == "$quote"*"$quote" ]]; then
                  requested_base=${requested_base:1:${#requested_base}-2}
                  break
                fi
              done

              # An empty value stays a request rather than becoming no request at all. Falling
              # back to the default branch here would quietly open the pull request against
              # exactly the branch the person was trying to avoid.
              echo "Asked to base the work on '${requested_base}'"
            fi
          fi

          # A round a person asked for is attended, and an attended round resets the cap on
          # unattended ones. This is the only thing that distinguishes the two, and it is
          # deliberately about who triggered the round rather than who wrote the feedback: a
          # person acting on an agent's review is still a person looking at the work.
          attended='true'
          [[ "$actor_type" == 'Bot' ]] && attended='false'

          # A review the reviewing agent wrote is a machine's, whichever account submitted it.
          # Anyone can paste this marker into a review of their own, and all that does is make
          # their own round count against the cap - it can only ever stop the loop sooner,
          # never let it run longer.
          if [[ "$trigger" == 'review' && "$REVIEW_BODY" == "$REVIEW_MARKER"* ]]; then
            attended='false'
          fi

          # A round that a finished QA workflow started is never attended, whoever pushed the
          # commit it ran on. The actor there is whoever triggered that workflow, which is not
          # somebody asking for a round - and treating it as attended would both skip the wait
          # below and reset the cap that stops two machines talking to each other.
          if [[ "$trigger" == 'checks' ]]; then
            attended='false'
          fi

          # Where anything said about this run goes. On a pull request the conversation is
          # the issues comment list - Github stores both in one place, which is why
          # `gh issue comment` works on a pull request number.
          target="${pull_request:-$issue}"

          # Where a reply to whoever triggered it goes, which is not always the same thread. A
          # round asked for from an issue runs on the pull request, and `target` follows the
          # work - but the person is looking at the issue they typed in, and being told there
          # that they may not run the command beats being told somewhere they are not reading.
          answer_to="${issue:-$pull_request}"

          {
            printf 'mode=%s\n' "$mode"
            printf 'trigger=%s\n' "$trigger"
            printf 'pull_request=%s\n' "$pull_request"
            printf 'issue=%s\n' "$issue"
            printf 'actor=%s\n' "$actor"
            printf 'actor_type=%s\n' "$actor_type"
            printf 'attended=%s\n' "$attended"
            printf 'target=%s\n' "$target"
            printf 'answer_to=%s\n' "$answer_to"
            printf 'base_given=%s\n' "$base_given"
            printf 'requested_base=%s\n' "$requested_base"
          } >> "$GITHUB_OUTPUT"

          echo "$mode run on #$target, triggered by $trigger from @$actor ($actor_type, attended: $attended)"

      # A round works on a branch this workflow pushed, and on no other. Both broad triggers
      # fire on pull requests nobody here created - including pull requests from forks, which
      # `issue_comment` and `pull_request_review` run with a write token and full access to
      # secrets. Checking out fork code and handing it a shell with ANTHROPIC_API_KEY in the
      # environment is exactly what this step exists to prevent.
      #
      # Deliberately in front of the permission gate, and read-only because of it. "Is this even
      # our pull request" has to be settled before "may this person run the command", or the
      # refusal below gets posted on pull requests this workflow has nothing to do with - which
      # is a stranger's review thread telling them off for a command they never typed. Nothing
      # here answers anybody; the one reply this step used to post is now its own step, after the
      # gate. The gate itself still stands in front of everything that checks out code, stages
      # anything or starts an agent, which is what it is actually for.
      - name: Resolve the pull request
        id: pull_request
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.event.outputs.mode == 'round' }}
        env:
          PR: ${{ steps.event.outputs.pull_request }}
          PREFIX: ${{ inputs.branch_prefix }}
        run: |
          gh pr view "$PR" --json number,state,title,url,baseRefName,headRefName,headRefOid,headRepositoryOwner,headRepository \
            > "$RUNNER_TEMP/pull-request.json"

          state=$(jq -r '.state' "$RUNNER_TEMP/pull-request.json")
          head_ref=$(jq -r '.headRefName' "$RUNNER_TEMP/pull-request.json")
          head_repo="$(jq -r '.headRepositoryOwner.login' "$RUNNER_TEMP/pull-request.json")/$(jq -r '.headRepository.name' "$RUNNER_TEMP/pull-request.json")"

          reason=''
          if [[ "$head_repo" != "$GH_REPO" ]]; then
            reason="its branch lives in \`$head_repo\` rather than in this repository"
          elif [[ "$head_ref" != "$PREFIX"* ]]; then
            reason="its branch \`$head_ref\` was not created by this workflow"
          elif [[ "$state" != 'OPEN' ]]; then
            reason="it is $(echo "$state" | tr '[:upper:]' '[:lower:]')"
          fi

          if [[ -n "$reason" ]]; then
            echo "PROCEED=false" >> "$GITHUB_ENV"

            # Read by the step that answers a typed command, which is the only trigger this is
            # ever said out loud for
            printf 'stand_down=%s\n' "$reason" >> "$GITHUB_OUTPUT"

            echo "Standing down on #$PR: $reason"
            exit 0
          fi

          # The branch name carries the issue number, which is what lets a round read the
          # plan it is still working to. Derived rather than looked up in the pull request
          # body, because the branch is this workflow's own construction and the body is
          # editable prose.
          issue="${head_ref##*issue-}"
          if [[ ! "$issue" =~ ^[0-9]+$ ]]; then
            echo "::error title=Cannot find the issue::Branch $head_ref carries no issue number"
            exit 1
          fi

          {
            printf 'issue=%s\n' "$issue"
            printf 'branch=%s\n' "$head_ref"
            printf 'head_sha=%s\n' "$(jq -r '.headRefOid' "$RUNNER_TEMP/pull-request.json")"
            printf 'base=%s\n' "$(jq -r '.baseRefName' "$RUNNER_TEMP/pull-request.json")"
            printf 'title=%s\n' "$(jq -r '.title' "$RUNNER_TEMP/pull-request.json" | tr -d '\r\n')"
            printf 'url=%s\n' "$(jq -r '.url' "$RUNNER_TEMP/pull-request.json")"
          } >> "$GITHUB_OUTPUT"

          echo "Round on #$PR, branch $head_ref, implementing issue #$issue"

      # Deliberately not gated on PROCEED. A run that has already stood down still needs an
      # answer here, because the step below it only speaks to somebody the gate approved - and
      # working out whether it approved them is this step's whole job.
      - name: Check the actor is allowed to run this
        id: permissions
        env:
          ALLOWED: ${{ inputs.allowed_permissions }}
          ALLOWED_BOTS: ${{ inputs.allowed_bots }}
          ACTOR: ${{ steps.event.outputs.actor }}
          # Deliberately the actor's type and not `attended`. The two used to be the same test,
          # because only a bot produced an unattended round - but a round a finished QA workflow
          # started is unattended whoever pushed the commit, so a person's login would have been
          # looked up in the bot list and refused with "your access level is bot".
          ACTOR_TYPE: ${{ steps.event.outputs.actor_type }}
        run: |
          allowed='false'

          if [[ "$ACTOR_TYPE" == 'Bot' ]]; then
            # The collaborators API has no answer for a bot - it 404s, which would read as
            # "not allowed" and make an agent-triggered round impossible. Bots are checked
            # against an explicit list of logins instead.
            permission='bot'
            for login in $ALLOWED_BOTS; do
              if [[ "$ACTOR" == "$login" ]]; then
                allowed='true'
                break
              fi
            done
          elif permission=$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" --jq '.permission' 2> error.log); then
            echo "@$ACTOR has the '$permission' permission in $GH_REPO"
            for level in $ALLOWED; do
              if [[ "$permission" == "$level" ]]; then
                allowed='true'
                break
              fi
            done
          elif grep -q 'Not Found' error.log; then
            # Not a collaborator at all - expected, no permission to run the command
            permission='none'
          else
            # Anything other than a 404 is a real failure, do not silently treat it as a refusal
            cat error.log
            echo "::error title=Permission check failed::Could not read the permissions of @$ACTOR"
            exit 1
          fi

          echo "permission=$permission" >> "$GITHUB_OUTPUT"
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

          # The agent action has an `allowed_bots` of its own and refuses to run for a bot
          # actor that is not in it - which is every round handed back by a reviewing agent.
          # Its list is comma-separated where this input is space-separated, and it is not
          # documented whether it matches `github-actions[bot]` or the bare `github-actions`,
          # so each login goes in both ways.
          csv=''
          for login in $ALLOWED_BOTS; do
            csv="${csv:+$csv,}$login,${login%\[bot\]}"
          done
          echo "bots_csv=$csv" >> "$GITHUB_OUTPUT"

      # Refusals stop the job, so the steps below only ever run for an allowed actor. This
      # gate is what keeps an agent with a shell and write access out of the hands of anyone
      # who can merely comment on an issue or leave a review.
      #
      # Only ever on something this workflow owns. A run that has already stood down has no
      # business telling anybody off: the pull request is not ours, nobody asked for anything,
      # and on the `workflow_run` path there is not even a number to comment on. Standing down
      # silently is the whole point - so this refuses nothing and the job ends green.
      - name: Refuse the request
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.permissions.outputs.allowed != 'true' }}
        env:
          COMMAND: ${{ inputs.command }}
          PERMISSION: ${{ steps.permissions.outputs.permission }}
          ACTOR: ${{ steps.event.outputs.actor }}
          TARGET: ${{ steps.event.outputs.answer_to }}
        run: |
          # PROCEED is true, so there is a pull request or an issue behind this - but a refusal
          # that cannot be posted must still fail the job rather than die on an empty argument
          if [[ -n "$TARGET" ]]; then
            gh issue comment "$TARGET" --body "@$ACTOR you are not allowed to run \`$COMMAND\` in this repository - your access level is \`$PERMISSION\`. Ask an owner, a maintainer or a developer to run it for you." \
              || echo "::warning title=Could not post the refusal::@$ACTOR was refused, but nothing could be said on #$TARGET"
          else
            echo "::warning title=Nowhere to post the refusal::@$ACTOR was refused with no issue or pull request to say so on"
          fi

          echo "::error title=Permission denied::@$ACTOR ($PERMISSION) is not allowed to run $COMMAND"
          exit 1

      # The other half of the step above. A review and a finished QA workflow are broad triggers
      # that fire on pull requests this workflow never touched, and saying so on each one would
      # be noise on somebody else's thread - the job-level `if` now skips most of them outright,
      # and the rest stand down without a word. A typed command is different: a person asked,
      # and deserves an answer.
      #
      # Behind the permission gate, so a command from somebody who could not have run it anyway
      # gets silence rather than an explanation of what this workflow does.
      - name: Say the command does not apply here
        if: >-
          ${{ success()
          && steps.pull_request.outputs.stand_down != ''
          && (steps.event.outputs.trigger == 'pr-command'
              || steps.event.outputs.trigger == 'issue-command')
          && steps.permissions.outputs.allowed == 'true' }}
        env:
          # Two numbers, because they are not always the same one: the pull request the command
          # cannot run on, and the thread the person who typed it is reading
          PR: ${{ steps.event.outputs.pull_request }}
          TARGET: ${{ steps.event.outputs.answer_to }}
          ACTOR: ${{ steps.event.outputs.actor }}
          COMMAND: ${{ inputs.command }}
          PREFIX: ${{ inputs.branch_prefix }}
          REASON: ${{ steps.pull_request.outputs.stand_down }}
        run: |
          gh issue comment "$TARGET" --body "@$ACTOR I cannot run \`$COMMAND\` on #$PR - $REASON. This command only continues work this workflow started, on a \`$PREFIX\` branch of this repository." \
            || echo "::warning title=Could not say the command does not apply::Nothing was posted on #$TARGET"

      # A round asked for on the issue runs on the pull request, which is a thread away from
      # where the person typed. Both ends have to say so: the pull request, or a round appears
      # on it with nothing to explain why, and the issue, or somebody is left watching a thread
      # where nothing more is going to happen.
      #
      # Copying what they typed is also how it reaches the agent. A round reads its feedback off
      # the pull request, and `ai-stage-pull-request` stages every conversation comment posted
      # since the last round - so this one is staged with the rest, and `/ai-do and drop the
      # cache layer while you are there` is not quietly thrown away. It has to be posted before
      # the staging step further down for that to work.
      #
      # `GITHUB_TOKEN` cannot trigger a workflow, which is what keeps this from starting a
      # second round of its own - the comment it posts begins with the command.
      - name: Say where the round asked for on the issue is happening
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.event.outputs.mode == 'round'
          && steps.event.outputs.trigger == 'issue-command' }}
        env:
          ISSUE: ${{ steps.event.outputs.issue }}
          PR: ${{ steps.event.outputs.pull_request }}
          ACTOR: ${{ steps.event.outputs.actor }}
          # Untrusted text. Written to a file rather than interpolated into anything, on the
          # same terms as everywhere else it is read.
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Quoted rather than repeated as this workflow's own words: it is somebody else's
          # text arriving in a thread they did not type it in.
          {
            printf '@%s asked for this round on #%s, where the plan has been revised since this branch was last worked on:\n\n' "$ACTOR" "$ISSUE"
            printf '%s\n' "$COMMENT_BODY" | sed 's/^/> /'
          } > "$RUNNER_TEMP/asked-on-issue.md"

          gh issue comment "$PR" --body-file "$RUNNER_TEMP/asked-on-issue.md" \
            || echo "::warning title=Could not copy the request::#$PR was not told what @$ACTOR asked for on #$ISSUE, so the round runs on the revised plan alone"

          gh issue comment "$ISSUE" --body "@$ACTOR the plan has moved since #$PR was last worked on, so a round is running there now to bring the branch in line with it. Everything it does lands on that pull request - this issue stays where the plan lives." \
            || echo "::warning title=Could not say where the round is::Nothing was posted on #$ISSUE"

      # Everything a first run cannot do anything with. A pull request that is open and built
      # to the plan as it stands is where the work continues - running the command on the issue
      # again would push a round nobody can review in place, and split the conversation across
      # two threads. An open pull request whose plan has moved never reaches this step: the run
      # is a round by then, decided where this event was worked out.
      - name: Send the issue to its pull request
        id: existing
        if: ${{ success() && env.PROCEED == 'true' && steps.event.outputs.mode == 'initial' }}
        env:
          ISSUE: ${{ steps.event.outputs.issue }}
          ACTOR: ${{ steps.event.outputs.actor }}
          COMMAND: ${{ inputs.command }}
        run: |
          number=$(jq -r '.number // ""' "$RUNNER_TEMP/existing.json")
          state=$(jq -r '.state // ""' "$RUNNER_TEMP/existing.json")
          url=$(jq -r '.url // ""' "$RUNNER_TEMP/existing.json")

          # Multi-line bodies are built up in a file rather than written as one quoted
          # argument. A quoted string laid out to match this script's indentation puts several
          # spaces in front of every line after the first, and four spaces in markdown is a
          # code block.
          case "$state" in
            OPEN)
              # The plan has not moved since that pull request last read it - a plan that had
              # would have made this run a round instead, and this step would not be running.
              # So what is left to say is where the work is, and what to do there.
              {
                printf '@%s the work for this issue is already open at %s, so this is not the place to ask for changes any more.\n\n' "$ACTOR" "$url"
                printf 'Review it there: comment on the lines you want changed and submit the review as **Request changes**, and another round starts by itself. `%s` works in that pull request too, if you would rather just say what you want and run it.\n\n' "$COMMAND"
                printf 'This issue is still where the plan lives. Revise it with `/ai-plan` if the approach is wrong rather than the code, then run `%s` here - a plan that has moved is what makes this command a round on that pull request rather than an answer like this one.\n' "$COMMAND"
              } > "$RUNNER_TEMP/redirect.md"
              gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/redirect.md"
              echo "PROCEED=false" >> "$GITHUB_ENV"
              echo "Issue #$ISSUE already has an open pull request at $url, built to the plan as it stands"
              ;;
            MERGED)
              gh issue comment "$ISSUE" --body "@$ACTOR the work for this issue was already merged in $url, so there is nothing here to implement again. Open a new issue for what you want next."
              echo "PROCEED=false" >> "$GITHUB_ENV"
              echo "Issue #$ISSUE was already implemented and merged in $url"
              ;;
            CLOSED)
              # Somebody abandoned the previous attempt. Starting over is reasonable, and the
              # closed pull request is reopened later rather than a second one being opened
              # alongside it.
              #
              # Its base comes along, because reviving it revives what it targeted. That only
              # matters if its branch is still there - if it was deleted, a new branch gets cut
              # and the base is an open question again.
              {
                printf 'reopen=%s\n' "$number"
                printf 'base=%s\n' "$(jq -r '.baseRefName // ""' "$RUNNER_TEMP/existing.json")"
              } >> "$GITHUB_OUTPUT"
              echo "Reviving the closed pull request $url for issue #$ISSUE"
              ;;
            *)
              echo "Issue #$ISSUE has no pull request yet"
              ;;
          esac

      # A branch name typed into a comment, checked before anything is cut from it. Deliberately
      # in front of the checkout: a name that does not exist costs a comment and nothing else,
      # and the check passing is also what guarantees `refs/remotes/origin/<base>` is on disk
      # once the checkout below has fetched.
      #
      # Only for a first run. A round has a pull request, and a pull request already carries its
      # own base - the step after the branch is prepared says so rather than checking anything.
      - name: Check the requested base branch
        id: base
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.event.outputs.mode == 'initial'
          && steps.event.outputs.base_given == 'true' }}
        env:
          BASE: ${{ steps.event.outputs.requested_base }}
          ISSUE: ${{ steps.event.outputs.issue }}
          ACTOR: ${{ steps.event.outputs.actor }}
          COMMAND: ${{ inputs.command }}
        run: |
          if [[ -z "$BASE" ]]; then
            gh issue comment "$ISSUE" --body "@$ACTOR you asked for a base branch but did not name one. Run \`$COMMAND base=<branch>\`, or just \`$COMMAND\` to work from the default branch."
            echo "PROCEED=false" >> "$GITHUB_ENV"
            echo "::warning title=No base branch named::\`base=\` was given with no value"
            exit 0
          fi

          # Defence in depth rather than the real test. It is narrower than git's own rules and
          # rejects the shapes that could be read as something other than a branch name - a
          # leading dash, a `..` traversal - before either use site sees the string. What the
          # name actually has to be is a branch that exists, which is the check below: anything
          # the remote reports back is a valid name by definition.
          if [[ ! "$BASE" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ || "$BASE" == *..* ]]; then
            gh issue comment "$ISSUE" --body "@$ACTOR \`$BASE\` is not a branch name I will work with. Letters, digits, \`.\`, \`_\`, \`-\` and \`/\` only, and not starting with \`-\`."
            echo "PROCEED=false" >> "$GITHUB_ENV"
            echo "::warning title=Base branch rejected::'$BASE' is not an acceptable branch name"
            exit 0
          fi

          # `git/ref/heads/<name>` rather than `branches/<name>`: this is the endpoint documented
          # to take a slash-bearing ref, so `base=release/1.0` resolves instead of 404ing on a
          # path that got cut in half.
          if ! gh api "repos/$GH_REPO/git/ref/heads/$BASE" --silent 2> /dev/null; then
            gh issue comment "$ISSUE" --body "@$ACTOR there is no branch called \`$BASE\` in this repository, so there is nothing to base the work on. Check the name and run \`$COMMAND base=<branch>\` again."
            echo "PROCEED=false" >> "$GITHUB_ENV"
            echo "::warning title=Base branch not found::No branch called '$BASE' in $GH_REPO"
            exit 0
          fi

          echo "Basing the work on $BASE"

      # Full history rather than a shallow clone: this pushes to a branch that may already
      # exist from an earlier round, and a shallow clone makes that awkward.
      - name: Check out the repository
        if: ${{ success() && env.PROCEED == 'true' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The agent runs with a shell and can read the whole working tree - without this,
          # checkout leaves a live `x-access-token:ghs_...` in .git/config for it to find.
          # Fetching and pushing below supply the credential per command instead, so it is
          # never on disk while the agent is running. That is also what stops the agent
          # pushing anything itself, however it is asked to.
          persist-credentials: false

      # The plan is the specification in both modes, and it lives on the issue in exactly one
      # copy. A round reads it too: the code under review is meant to implement it, and a
      # revised plan has to reach the next round without anybody copying it anywhere.
      - name: Stage the issue and its plan
        id: stage_issue
        if: ${{ success() && env.PROCEED == 'true' }}
        uses: uniquesca/ci/ai-stage-issue@main
        with:
          issue: ${{ steps.event.outputs.issue || steps.pull_request.outputs.issue }}
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # No plan is not a failure - the command was simply run too early. Only the first run
      # needs one: by the time there is a pull request the work exists, and a plan somebody
      # has since deleted should not stop a review being acted on.
      - name: Make sure there is a plan to implement
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.event.outputs.mode == 'initial'
          && steps.stage_issue.outputs.has_plan != 'true' }}
        env:
          ISSUE: ${{ steps.event.outputs.issue }}
          ACTOR: ${{ steps.event.outputs.actor }}
          COMMAND: ${{ inputs.command }}
        run: |
          gh issue comment "$ISSUE" --body "@$ACTOR there is no plan on this issue yet, so there is nothing to implement. Run \`/ai-plan\` first, review the plan it posts, then run \`$COMMAND\` again."
          echo "PROCEED=false" >> "$GITHUB_ENV"
          echo "Issue #$ISSUE has no plan comment, nothing to implement"

      # Everything asking for a change, from every source, normalised into one list. This is
      # the round's actual input.
      - name: Stage the review feedback
        id: stage_pr
        if: ${{ success() && env.PROCEED == 'true' && steps.event.outputs.mode == 'round' }}
        uses: uniquesca/ci/ai-stage-pull-request@main
        with:
          pull_request: ${{ steps.event.outputs.pull_request }}
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          head_sha: ${{ steps.pull_request.outputs.head_sha }}
          round_marker: ${{ env.ROUND_MARKER }}
          reply_marker: ${{ env.REPLY_MARKER }}
          ignore_check_patterns: ${{ inputs.ignore_check_patterns }}

      # A plan revised since the last round is work in its own right, and nothing in the feedback
      # amounts to saying so. The planner does leave a note on an open pull request when it revises
      # the plan under it, and that note is staged like any other comment - but a pointer sitting
      # in the feedback list is not the same as knowing the specification underneath the branch has
      # moved, and there is no note at all when the plan moved while the first run was still
      # working. So the timestamps are compared here instead of anything being inferred from what
      # was said.
      #
      # Two things go wrong without it. A round somebody asked for stands down as having nothing to
      # act on while the branch no longer implements what the issue asks for - and a round that runs
      # for some other reason treats the revised plan as background reading, when reconciling the
      # branch against it is the largest thing in front of it.
      #
      # Both timestamps are UTC `%Y-%m-%dT%H:%M:%SZ` - one a Github comment's `created_at`, the
      # other `date -u` in the staging action - and that fixed width is what makes comparing them
      # as strings the same as comparing them as times. Every position that can differ holds a
      # digit, so no collation rule reaches it. `ai-stage-pull-request` compares the same values
      # the same way in jq.
      #
      # The instruction for the agent is built here rather than in the prompt below, where making
      # it conditional would mean one expression several hundred characters wide.
      - name: Notice a plan revised since the last round
        id: revision
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.event.outputs.mode == 'round'
          && steps.stage_issue.outputs.plan_created_at != ''
          && steps.stage_pr.outputs.since != '' }}
        env:
          PLAN_AT: ${{ steps.stage_issue.outputs.plan_created_at }}
          SINCE: ${{ steps.stage_pr.outputs.since }}
        run: |
          if [[ ! "$PLAN_AT" > "$SINCE" ]]; then
            echo "revised=false" >> "$GITHUB_OUTPUT"
            echo "The plan has not moved since the last round drew its watermark at $SINCE"
            exit 0
          fi

          echo "revised=true" >> "$GITHUB_OUTPUT"
          echo "The plan was revised at $PLAN_AT, after the last round's watermark of $SINCE"

          # A paragraph rather than a value, so it goes in as a heredoc - $GITHUB_OUTPUT takes one
          # line per value otherwise. The delimiter is deliberately something no prompt text
          # could contain.
          {
            printf 'instruction<<AI_IMPLEMENT_REVISION\n'
            printf '%s\n' \
              '**The plan was revised after the last round, so the branch you are in was not built to the plan you are reading.**' \
              'Reconcile the whole branch against `.ai-plan/plan.md`, not only the feedback items.' \
              'Work the plan now asks for that the branch does not have is yours to add, and work it no longer asks for is yours to take back out - a dropped step whose code stayed behind is exactly what a revision is meant to correct.' \
              'Read the plan end to end before you start, and say in your final message what you changed for the revision and what you deliberately left alone, citing the ids after each point.' \
              "A revised plan opens by saying what moved in those ids - which steps were dropped, which are new - so that sentence is the shortest route to what this round owes. Ids are stable across a revision, so an item that kept its number is the same item, and a retired one is listed struck through rather than renumbered." \
              'Where the revision and the feedback disagree, the feedback still wins on anything about code somebody has read.'
            printf 'AI_IMPLEMENT_REVISION\n'
          } >> "$GITHUB_OUTPUT"

      # A push starts two things at once - the QA checks and the reviewing agent - and they
      # finish in either order. Whichever finishes first arrives here, sees the other still
      # working, and stands down. Whichever finishes second finds nothing pending and runs one
      # round with both sources already in the feedback.
      #
      # There is no handshake between the two. Both questions are answered by Github's own state
      # on this commit, so neither has to know the other exists, and a lost or duplicated
      # trigger cannot deadlock it.
      #
      # Only unattended rounds wait. Somebody who typed the command wants a round now, not
      # whenever CI happens to finish.
      - name: Wait for the other half of the feedback
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.event.outputs.mode == 'round'
          && steps.event.outputs.attended == 'false' }}
        env:
          HEAD_SHA: ${{ steps.pull_request.outputs.head_sha }}
          CHECKS_PENDING: ${{ steps.stage_pr.outputs.checks_pending }}
          REVIEW_PATTERNS: ${{ inputs.review_check_patterns }}
        run: |
          # The reviewer's own check run is hidden from the staged feedback by
          # `ignore_check_patterns`, so it has to be counted separately here. Asking whether it
          # is still working - rather than whether a review has arrived - is what stops this
          # waiting forever for a reviewer that was never turned on, or that died: neither has
          # a check run in progress.
          review_pending=$(gh api --paginate --slurp \
            "repos/$GH_REPO/commits/$HEAD_SHA/check-runs" 2> /dev/null \
            | jq --arg re "$REVIEW_PATTERNS" '
                [ (map(.check_runs) | flatten)[]
                  | select(.status != "completed")
                  | select(.name | test($re; "i")) ] | length' 2> /dev/null || echo '')

          # An unreadable answer must not hold the round back for ever - carry on and let the
          # feedback be whatever has landed so far
          [[ -z "$review_pending" ]] && review_pending=0

          qa_pending="${CHECKS_PENDING:-0}"
          echo "On $HEAD_SHA: $qa_pending QA check(s) pending, $review_pending reviewer run(s) pending"

          if [[ "$qa_pending" -gt 0 || "$review_pending" -gt 0 ]]; then
            echo "PROCEED=false" >> "$GITHUB_ENV"
            echo "Standing down - whatever is still reporting on this commit will start the round when it finishes"
          fi

      # A round nobody asked for, on a commit where everything passed and the reviewer had
      # nothing to say. Silent on purpose: this fires on every green pull request, and a comment
      # each time would be noise rather than news.
      #
      # A revised plan deliberately does *not* hold this open, though it does hold the asked-for
      # gate below. Rework is a person's decision: they revise the plan, get it right, and then run
      # the command. A round that started because some CI job finished is nobody asking for
      # anything, and rebuilding a branch to a specification still being worked on is worse than
      # waiting to be told. Any round that does run reads the newest plan either way.
      - name: Nothing to act on
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.event.outputs.mode == 'round'
          && steps.event.outputs.trigger == 'checks'
          && steps.stage_pr.outputs.has_feedback != 'true' }}
        run: |
          echo "PROCEED=false" >> "$GITHUB_ENV"
          echo "Nothing to act on for #${{ steps.event.outputs.pull_request }} - no failing check and no unanswered feedback"

      # An empty review, or a command run when everything has already been dealt with. Not a
      # failure, and worth saying rather than starting an agent with nothing to give it. Only
      # for a round somebody asked for - the automatic ones stand down silently above.
      #
      # A revised plan is enough on its own here, and only here: somebody typed the command or
      # submitted a review, so this is the rework being asked for. The automatic gate above
      # deliberately does not do the same - see the note there.
      #
      # Belt and braces for a command, which by the time the staging action reads the conversation
      # has its own comment in the feedback. What it does catch is a review submitted with no body
      # whose threads have all been answered, which otherwise stands down while the specification
      # has moved underneath it.
      - name: Make sure there is feedback to act on
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.event.outputs.mode == 'round'
          && steps.event.outputs.trigger != 'checks'
          && steps.stage_pr.outputs.has_feedback != 'true'
          && steps.revision.outputs.revised != 'true' }}
        env:
          PR: ${{ steps.event.outputs.pull_request }}
          ACTOR: ${{ steps.event.outputs.actor }}
          SINCE: ${{ steps.stage_pr.outputs.since }}
        run: |
          {
            printf '@%s I could not find anything to act on: no unresolved review thread, nothing said since %s, and no failing check.\n\n' "$ACTOR" "$SINCE"
            printf 'If you left inline comments, submit the review so they become visible. A thread the agent has already answered stays out of the way until somebody replies to it again or resolves it.\n'
          } > "$RUNNER_TEMP/nothing-to-do.md"
          gh issue comment "$PR" --body-file "$RUNNER_TEMP/nothing-to-do.md"
          echo "PROCEED=false" >> "$GITHUB_ENV"
          echo "Nothing to act on for #$PR"

      # A person asking for another round is bounded by their own patience. A bot asking is
      # not: a reviewing agent and this one will hand work back and forth for as long as the
      # API key lasts. Rounds a person asked for reset the count, so this only ever stops a
      # machine talking to a machine.
      - name: Make sure a person is still in the loop
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.event.outputs.mode == 'round'
          && steps.event.outputs.attended == 'false'
          && steps.stage_pr.outputs.unattended_rounds >= inputs.max_unattended_rounds }}
        env:
          PR: ${{ steps.event.outputs.pull_request }}
          ACTOR: ${{ steps.event.outputs.actor }}
          ROUNDS: ${{ steps.stage_pr.outputs.unattended_rounds }}
          MAX: ${{ inputs.max_unattended_rounds }}
          COMMAND: ${{ inputs.command }}
        run: |
          {
            printf 'Stopping here: the last %s rounds on this pull request all came from a bot, and the limit is %s. @%s asked for another one and it has not been started.\n\n' "$ROUNDS" "$MAX" "$ACTOR"
            printf 'Something needs a person to look - when a machine asks this many times in a row, the feedback and the change are usually talking past each other. Read the last few rounds, then either say what you want and run `%s` here, or submit a review yourself. Either one resets the count.\n' "$COMMAND"
          } > "$RUNNER_TEMP/loop-stopped.md"
          gh issue comment "$PR" --body-file "$RUNNER_TEMP/loop-stopped.md"
          echo "PROCEED=false" >> "$GITHUB_ENV"
          echo "::warning title=Unattended round limit reached::$ROUNDS unattended rounds on #$PR, limit is $MAX"

      # Both modes work on the same branch, created on the first run and continued on every
      # one after. A round is always continuing something, so this normally takes the fetch
      # path.
      - name: Prepare the branch
        id: branch
        if: ${{ success() && env.PROCEED == 'true' }}
        env:
          GIT_TOKEN: ${{ steps.ai_implement.outputs.token }}
          # Who the commits are authored by, resolved below into the app's bot login and the
          # noreply address that login is linked to
          APP_SLUG: ${{ steps.ai_implement.outputs.app-slug }}
          BRANCH: ${{ steps.pull_request.outputs.branch || format('{0}issue-{1}', inputs.branch_prefix, steps.event.outputs.issue) }}
          # Which branch the work is cut from, and which one the pull request will target. This
          # is the only place either question is answered, and the three candidates are ranked
          # differently depending on whether there is already a branch - see below.
          #
          # Asked for on the command, and checked to exist before the checkout. Empty when
          # nobody asked.
          REQUESTED_BASE: ${{ steps.event.outputs.requested_base }}
          # Which branch the plan was written against, recorded in the plan comment by the
          # planning workflow. This is the one that matters most of the time: it means the
          # branch gets cut from whatever the plan actually read, without anybody having to say
          # so twice. Empty for a plan posted before that was recorded.
          PLAN_BASE: ${{ steps.stage_issue.outputs.plan_base }}
          # What the pull request behind this branch already targets - the one a round is
          # continuing, or the closed one a first run is reviving. Empty on an ordinary first
          # run, and not separately checked to exist: it is a branch Github reported as the base
          # of a real pull request.
          PR_BASE: ${{ steps.pull_request.outputs.base || steps.existing.outputs.base }}
          DEFAULT_BASE: ${{ github.event.repository.default_branch }}
        run: |
          # The credential goes on the command line of the one command that needs it, the
          # same header `actions/checkout` would otherwise leave in .git/config
          auth=$(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)

          if git -c http.extraheader="AUTHORIZATION: basic $auth" \
               ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "Continuing the work already on $BRANCH"
            git -c http.extraheader="AUTHORIZATION: basic $auth" \
              fetch --no-tags origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git checkout -B "$BRANCH" "refs/remotes/origin/$BRANCH"
            # What the agent's work is measured against, so a round that changes nothing can
            # say so instead of pushing an empty commit
            compare_ref="refs/remotes/origin/$BRANCH"
            created='false'

            # The branch already carries its history, so the base is not this run's to choose -
            # the pull request in front of it is the record, and anything asked for on the
            # command is answered in the step below rather than acted on.
            base="${PR_BASE:-${REQUESTED_BASE:-${PLAN_BASE:-$DEFAULT_BASE}}}"
          else
            # Nothing exists yet, so this run does decide, most specific first. The command
            # outranks everything, because somebody typed it just now. Then the plan, which is
            # the ordinary case: it was written against a branch and this is the work it
            # described. Then a revived pull request keeps what it used to target, because
            # reviving one should not silently move it. Failing all three, the default branch.
            base="${REQUESTED_BASE:-${PLAN_BASE:-${PR_BASE:-$DEFAULT_BASE}}}"

            # The fetched tip of the base rather than the commit the event carried. `fetch-depth:
            # 0` above brings every remote head down, so this needs no fetch of its own - and a
            # requested base was confirmed to exist before that fetch ran, which is what makes it
            # certain to be here.
            #
            # A base that was not asked for on this command can still be gone: one recorded in a
            # plan written weeks ago, or one a closed pull request used to target, may have been
            # merged and deleted since. That is a stop rather than a fallback, because quietly
            # building on a different branch than the plan was written against is the whole
            # failure this is here to prevent.
            if ! git rev-parse --verify --quiet "refs/remotes/origin/$base" > /dev/null; then
              echo "::error title=Base branch missing::refs/remotes/origin/$base is not in the checkout, so $BRANCH cannot be created from it. It may have been merged and deleted since the plan named it."
              exit 1
            fi

            echo "Starting $BRANCH from $base at $(git rev-parse --short "refs/remotes/origin/$base")"
            compare_ref=$(git rev-parse "refs/remotes/origin/$base")
            git checkout -b "$BRANCH" "refs/remotes/origin/$base"
            created='true'
          fi

          # Where the base stood at the moment this run read it, recorded so the push step can
          # say what the base did during the hour the agent was working. Nothing decides
          # anything on it - it is only ever printed.
          #
          # Empty when the base is not in the checkout, which is a branch merged and deleted
          # since the pull request was opened.
          base_tip=''
          if git rev-parse --verify --quiet "refs/remotes/origin/$base" > /dev/null; then
            base_tip=$(git rev-parse "refs/remotes/origin/$base")
          fi

          # Local-only and never committed, so neither the staged input nor the agent's
          # replies can end up in the branch however it leaves the working tree
          printf '/.ai-plan/\n/.ai-review/\n/.ai-reports/\n' >> .git/info/exclude

          # The app's own identity, so a commit is attributed to whatever pushed it. Github resolves
          # the address to an account, so one belonging to anybody else shows the commit against
          # somebody who did not make it.
          #
          # The numeric id is what links the address to the account, and it has to be looked up:
          # `create-github-app-token` reports the slug but not the user behind it. A lookup that
          # fails costs the avatar and nothing else, so the address is still written without it
          # rather than turning a good round red - `${var:+...}` is what keeps a bare `+` out of it.
          app_login="${APP_SLUG}[bot]"
          app_user_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq '.id' 2> /dev/null || echo '')

          git config --local user.name "$app_login"
          git config --local user.email "${app_user_id:+${app_user_id}+}${app_login}@users.noreply.github.com"

          {
            printf 'compare_ref=%s\n' "$compare_ref"
            printf 'branch=%s\n' "$BRANCH"
            printf 'base=%s\n' "$base"
            printf 'base_tip=%s\n' "$base_tip"
            printf 'created=%s\n' "$created"
          } >> "$GITHUB_OUTPUT"

      # A base asked for on a branch that already existed, which is a request nothing can act on:
      # the history is already sitting on top of something else. Said out loud rather than
      # dropped, because a person who typed `base=` and got silence has no way to tell that from
      # a broken workflow.
      #
      # The run still goes on. The same comment usually carries the actual work - review feedback,
      # or instructions for the agent - and refusing all of it over one argument would throw that
      # away.
      - name: Say that the base was already settled
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.event.outputs.base_given == 'true'
          && steps.branch.outputs.created != 'true' }}
        env:
          TARGET: ${{ steps.event.outputs.target }}
          ACTOR: ${{ steps.event.outputs.actor }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          REQUESTED: ${{ steps.event.outputs.requested_base }}
          # Only set when a pull request is standing behind the branch. Without one there is
          # nothing that knows what the branch was originally cut from, and this step must not
          # claim otherwise.
          PR_BASE: ${{ steps.pull_request.outputs.base || steps.existing.outputs.base }}
        run: |
          {
            if [[ -n "$PR_BASE" ]]; then
              printf '@%s I am carrying on with `%s`, which already exists and is based on `%s`, so `base=%s` is not something I can act on here. A base is settled when the branch is first created.\n\n' \
                "$ACTOR" "$BRANCH" "$PR_BASE" "$REQUESTED"
              printf 'To move this work, retarget the pull request yourself - `gh pr edit --base %s`, or the **Edit** button next to its title - and every round after that reads the new base off the pull request. Retargeting changes what the pull request is compared against and not what is on the branch, so you probably want to rebase it as well.\n\n' \
                "$REQUESTED"
            else
              # The branch is here but no pull request ever was. Whatever it was cut from is not
              # recorded anywhere, so this says only what it can stand behind: the branch is not
              # being recreated, and the pull request about to open does target the request.
              printf '@%s `%s` already exists, so I have carried on with it rather than cutting it from `%s`. Its history is whatever was already on it.\n\n' \
                "$ACTOR" "$BRANCH" "$REQUESTED"
              printf 'The pull request will target `%s` as you asked, so check the diff it shows before reviewing - the branch and the base may have more between them than this run added.\n\n' \
                "$REQUESTED"
            fi
            printf 'Everything else in your comment is being acted on as usual.\n'
          } > "$RUNNER_TEMP/base-settled.md"

          # Advisory, so a comment that will not post costs the note and not the run - the work
          # itself is unaffected by the argument being unusable
          gh issue comment "$TARGET" --body-file "$RUNNER_TEMP/base-settled.md" \
            || echo "::warning title=Could not say the base was settled::The note about \`base=$REQUESTED\` did not post"

          echo "::warning title=Base already settled::'$REQUESTED' was asked for, but $BRANCH already exists${PR_BASE:+ on '$PR_BASE'}"

      # The command asked for one branch and the plan was written against another, and the
      # command won. That is a legitimate thing to want - the plan was right and the landing
      # place moved - but it is also exactly the mismatch this whole mechanism exists to stop
      # happening by accident, so it never passes without being said.
      #
      # Advisory: the work carries on either way, and whoever asked can read the note and decide
      # whether they meant it.
      - name: Say that the command overrode the plan
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.branch.outputs.created == 'true'
          && steps.event.outputs.requested_base != ''
          && steps.stage_issue.outputs.plan_base != ''
          && steps.event.outputs.requested_base != steps.stage_issue.outputs.plan_base }}
        env:
          TARGET: ${{ steps.event.outputs.target }}
          ACTOR: ${{ steps.event.outputs.actor }}
          REQUESTED: ${{ steps.event.outputs.requested_base }}
          PLAN_BASE: ${{ steps.stage_issue.outputs.plan_base }}
          COMMAND: ${{ inputs.command }}
        run: |
          {
            printf '@%s heads up: the plan was written against `%s`, and you asked for `%s`. I am using `%s`, because you asked for it just now.\n\n' \
              "$ACTOR" "$PLAN_BASE" "$REQUESTED" "$REQUESTED"
            printf 'Worth a look at the result: anything the plan said about the code was true of `%s`, and wherever the two branches differ the plan may be describing files that have moved or work that is already done. If that is a problem, run `/ai-plan base=%s` to replan against the branch this is actually landing on.\n' \
              "$PLAN_BASE" "$REQUESTED"
          } > "$RUNNER_TEMP/base-overridden.md"

          gh issue comment "$TARGET" --body-file "$RUNNER_TEMP/base-overridden.md" \
            || echo "::warning title=Could not say the plan was overridden::The note about \`base=$REQUESTED\` did not post"

          echo "::warning title=Command overrode the plan::The plan was written against '$PLAN_BASE', the command asked for '$REQUESTED'"

      # What the checks on this commit actually printed, fetched from the artifacts the QA
      # workflows upload. This is the answer to a red check: the agent cannot read job logs,
      # and a check run carries only `Process completed with exit code 1`.
      #
      # Discovered by name rather than by passing artifact ids around: any run on this commit
      # may have uploaded one, including runs nothing here triggered. Missing is normal - the
      # checks may still be running, the reports expire after a day, and a repository may not
      # upload any - so nothing here fails the round.
      - name: Fetch the check reports
        id: reports
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.pull_request.outputs.head_sha != '' }}
        env:
          HEAD_SHA: ${{ steps.pull_request.outputs.head_sha }}
        run: |
          mkdir -p .ai-reports

          for run_id in $(gh api \
                "repos/$GH_REPO/actions/runs?head_sha=$HEAD_SHA&per_page=100" \
                --jq '.workflow_runs[].id' 2>/dev/null); do
            # Its own run has nothing to offer it, and `|| true` because "no artifacts match"
            # is the ordinary case rather than a failure
            [[ "$run_id" == "$GITHUB_RUN_ID" ]] && continue
            gh run download "$run_id" --pattern 'ai-report-*' --dir .ai-reports 2>/dev/null || true
          done

          found=$(find .ai-reports -type f | wc -l)
          echo "found=$found" >> "$GITHUB_OUTPUT"

          if [[ "$found" -eq 0 ]]; then
            echo "No check reports for $HEAD_SHA - the agent will work from the feedback alone"
          else
            echo "Staged $found report file(s) for $HEAD_SHA:"
            find .ai-reports -type f -printf '  %p (%s bytes)\n'
          fi

      # Which checks the agent can run on itself before it pushes, and whether anything has to
      # be installed for it to. A red linter found here costs the agent a few turns; found after
      # the push it costs a whole round - a second agent run, on a fresh context, working from an
      # artifact instead of from the tool.
      #
      # **Detection is deliberately the same tests php-qa-checks makes** - a config file's
      # presence, and for Psalm which of the two names it has. The two have to agree: an agent
      # that checks a different set than CI reports itself clean and then goes red on the push,
      # which is worse than not checking at all, because the round that would have caught it has
      # already been spent.
      #
      # A repository with `task.sh` installs nothing here. Its tooling lives inside the container -
      # `./task.sh cs-check` execs into the app service - so nothing installed on the runner could
      # run it. Its commands are worked out further down instead, once the container it needs is
      # actually up.
      #
      # The two ecosystems are answered independently, because a repository can be either or both -
      # a PHP application with an Angular front end is both, and gets both installs and one merged
      # list of commands.
      - name: Work out what the agent can check its work with
        id: verify
        if: ${{ success() && env.PROCEED == 'true' && inputs.provision_checks }}
        run: |
          if [[ -f 'task.sh' ]]; then
            {
              printf 'php=false\n'
              printf 'node=false\n'
            } >> "$GITHUB_OUTPUT"
            echo "This repository drives its checks through task.sh, which runs them inside its container - nothing to install on the runner"
            exit 0
          fi

          # Built here and handed to the agent verbatim, so that what it runs and what CI runs
          # cannot drift apart in a prompt somebody edited later.
          #
          # One list across both ecosystems, in the order the agent should work through it: the
          # fixer before the checker, for the same reason php-qa-checks runs it first - what a
          # tool can fix should never reach a reviewer, and what is left after it is what the
          # check will actually report.
          commands=()

          # `vendor/` is installed only where there is something in it to run. A repository with a
          # `composer.json` and no linter configuration is left alone: the install would cost the
          # round a minute and buy the agent nothing it is told about.
          php='false'
          if [[ -f 'composer.json' ]]; then
            if [[ -f 'phpcs.xml' || -f 'phpcs.xml.dist' ]]; then
              commands+=('./vendor/bin/phpcbf' './vendor/bin/phpcs')
            fi

            # `--config` for the `.dist` name only. Psalm finds `psalm.xml` by itself and stops
            # with "Could not locate a config file" on the other one.
            if [[ -f 'psalm.xml' ]]; then
              commands+=('./vendor/bin/psalm')
            elif [[ -f 'psalm.xml.dist' ]]; then
              commands+=('./vendor/bin/psalm --config=psalm.xml.dist')
            fi

            if [[ ${#commands[@]} -gt 0 ]]; then
              php='true'
            else
              echo "composer.json is here but there is no phpcs or psalm configuration - nothing to install Composer dependencies for"
            fi
          fi

          # `package.json` alone is enough, and deliberately a looser test than the PHP one above.
          # A JavaScript project keeps its whole toolchain in `node_modules` - the type checker,
          # the framework CLI, the test runner are all binaries under `./node_modules/.bin` - so
          # there is always something for the agent to run, whether or not the package declares a
          # script this workflow knows the name of.
          node='false'
          npm_cmd='npm install'
          yarn_cmd='yarn install --production=false'
          if [[ -f 'package.json' ]]; then
            node='true'

            # Yarn is chosen by `.yarnrc`, which is the test install-packages and npm-qa-checks
            # both make - so the tool that installs is the tool CI installs with.
            #
            # A lock file is installed from rather than resolved against, because this round
            # commits its working tree: `npm install` rewrites `package-lock.json`, and where the
            # repository tracks that file the rewrite goes into the pull request as a change
            # nobody asked for.
            if [[ -f '.yarnrc' ]]; then
              [[ -f 'yarn.lock' ]] && yarn_cmd='yarn install --frozen-lockfile --production=false'
              echo "Yarn is what this package is installed with: $yarn_cmd"
            else
              [[ -f 'package-lock.json' ]] && npm_cmd='npm ci'
              echo "NPM is what this package is installed with: $npm_cmd"
            fi

            # `npm run`, whichever package manager installed, because that is what npm-qa-checks
            # runs the scripts with - and the agent has to be told what CI does rather than what
            # the repository's own convention is.
            #
            # Only these two names. A script this workflow invented would be one CI never runs,
            # which is the one thing the agent must not be told.
            #
            # `jq`'s stderr is left alone: a `package.json` it cannot parse says so in the log
            # rather than looking like a package that declares no scripts.
            for script in lint test; do
              if jq -e ".scripts.\"$script\"" package.json > /dev/null; then
                commands+=("npm run $script")
              fi
            done
          fi

          # The prompt reads this as one block rather than assembling it from several outputs, so
          # that what the agent is told about these commands lives next to the detection that
          # found them. Both agent steps interpolate the same value.
          #
          # Deliberately never called "checks". That word already means the plan's `C` items in
          # both prompts, and a second meaning for it here is how an agent ends up reporting `C2`
          # as discharged because a linter came back clean.
          {
            printf 'php=%s\n' "$php"
            printf 'node=%s\n' "$node"
            printf 'npm_cmd=%s\n' "$npm_cmd"
            printf 'yarn_cmd=%s\n' "$yarn_cmd"
          } >> "$GITHUB_OUTPUT"

          if [[ "$php" == 'false' && "$node" == 'false' ]]; then
            echo "Nothing to install on the runner - the agent works out what it can run, as before"
            exit 0
          fi

          # Named by directory rather than by ecosystem, because a repository can have a
          # `composer.json` this workflow installs nothing for and a `package.json` it does - and
          # "your dependencies are installed" would then be a claim about a `vendor/` that is not
          # there.
          installed=()
          [[ "$php" == 'true' ]] && installed+=('`vendor/`')
          [[ "$node" == 'true' ]] && installed+=('`node_modules`')

          {
            echo 'instructions<<PROMPT'
            echo "This project's dependencies are installed for you, under $(printf '%s and ' "${installed[@]}" | sed 's/ and $//')."

            # Worth its own sentence, because the binaries are not on the `PATH` a shell starts
            # with and an agent that does not know they are there reaches for a global install.
            if [[ "$node" == 'true' ]]; then
              echo
              echo "This project's own JavaScript tooling is among them: its type checker, its"
              echo 'framework CLI and its test runner are binaries under `./node_modules/.bin`,'
              echo 'and running one from there is what runs the version this project pins.'
            fi

            if [[ ${#commands[@]} -gt 0 ]]; then
              echo
              echo 'These commands are what CI runs on whatever you push - whether or not the'
              echo 'plan mentions them:'
              echo
              printf -- '- `%s`\n' "${commands[@]}"
              echo
              echo 'Where a fixer and a reporter are both listed, run the fixer first: it settles'
              echo 'what nobody should have to review, and what survives it is what CI reports.'
              echo
              echo 'Having these clean is the floor rather than the whole of it: they are what CI'
              echo 'will say about your work, not everything that has to be true of it.'
            fi

            echo 'PROMPT'
          } >> "$GITHUB_OUTPUT"

          if [[ ${#commands[@]} -gt 0 ]]; then
            echo "The agent can run: ${commands[*]}"
          else
            echo "The dependencies are installed, and there is no command this workflow can name for the agent to check itself with"
          fi

      # Which PHP the checks run under, read from the same `_ci_environment.json` the QA matrix is
      # built from. Without it the agent gets whatever `ubuntu-latest` happens to ship, which need
      # not satisfy `composer.json`'s platform constraint - and the install then fails on the
      # platform rather than on anything the agent did.
      #
      # One version, not the matrix. Proving every leg green stays CI's job; this is here so the
      # agent can check itself before it pushes.
      - name: Work out the PHP version to check under
        id: php
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.verify.outputs.php == 'true' }}
        uses: uniquesca/ci/get-default-ci-environment@main

      - name: Set up PHP
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.verify.outputs.php == 'true' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ fromJSON(steps.php.outputs.env)[0].php.version }}
          extensions: ${{ fromJSON(steps.php.outputs.env)[0].php.extensions }}

      # `_ci_environment.json` describes PHP and nothing else, so unlike the version above this
      # one is an input rather than something read out of the repository. `package-manager-cache`
      # is off because install-packages does the caching, keyed on the lock file.
      - name: Set up Node
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.verify.outputs.node == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          package-manager-cache: false

      # Installing with no lock file writes one, and a library here does not commit one - so
      # without this the round's `git add -A` picks up a `composer.lock` or a `package-lock.json`
      # the agent never asked for and pushes it as part of the change. The dependency directories
      # are here for the repository that neither commits nor gitignores them, where the round
      # would otherwise push every file the install wrote.
      #
      # `.git/info/exclude` only hides what git is not already tracking, so a repository that does
      # commit its lock file still commits a real change to it - which is why the install is given
      # a command that installs from the lock file rather than resolving against it. The trade is
      # that a plan asking for a lock file to be *added* needs it added by hand - the rarer of the
      # two, and the one that is obvious from the diff.
      - name: Keep the install out of the commit
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && (steps.verify.outputs.php == 'true' || steps.verify.outputs.node == 'true') }}
        run: |
          {
            printf '/composer.lock\n'
            printf '/vendor/\n'
            printf '/package-lock.json\n'
            printf '/yarn.lock\n'
            printf '/node_modules/\n'
          } >> .git/info/exclude

      # One call for both ecosystems: the action installs whichever manifest is there, and the
      # skip flags keep it to the ones detected above.
      #
      # `--no-scripts` for the same reason php-qa-checks uses it: Composer's post-install scripts
      # are arbitrary code out of the repository, and this job has ANTHROPIC_API_KEY in it. NPM's
      # lifecycle scripts have no such flag here, because npm-qa-checks runs them and half a
      # JavaScript toolchain arrives as a platform binary a post-install script puts in place - an
      # install that skipped them would leave the agent with a `node_modules` CI never has.
      #
      # Both tokens are scoped to this step, and `env:` in Actions is per-step - so the agent below
      # inherits a populated `vendor/` and `node_modules`, and neither credential that filled them.
      # Same property as `persist-credentials: false` on the checkout.
      #
      # No `--prefer-lowest` and no alternative lock file. The matrix legs that need those are
      # CI's business; this installs what the branch says it depends on.
      - name: Install the dependencies
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && (steps.verify.outputs.php == 'true' || steps.verify.outputs.node == 'true') }}
        uses: uniquesca/ci/install-packages@main
        with:
          skip_composer: ${{ steps.verify.outputs.php != 'true' }}
          composer_access_token: ${{ secrets.COMPOSER_ACCESS_TOKEN }}
          composer_cmd: 'composer install --no-scripts'
          skip_npm_yarn: ${{ steps.verify.outputs.node != 'true' }}
          npm_access_token: ${{ secrets.NPM_ACCESS_TOKEN }}
          npm_install_cmd: ${{ steps.verify.outputs.npm_cmd }}
          yarn_install_cmd: ${{ steps.verify.outputs.yarn_cmd }}

      # Whether installing changed anything git already tracks. A repository that commits its
      # `vendor/` or its `node_modules` is the case that matters: the install then turns up inside
      # the agent's commit, and in the diff somebody has to review.
      #
      # Reported rather than acted on. A repository that commits its dependencies arguably wants
      # the install committed, and quietly reverting it here would break exactly those - so this
      # says what happened and leaves it.
      - name: Say what installing changed
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && (steps.verify.outputs.php == 'true' || steps.verify.outputs.node == 'true') }}
        run: |
          if ! git diff --quiet; then
            echo "::warning title=Installing the dependencies changed tracked files::This repository commits files the install writes to, so they will be part of this round's commit. The run log lists them."
            echo "::group::Tracked files the install changed"
            git diff --name-status
            echo "::endgroup::"
          fi

      # Everything from here to the agent is about the application rather than the toolchain: its
      # configuration rendered from the repository's own templates, and its containers brought up.
      #
      # Deliberately after the install and its diff above, which asks whether installing changed
      # anything git tracks. Rendering a config file first would put it in that answer and report
      # the install for a file it never touched.
      #
      # Detection rather than configuration, on the same terms as the step above: what the
      # repository has is what decides. Two independent things are being looked for, and a
      # repository can have either, both or neither.
      - name: Work out how this application is set up
        id: setup
        if: ${{ success() && env.PROCEED == 'true' && inputs.provision_checks }}
        env:
          SPIN_UP: ${{ inputs.spin_up_docker }}
        run: |
          environment='false'
          if [[ -f '_ci_environment.json' ]]; then
            environment='true'
            echo "_ci_environment.json is here, so bringing the application up renders this repository's config templates"
          fi

          # `task.sh` first, because that is what this organisation's repositories drive compose
          # with and `docker-spin-up` prefers it. The compose file names are the ones Docker itself
          # looks for, so a repository using any of them is one `docker compose up` can start.
          docker='false'
          for candidate in task.sh docker-compose.yml docker-compose.yaml compose.yml compose.yaml; do
            if [[ -f "$candidate" ]]; then
              docker='true'
              echo "$candidate is here, so this repository has an application that can be brought up"
              break
            fi
          done

          # Said out loud rather than passed over in silence. A repository that has a container and
          # does not get one is the case where the agent's checks quietly become the artifact loop
          # again, and the reason for it is a workflow input somebody set months ago.
          if [[ "$docker" == 'true' && "$SPIN_UP" != 'true' ]]; then
            echo "spin_up_docker is off, so it is left down and the agent works without it"
          fi

          {
            printf 'environment=%s\n' "$environment"
            printf 'docker=%s\n' "$docker"
          } >> "$GITHUB_OUTPUT"

      # A rendered config file holds the credentials it was rendered from, and this round commits
      # its working tree with `git add -A`. Without this, the first run on a repository whose
      # config is generated pushes that config to a branch and opens a pull request showing it.
      #
      # In front of the spin-up, which is what renders them - `.git/info/exclude` is read when
      # `git add` runs rather than when it is written, but the ordering is what makes that obvious.
      #
      # The same mechanism and the same limitation as `Keep the install out of the commit`:
      # `.git/info/exclude` only hides what git is not already tracking. A repository that commits
      # a rendered config cannot be helped this way, so it is named in a warning instead - there is
      # no safe thing to do with it here, and quietly reverting the file would leave the
      # application running against a configuration the working tree does not have.
      - name: Keep the rendered configuration out of the commit
        if: >-
          ${{ success() && env.PROCEED == 'true' && inputs.provision_checks
          && steps.setup.outputs.environment == 'true'
          && steps.setup.outputs.docker == 'true' && inputs.spin_up_docker }}
        run: |
          tracked=()
          excluded=0

          # `.configs[]?` rather than `.configs[]`, so a file declaring only `token_fallbacks` is
          # not an error. `while read` and not a `for`, because a path may legitimately have a
          # space in it.
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue

            # `.git/info/exclude` patterns are matched from the repository root when they start
            # with a slash, and a path out of this file may or may not be written `./like/this`
            path="${path#./}"

            if git ls-files --error-unmatch -- "$path" > /dev/null 2>&1; then
              tracked+=("$path")
              continue
            fi

            printf '/%s\n' "$path" >> .git/info/exclude
            excluded=$((excluded + 1))
          done < <(jq -r '.configs[]?.path // empty' _ci_environment.json)

          echo "$excluded rendered config file(s) will be kept out of this round's commit"

          if [[ ${#tracked[@]} -gt 0 ]]; then
            echo "::warning title=This repository commits a file it renders::${tracked[*]} - rendering writes the configuration this run was given into ${#tracked[@]} file(s) git already tracks, so they will be part of this round's commit and whatever they hold will be in the pull request. Add them to .gitignore, or do not give this workflow credentials you would mind seeing there"
          fi

      # The application itself. This renders the configs, runs `_ci_environment.json`'s
      # `init_script`, starts the containers as the runner's own user and waits for MySQL if
      # `task.sh` can be asked about it - see the action.
      #
      # `ghcr.io` and nothing else, because that is where this organisation's images are built and
      # pushed - a repository pulling from anywhere else is pulling something public, and a
      # registry nobody logs into still serves those.
      #
      # The run's own token, so there is no secret to configure and nothing for the agent to find.
      # It needs the `packages: read` granted above, and the package itself has to be linked to
      # this repository - see the note there.
      #
      # Its own step rather than `docker-spin-up`'s registry inputs: this is one fixed registry
      # authenticated one fixed way, and passing it through three inputs said the same thing at
      # more length. Allowed to fail for the same reason as the spin-up below - a login that does
      # not work is a round without a container, not a round that cannot happen.
      - name: Log in to the container registry
        if: >-
          ${{ success() && env.PROCEED == 'true' && inputs.provision_checks
          && steps.setup.outputs.docker == 'true' && inputs.spin_up_docker }}
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This is what makes a repository whose checks live inside its container checkable at all.
      # Until it, `./task.sh cs-check` had nothing to exec into, and the agent's only account of
      # what CI would say was an artifact from an hour earlier.
      #
      # `|| '{}'` because a secret nobody configured is an empty string, and passing one explicitly
      # overrides the action's own `{}` default rather than falling back to it - an empty object is
      # `{}`, not ``.
      - name: Spin the application up in Docker
        id: docker_up
        if: >-
          ${{ success() && env.PROCEED == 'true' && inputs.provision_checks
          && steps.setup.outputs.docker == 'true' && inputs.spin_up_docker }}
        continue-on-error: true
        uses: uniquesca/ci/docker-spin-up@main
        with:
          env_variables: ${{ secrets.ENV_VARIABLES || '{}' }}
          profile: ${{ inputs.docker_profile }}

      # The spin-up is allowed to fail, so somewhere has to say that it did. A warning and not an
      # error: the round goes on, and what it lost is a way for the agent to check itself rather
      # than the work.
      #
      # `success()` still holds when it failed - that is what `continue-on-error` does to a step's
      # conclusion - so this reads its outcome rather than the job's state.
      - name: Say the application could not be brought up
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.docker_up.outcome == 'failure' }}
        run: |
          echo "::warning title=The application could not be brought up::Docker did not come up, so the agent has no container to run this project's checks in and is back to the artifact reports for what CI says. The step's log has why - an unresolvable token in a config template, an image on ghcr.io this repository has not been granted access to, and a compose file the branch itself broke, are the three to look at first"

      # What the agent can run now that there is a container to run it in - the tasks
      # `docker-qa-checks` runs, asked about the same way, so that what the agent checks and what
      # CI checks cannot drift apart. A repository supporting none of them gets none listed.
      #
      # `code-quality` is the exception to that symmetry, and deliberately: it is the other three
      # code style tasks in one call, which is what the agent wants and what `docker-qa-checks`
      # must not have - a blended log cannot be split back into the per-check reports the artifact
      # loop uploads. Same tools either way, so nothing about the answer drifts.
      #
      # Only after a spin-up that worked. Handing an agent commands that exec into a container
      # which is not running costs it several turns to find out, and the answer it gets back says
      # nothing about its own work.
      - name: Work out what the agent can check its work with in the container
        id: container
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.docker_up.outcome == 'success' }}
        run: |
          commands=()
          names=()
          fixer='false'
          tests='false'

          # `supports` is `task.sh`'s own answer about itself, so a repository that has renamed or
          # dropped a task is never told it can run one. A compose file without a `task.sh` has no
          # equivalent to ask, and gets the paragraph below without a list.
          if [[ -f 'task.sh' ]]; then
            # Fixer first, for the same reason the composer branch orders them that way: what a
            # tool can fix should never reach a reviewer, and what survives it is what the check
            # reports. `code-quality` above the three it wraps, so that an agent taking the first
            # thing that covers its work takes the one call rather than three.
            #
            # Each task carries what it does, because the set overlaps: told only the names, an
            # agent runs `code-quality` and then the three tools inside it again.
            for entry in \
                'cs-fix|fixes every code style problem a tool can fix' \
                'code-quality|the fixer, the code style check and the static analysis in one call - prefer it to running them one at a time' \
                'cs-check|reports the code style problems the fixer cannot fix' \
                'psalm|static analysis' \
                'test|the unit tests'; do
              task=${entry%%|*}

              if ./task.sh supports "$task" > /dev/null 2>&1; then
                commands+=("\`./task.sh $task\` - ${entry#*|}")
                names+=("$task")

                [[ "$task" == 'cs-fix' ]] && fixer='true'
                [[ "$task" == 'test' ]] && tests='true'
              fi
            done
          fi

          {
            echo 'instructions<<PROMPT'
            echo "This project's application is running in Docker on this runner, brought up before"
            echo 'you started. Its containers are where this project actually runs, so a command'
            echo 'that needs the application, its database or its dependencies belongs in one -'
            echo 'running it on the runner instead is what produces a failure that is about the'
            echo 'runner rather than about your work.'

            if [[ ${#commands[@]} -gt 0 ]]; then
              echo
              echo 'These commands are what CI runs on whatever you push - whether or not the plan'
              echo 'mentions them - and each one executes inside the container for you:'
              echo
              printf -- '- %s\n' "${commands[@]}"

              # Only where the standalone fixer is one of them. A repository offering just
              # `code-quality` has the ordering inside that one call already, and a list with no
              # fixer in it at all gets told to run something it was not given.
              if [[ "$fixer" == 'true' ]]; then
                echo
                echo 'Run the fixer before the reporters: it settles what nobody should have to'
                echo 'review, and what survives it is what CI reports.'
              fi

              # Only worth the tokens where there is a `test` task to spend them on. The point is
              # not that reruns are forbidden - it is that the second answer is not evidence, and
              # an agent that does not know it will chase a contaminated database as a defect.
              if [[ "$tests" == 'true' ]]; then
                echo
                echo 'The unit tests share one database with the rest of the container and leave'
                echo 'state behind in it, so treat `./task.sh test` as one run per job: run it'
                echo 'once, when the change is otherwise finished, rather than as you go. What a'
                echo 'second run reports says as much about what the first one left behind as'
                echo 'about your code, so do not read a failure that only appears there as a'
                echo 'defect you introduced.'
              fi

              echo
              echo 'Having these clean is the floor rather than the whole of it: they are what CI'
              echo 'will say about your work, not everything that has to be true of it.'
            fi

            echo 'PROMPT'
          } >> "$GITHUB_OUTPUT"

          if [[ ${#names[@]} -gt 0 ]]; then
            echo "The agent can run: ${names[*]}"
          elif [[ -f 'task.sh' ]]; then
            echo "The application is up, but task.sh supports none of these checks - the agent is told only that it is running"
          else
            echo "The application is up, and without a task.sh there is nothing to ask about what it can check - the agent is told only that it is running"
          fi

      # The plan and the issue are read off disk rather than interpolated into this file -
      # both are written by people, and neither has any business being expanded into the
      # workflow. Only the issue number goes in, which Github restricts to digits.
      - name: Implement the plan
        id: implement_initial
        if: ${{ success() && env.PROCEED == 'true' && steps.event.outputs.mode == 'initial' }}
        # The agent's own budget, below the job's, so running over fails this step rather
        # than the whole job
        timeout-minutes: ${{ inputs.agent_timeout_minutes }}
        # This step failing does not settle anything - `Judge the agent's own result` below
        # reads the transcript and decides what the failure meant. See the note there
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Passed explicitly so the workflow works without the Claude Github App
          # installed, and so the agent is bound by this job's permissions
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Off by default - this prints every tool call and every tool result, and a tool
          # result is whatever the agent just read out of the repository
          show_full_output: ${{ inputs.debug }}
          # Without this the action quits before it reads anything whenever a bot triggered
          # the run - see where this is built, in the permission check
          allowed_bots: ${{ steps.permissions.outputs.bots_csv }}
          prompt: |
            You are a senior software engineer. Implement the approved plan for issue
            #${{ steps.event.outputs.issue }} of this repository, in the working tree you
            are already in.

            This branch is cut from `${{ steps.branch.outputs.base }}` and the pull request
            will be merged back into it, so that is the state your change has to fit - not
            the default branch, if the two are different. Something the plan asks for may
            already be here.

            Everything you need has been fetched for you. Read these first:

            - `.ai-plan/plan.md` - the approved plan. This is the specification. Implement
              it. Its items are numbered `S1` for a step, `R1` for a risk, `U1` for an
              unknown or an assumption, `C1` for a check that proves the work is done and
              `QA1` for an acceptance criterion a tester will verify by hand. Use those ids
              when you refer to it, as described below. An older plan may not have them, in
              which case refer to its steps by their titles.
            - `.ai-plan/issue.json` - the issue number, title and body, for context on why
              the work is wanted.
            - `.ai-plan/comments.json` - every comment on the issue, oldest first, each
              with its author and an `is_bot` flag. Anything said after the plan was
              posted is feedback on it, and it takes precedence over the plan where the two
              disagree.

            If `.ai-plan/plan.md` is missing or unreadable, stop straight away and say
            exactly that as your final message. Do not go looking for another route to the
            issue - there isn't one, and hunting for it burns the whole run.

            Before you write anything, read the code the plan touches and learn the
            conventions actually in use - how modules are structured, how errors are
            handled, how things are tested. Match them. A change that works but reads
            like it came from somewhere else is a change that gets rewritten.

            This repository may commit its dependencies. Nothing under `node_modules`,
            `vendor`, `dist` or `build` is yours to change, and none of it is worth
            searching, unless the plan is specifically about one of them. Reading a
            dependency to see what it actually does is another matter, and so is running
            the binaries it installed.

            You have a shell. Use it to verify your own work: find how this project runs
            its tests and linters, run them, and fix what you broke. The plan's `C` checks
            are yours to execute, not to list. If you cannot get one passing, say so in
            your final message rather than leaving it quietly broken.

            ${{ steps.verify.outputs.instructions }}

            ${{ steps.container.outputs.instructions }}

            The `QA` criteria are not yours. They are for a person testing this after it
            merges, and you have no way to discharge them - so never report one as met.
            What you can do is make them possible: if the change cannot satisfy one as
            written, that is worth saying.

            Do the work yourself, in this run. You have no helpers to delegate to and
            nothing is arriving later, so never end a turn saying you are waiting on
            anything - there is nothing to wait for, and a run that stops to wait opens no
            pull request at all. Where something is still unresolved, finish everything
            that does not depend on it and say what you left and why in your final message.

            Three things you must not do:

            - Do not commit, push, create a branch, open a pull request, or comment
              anywhere. The workflow does all of that after you finish, and doing it
              yourself makes a mess of what it pushes.
            - Do not modify anything under `.ai-plan/`. It is the input, and it is not
              part of the change.
            - Do not touch `CHANGELOG.md`. Every repository here generates it from the git
              log when it releases, so an entry written by hand is overwritten or left
              conflicting. This holds even where the plan asks for one - note that you left
              it out and why.

            Leave your work in the working tree as uncommitted changes. That is what gets
            committed for you.

            Your final message becomes the body of the pull request, so write it for a
            reviewer: what changed and why, anything in the plan you deliberately did not
            do and why, what you ran to verify it and what the result was, and anything
            that needs a human decision. Markdown, no preamble, no sign-off, well under
            10000 characters. Do not add a title, a link to the issue, or a footer - the
            workflow adds those.

            Cite the plan's ids in it, in brackets after what you are already saying -
            "moved the retry loop into the client (S3)", "the changelog suite passes (C2)".
            Never an id on its own: the plan lives on the issue, and somebody reading this
            pull request has your words and nothing else. `C2` alone tells them nothing,
            while the sentence with `C2` after it tells them everything and lets them go
            and find it. Do not add a table of ids either - the ids belong in the prose,
            not instead of it.

            Once this is open as a pull request, the review happens there and you will be
            asked for changes on the lines themselves. Make that easy: small commits of
            related work, and no unrelated tidying mixed in.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "Read,Grep,Glob,LS,Edit,Write,MultiEdit,NotebookEdit,TodoWrite,Bash"
            ${{ inputs.debug && '--debug' || '' }}

      # The other half of the loop. Everything a reviewer said is on disk in one file, and
      # what the agent wants to say back goes to disk the same way - it has no token and
      # cannot post anything itself.
      - name: Act on the review feedback
        id: implement_round
        if: ${{ success() && env.PROCEED == 'true' && steps.event.outputs.mode == 'round' }}
        timeout-minutes: ${{ inputs.agent_timeout_minutes }}
        # As above: a failure here is judged below rather than taken at face value
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: ${{ inputs.debug }}
          # This is the step a reviewing agent hands work back to, so the actor here is a bot
          # on every round - without this the action quits before it reads anything
          allowed_bots: ${{ steps.permissions.outputs.bots_csv }}
          prompt: |
            You are a senior software engineer. Changes have been asked for on pull request
            #${{ steps.event.outputs.pull_request }} of this repository. Act on them, in the
            working tree you are already in - it is that pull request's branch, with the work
            from every earlier round already on it.

            This is round ${{ steps.stage_pr.outputs.round }}. Read these first:

            - `.ai-review/feedback.json` - everything asking for a change. This is the work.
              Each entry has:
              - `source` - `thread` is an inline review comment, `review` a reviewer's
                summary, `comment` something said in the pull request conversation, `check`
                a failing CI check.
              - `anchor` - the file and line an inline comment is attached to, and the diff
                hunk it was written against. Null when the feedback is not about one place.
              - `state` - for a thread, `unresolved` or `outdated`. `outdated` means the code
                under the comment has moved since it was written, so work out whether it
                still applies before acting on it. For a review, the review's state. For a
                check, its conclusion.
              - `reply_target` - the identifier you answer that thread on, or null.
              - `is_bot` - whether a machine wrote it. Weigh it on its merits either way.
            - `.ai-review/pull-request.json` - the pull request itself.
            - `.ai-plan/plan.md` - the approved plan this branch implements, if the issue
              still has one. It is the specification, and it may have been revised since the
              last round - the workflow says so below when it has been. Where it and the
              feedback disagree, the feedback wins: it is newer, and somebody wrote it after
              seeing the code. Its items are numbered `S1` for a step, `R1` for a risk, `U1`
              for an unknown or an assumption, `C1` for a check that proves the work is done
              and `QA1` for an acceptance criterion a tester verifies by hand. Feedback often
              cites them - "S3 was not done", "C1 still fails" - so read the item it points
              at before you act. The ids survive a revision, so one quoted in an older
              comment still means the same item; an older plan may have no ids at all, in
              which case its steps go by their titles.
            - `.ai-plan/issue.json` and `.ai-plan/comments.json` - the issue this came from.
            - `.ai-reports/` - what the checks on this commit actually printed, one directory
              per CI job. A failing `check` in the feedback almost certainly has its output in
              here, and reading it beats inferring what the check meant from its name. It is
              empty when the checks have not finished, when the reports have expired, or when
              this repository does not upload any - in which case say what you could not see
              rather than guessing.

            If `.ai-review/feedback.json` is missing or unreadable, stop straight away and say
            exactly that as your final message.

            ${{ steps.stage_pr.outputs.checks_pending }} check(s) had not finished when this
            round started, so the branch is not known to be green - only not known to be red.
            A check that is red and not in the feedback was filtered out as one of the AI
            workflows' own.

            Work through every item. For each one, either make the change or decide it should
            not be made. Both are legitimate. A round that does what it was told against its
            own better judgement is worse than one that pushes back with a reason - you have
            read the code and the reviewer may not have.

            ${{ steps.revision.outputs.instruction }}

            Then answer the review. Write `.ai-review/replies.json`: a JSON array of
            `{"reply_target": <number>, "body": "<markdown>"}`, with one entry for every
            feedback item that has a non-null `reply_target`, including the ones you decided
            against. Say what you changed, or why you did not. A few sentences each, and where
            a plan item is what the reply is about, cite its id after the point rather than in
            place of it - "the guard now covers the empty case (S5)". Use only
            `reply_target` values that appear in the feedback - invented ones are discarded.
            Items whose `reply_target` is null have no thread to answer; cover those in your
            final message instead.

            You have a shell. Use it: read the code around a comment before you change it,
            run this project's tests and linters, and fix what you break. A failing check in
            the feedback is yours to make pass, not to explain.

            ${{ steps.verify.outputs.instructions }}

            ${{ steps.container.outputs.instructions }}

            Where a failing check in the feedback is one of those commands, run it rather than
            working out what it meant from `.ai-reports/` - the report is what it printed an
            hour ago, and the command is what it says now.

            Do the work yourself, in this run. You have no helpers to delegate to and nothing
            is arriving later, so never end a turn saying you are waiting on anything - there
            is nothing to wait for, and a round that stops to wait pushes nothing and answers
            nobody. Where something is still unresolved, finish the rest and say what you left
            and why.

            Three things you must not do:

            - Do not commit, push, or comment anywhere. The workflow does all of that after
              you finish, including posting your replies.
            - Do not modify anything under `.ai-plan/`, and do not modify anything under
              `.ai-review/` other than by creating `replies.json`.
            - Do not touch `CHANGELOG.md`. Every repository here generates it from the git log
              when it releases, so an entry written by hand is overwritten or left conflicting.
              This holds even where the feedback asks for one - reply saying so.

            Leave your work in the working tree as uncommitted changes.

            Your final message is posted as a comment on the pull request, so write it for the
            reviewer: what you changed this round, what you declined and why, what you ran and
            what it said, and anything still needing a decision. Markdown, no preamble, no
            sign-off, well under 10000 characters. Do not add a title or a footer - the
            workflow adds those.

            Cite the plan's ids in it, in brackets after what you are already saying - "the
            retry now backs off (S3)", "the changelog suite passes (C2)". Never an id on its
            own: the plan lives on the issue, and somebody reading this pull request has your
            words and nothing else. `C2` alone tells them nothing, while the sentence with `C2`
            after it tells them everything and lets them go and find it. That goes for a
            revision too - name what changed, and put the ids after it.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "Read,Grep,Glob,LS,Edit,Write,MultiEdit,NotebookEdit,TodoWrite,Bash"
            ${{ inputs.debug && '--debug' || '' }}

      # Reads the agent's execution log: prints what it said and what it touched, and hands
      # back its summary, what the run cost and why it stopped. Runs on failure too - a run
      # that died partway is exactly when you want to see how far it got.
      - name: Report on the run
        id: report
        if: >-
          ${{ always()
          && (steps.implement_initial.outcome != 'skipped'
          || steps.implement_round.outcome != 'skipped') }}
        uses: uniquesca/ci/ai-run-report@main
        with:
          execution_file: ${{ steps.implement_initial.outputs.execution_file || steps.implement_round.outputs.execution_file }}
          verb: ${{ steps.event.outputs.mode == 'initial' && 'Implemented' || 'Revised' }}

      # A workaround for `claude-code-action`, which fails the agent step when a run used more
      # turns than `--max-turns` allowed even though the agent stopped of its own accord and
      # the work is finished.
      #
      # Two upstream problems stacked. `--max-turns` does not enforce anything on a long run:
      # the SDK stops a short run exactly on time and lets a long one straight past the limit
      # (anthropics/claude-code-action#1577). Their answer is a check that runs after the agent
      # has already stopped and reports the run as failed if the turns overran - so a finished
      # round arrives a few turns over and the step goes red for it. Nothing is saved by that:
      # the run is billed either way, and the whole point of a turn limit is to not spend the
      # money. All it does is throw the work away, and here that is an entire working tree of
      # edits nobody can get back - the branch is never pushed, because every step after the
      # agent is skipped once one has failed.
      #
      # So that step is allowed to fail without stopping the job, and this one works out what
      # its failure meant from the agent's own closing record. Work the agent finished is
      # pushed, with the overrun reported as a warning. Anything else fails here, which takes
      # `success()` false and skips the push exactly as before - a working tree an agent was
      # cut off in the middle of editing is not something to commit.
      #
      # `!cancelled()` rather than `always()`: this step decides whether the run is red, and a
      # job somebody cancelled is neither finished nor broken.
      - name: Judge the agent's own result
        id: verdict
        if: >-
          ${{ !cancelled()
          && (steps.implement_initial.outcome == 'failure'
          || steps.implement_round.outcome == 'failure') }}
        env:
          COMPLETED: ${{ steps.report.outputs.completed }}
          TURNS: ${{ steps.report.outputs.turns }}
          MAX_TURNS: ${{ inputs.max_turns }}
        run: |
          if [[ "$COMPLETED" != 'true' ]]; then
            echo "::error title=The implementing agent did not finish::Its own closing record does not report a completed run - the step's log has what went wrong"
            exit 1
          fi

          echo "::warning title=The implementing agent overran its turn limit::It finished on its own after ${TURNS:-more} turns, past the $MAX_TURNS it was given, and claude-code-action fails the step for that. The work is complete, so it was pushed anyway - raise max_turns if this keeps happening."

      - name: Commit and push the work
        id: push
        if: ${{ success() && env.PROCEED == 'true' }}
        env:
          GIT_TOKEN: ${{ steps.ai_implement.outputs.token }}
          COMPARE_REF: ${{ steps.branch.outputs.compare_ref }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          # Which branch the work sits on, and where that branch stood when this run read it.
          # Which branch it is stays settled where the branch is prepared - this step only
          # reads it, to describe the push and to replay the work on top of it.
          BASE: ${{ steps.branch.outputs.base }}
          BASE_TIP: ${{ steps.branch.outputs.base_tip }}
          # Whether this push creates the ref or adds to one that already exists. Github
          # compares the two against different things, and only the first is replayed.
          CREATED: ${{ steps.branch.outputs.created }}
          # What a new ref is compared against, which is not necessarily the branch the work
          # was cut from. Empty on an event carrying no repository, in which case that
          # comparison is simply not made.
          DEFAULT_BASE: ${{ github.event.repository.default_branch }}
          MODE: ${{ steps.event.outputs.mode }}
          ROUND: ${{ steps.stage_pr.outputs.round }}
          TITLE: ${{ steps.stage_issue.outputs.title }}
          ISSUE: ${{ steps.event.outputs.issue || steps.pull_request.outputs.issue }}
          ACTOR: ${{ steps.event.outputs.actor }}
        run: |
          git add -A

          if git diff --cached --quiet; then
            # Nothing new in the working tree. The agent was told not to commit, but check
            # anyway - if it did, there is still something to push.
            if [[ "$(git rev-list --count "$COMPARE_REF..HEAD")" -eq 0 ]]; then
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              echo "The agent left the working tree unchanged"
              exit 0
            fi
            echo "The agent committed its own work - pushing that"
          else
            {
              if [[ "$MODE" == 'initial' ]]; then
                printf '%s\n\n' "$TITLE"
                printf 'Implements #%s\n\n' "$ISSUE"
                printf 'Written by the AI implement workflow, requested by @%s.\n' "$ACTOR"
              else
                printf 'Address review feedback (round %s)\n\n' "$ROUND"
                printf 'Implements #%s\n\n' "$ISSUE"
                printf 'Written by the AI implement workflow, for review feedback from @%s.\n' "$ACTOR"
              fi
            } > "$RUNNER_TEMP/commit-message.txt"
            git commit --quiet -F "$RUNNER_TEMP/commit-message.txt"
          fi

          auth=$(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)

          # Where the base stands now, read before anything decides what to do about it.
          #
          # A read, not a catch-up. It updates a remote-tracking ref and nothing else - the
          # push below sends HEAD, which this cannot reach.
          #
          # Forced, and that matters: without the `+` a rewritten base is not a fast-forward,
          # the fetch fails, and the one case worth detecting reports itself as a branch that
          # was deleted.
          base_now=''
          base_moved='unread'
          if [[ -n "$BASE_TIP" ]]; then
            if git -c http.extraheader="AUTHORIZATION: basic $auth" \
                 fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE" 2> /dev/null; then
              base_now=$(git rev-parse "refs/remotes/origin/$BASE")

              if [[ "$base_now" == "$BASE_TIP" ]]; then
                base_moved='no'
              elif git merge-base --is-ancestor "$BASE_TIP" "$base_now"; then
                base_moved='forward'
              else
                # The commit this branch was cut from is not on the base any more, so every
                # commit under it is new to the push. Github reads a workflow file in any of
                # them as one this push is creating, which is one way a rejection happens
                # without the agent having touched a workflow file at all.
                base_moved='rewritten'
              fi
            fi
          fi

          # The work replayed on top of the base as it stands now, so the branch offers the
          # base's current files rather than the ones it was cut from an hour ago.
          #
          # This is here for one refusal in particular. A new ref has no previous tip to be
          # compared against, so Github compares the workflow files it carries against the
          # default branch - and a branch cut before somebody else edited a workflow file
          # still carries the older copy, which reads as this push updating it. `GITHUB_TOKEN`
          # is never allowed to do that, whatever this workflow's permissions say, and an
          # hour of finished work is lost over a file the agent never opened.
          #
          # Only a branch this run created. A round pushes to a ref that already exists and is
          # compared against its own previous tip, where a file the branch has been carrying
          # all along is not a change at all - and replaying one would mean force pushing over
          # work somebody may be reviewing.
          replayed='not needed'
          if [[ "$CREATED" == 'true' && ( "$base_moved" == 'forward' || "$base_moved" == 'rewritten' ) ]]; then
            if git rebase --quiet --onto "$base_now" "$BASE_TIP"; then
              replayed="yes, onto $base_now"
            else
              # Left as it was cut rather than fixed up here: the conflict is between the
              # agent's work and whatever landed on the base while it was working, and nothing
              # in this step is in a position to settle that. The push is still attempted -
              # it is refused only if a workflow file is one of the files left behind - and a
              # branch that needs a rebase is an ordinary thing for a pull request to arrive
              # as.
              git rebase --abort 2> /dev/null || true
              replayed='no, it does not replay cleanly onto the base as it stands now'
              echo "::warning title=Could not replay the work on the current base::$BASE moved while the agent was working and this branch does not rebase onto it cleanly - pushing it as it was cut, which will need a rebase before it can be merged"
            fi
          fi

          # Everything a post-mortem needs, gathered whether or not the push works, because
          # afterwards none of it can be recovered: a refused push leaves no branch, and the
          # working tree goes with the runner.
          #
          # The last refusal left the run log holding a one-line git error naming one file.
          # Which files the agent had actually touched, and what the base had been doing for
          # the hour it was thinking, were both needed to tell three different causes apart,
          # and both were gone. Nothing below changes what gets pushed - it only reads.
          from="${BASE_TIP:-$COMPARE_REF}"
          if [[ "$replayed" == yes,* ]]; then
            # The commit the branch was cut from is no longer on it. What the push carries is
            # measured from where the work now sits.
            from="$base_now"
          fi

          {
            printf 'branch:            %s\n' "$BRANCH"
            printf 'base:              %s\n' "$BASE"
            printf 'head:              %s\n' "$(git rev-parse HEAD)"

            if [[ -z "$BASE_TIP" ]]; then
              printf 'base at checkout:  not recorded\n'
            else
              printf 'base at checkout:  %s\n' "$BASE_TIP"

              case "$base_moved" in
                no)
                  printf 'base now:          %s\n' "$base_now"
                  printf 'base moved:        no\n'
                  ;;
                forward)
                  printf 'base now:          %s\n' "$base_now"
                  printf 'base moved:        yes, forward by %s commit(s)\n' \
                    "$(git rev-list --count "$BASE_TIP..$base_now")"
                  ;;
                rewritten)
                  printf 'base now:          %s\n' "$base_now"
                  printf 'base moved:        yes, REWRITTEN - the commit this branch was cut from is no longer on %s\n' "$BASE"
                  ;;
                *)
                  printf 'base now:          could not be read - %s may have been deleted\n' "$BASE"
                  ;;
              esac

              printf 'work replayed:     %s\n' "$replayed"
            fi

            printf 'commits to push:\n'
            git log --format='  %h %s' "$from..HEAD" 2> /dev/null || printf '  (could not list)\n'

            printf 'files against the base:\n'
            git diff --name-status "$from...HEAD" 2> /dev/null | sed 's/^/  /' \
              || printf '  (could not diff)\n'
          } > "$RUNNER_TEMP/push-facts.txt"

          echo "::group::What is being pushed"
          cat "$RUNNER_TEMP/push-facts.txt"
          echo "::endgroup::"

          # Called out before the attempt rather than after it. Github refuses a push that creates
          # or updates anything under .github/workflows unless the identity behind it holds the
          # `workflows` permission, and names only the first file it objects to - so the full list
          # is worth having whether the push then succeeds or not.
          #
          # Which is why this reports rather than predicts. Whether the AI Implement app was granted
          # that permission is the caller's decision and not something this run can read, so the
          # list is what Github will be looking at and the push itself settles the question.
          #
          # Two lists, because they are two different problems with two different answers.
          # First, what the commits themselves changed: the agent's own doing, and something only
          # a token with `workflow` scope can push.
          #
          # Measured from what this push adds to the ref, which is not what the pull request
          # shows. A round's branch already carries the base commits an earlier round replayed
          # it onto, and reading a workflow file out of one of those would report the agent for
          # somebody else's change - one that is on the remote branch already.
          pushed_from="$from"
          if [[ "$CREATED" != 'true' ]]; then
            pushed_from="$COMPARE_REF"
          fi

          : > "$RUNNER_TEMP/workflow-files.txt"
          git diff --name-only "$pushed_from...HEAD" -- .github/workflows/ \
            > "$RUNNER_TEMP/workflow-files.txt" 2> /dev/null || true

          # Second, what the branch merely holds a different copy of, which Github reads in
          # exactly the same way. The comparison is not the branch the work was cut from: a
          # ref that already exists is compared against its own previous tip, and a new one -
          # having no previous tip - against the default branch, whatever it was based on.
          : > "$RUNNER_TEMP/workflow-stale.txt"
          against=''
          if [[ "$CREATED" == 'true' ]]; then
            if [[ -n "$DEFAULT_BASE" ]] \
               && git -c http.extraheader="AUTHORIZATION: basic $auth" \
                    fetch --no-tags origin "+refs/heads/$DEFAULT_BASE:refs/remotes/origin/$DEFAULT_BASE" 2> /dev/null; then
              against="refs/remotes/origin/$DEFAULT_BASE"
            fi
          else
            against="$COMPARE_REF"
          fi

          if [[ -n "$against" ]]; then
            # Two endpoints and not a merge base: what Github compares is the files the ref
            # ends up holding, not the changes that got it there. Anything the commits already
            # account for is dropped - it is on the first list, and belongs to the first
            # problem.
            git diff --name-only "$against" HEAD -- .github/workflows/ 2> /dev/null \
              | grep -vxF -f "$RUNNER_TEMP/workflow-files.txt" \
              > "$RUNNER_TEMP/workflow-stale.txt" || true
          fi

          # `paste -sd', '` would cycle the two characters as alternating delimiters and
          # join three files as `a,b c`. One delimiter, then space it out.
          workflow_files=''
          if [[ -s "$RUNNER_TEMP/workflow-files.txt" ]]; then
            workflow_files=$(paste -sd, "$RUNNER_TEMP/workflow-files.txt" | sed 's/,/, /g')
            echo "::warning title=This push changes workflow files::$workflow_files - Github allows these only from an identity holding the \`workflows\` permission, so this push fails unless the AI Implement app was granted it"
          fi

          stale_files=''
          if [[ -s "$RUNNER_TEMP/workflow-stale.txt" ]]; then
            stale_files=$(paste -sd, "$RUNNER_TEMP/workflow-stale.txt" | sed 's/,/, /g')
            echo "::warning title=This push carries older copies of workflow files::$stale_files - the agent did not touch them, but they differ from the copy on ${against#refs/remotes/origin/}, and Github reads that as this push updating them"
          fi

          if ! git -c http.extraheader="AUTHORIZATION: basic $auth" \
                 push origin "HEAD:refs/heads/$BRANCH" 2>&1 | tee "$RUNNER_TEMP/push-output.txt"; then
            # The run summary outlives nothing here, but it is the one place somebody reading
            # the failure comment can get to in a click, and it does not require scrolling a
            # job log to find
            {
              printf '## The push was refused\n\n```\n'
              cat "$RUNNER_TEMP/push-output.txt"
              printf '```\n\n```\n'
              cat "$RUNNER_TEMP/push-facts.txt"
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"

            if [[ -n "$workflow_files" ]]; then
              printf 'reason=%s\n' "this branch changes $workflow_files, and the AI Implement app does not hold the \`workflows\` permission Github requires to push them. Grant it only if you want an agent editing CI." >> "$GITHUB_OUTPUT"
              echo "::error title=Push refused, and it changes workflow files::$workflow_files"
            elif [[ -n "$stale_files" ]]; then
              printf 'reason=%s\n' "the branch is still carrying an older copy of $stale_files, which Github reads as this push updating a workflow file. The base moved on while the agent was working and the work would not replay on top of it. Running the command again starts from the base as it stands now." >> "$GITHUB_OUTPUT"
              echo "::error title=Push refused over workflow files the branch is behind on::$stale_files"
            fi

            exit 1
          fi

          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # One pull request per issue, opened by the first run and reused by every round after.
      # A round never reaches this - it already has one.
      - name: Open or reuse the pull request
        id: pr
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.event.outputs.mode == 'initial'
          && steps.push.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.ai_implement.outputs.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          TITLE: ${{ steps.stage_issue.outputs.title }}
          # Resolved where the branch was, so the pull request targets whatever the work was
          # actually cut from - the default branch unless the command asked for another
          BASE: ${{ steps.branch.outputs.base }}
          ISSUE: ${{ steps.event.outputs.issue }}
          PLAN_URL: ${{ steps.stage_issue.outputs.plan_url }}
          SUMMARY_FILE: ${{ steps.report.outputs.result_file }}
          COMMAND: ${{ inputs.command }}
          REOPEN: ${{ steps.existing.outputs.reopen }}
          # What the pull request being revived used to target. Only differs from BASE when its
          # branch was gone and a new one was cut from somewhere else.
          OLD_BASE: ${{ steps.existing.outputs.base }}
        run: |
          url=''

          if [[ -n "$REOPEN" ]]; then
            # A pull request somebody closed. Pushing to its branch does not reopen it, and
            # opening a second one for the same issue would split the review.
            #
            # Github refuses to reopen a pull request whose branch was deleted after it was
            # closed, and that is a normal thing to have happened. Falling through to opening
            # a fresh one is better than failing the run over it.
            if gh pr reopen "$REOPEN" 2>&1; then
              url=$(gh pr view "$REOPEN" --json url --jq '.url')
              number="$REOPEN"
              echo "Reopened $url"
              echo "created=false" >> "$GITHUB_OUTPUT"

              # A revived pull request whose branch had been deleted got a new branch cut for it
              # above, and that branch may have been cut from somewhere else - the push before
              # this step is what let the reopen succeed at all. Its old target would then
              # describe the wrong thing, showing everything between the two bases as part of
              # this change, so the pull request is moved to what the branch actually sits on.
              if [[ -n "$OLD_BASE" && "$OLD_BASE" != "$BASE" ]]; then
                if gh pr edit "$REOPEN" --base "$BASE"; then
                  echo "Retargeted #$REOPEN from $OLD_BASE onto $BASE, which is what its branch was recreated from"
                else
                  echo "::warning title=Could not retarget::#$REOPEN still targets $OLD_BASE while its branch was cut from $BASE - retarget it yourself, or the diff will read wrong"
                fi
              fi
            else
              echo "::warning title=Could not reopen::Pull request #$REOPEN would not reopen - opening a new one instead"
            fi
          fi

          if [[ -z "$url" ]]; then
            # Written to RUNNER_TEMP rather than the checkout - this workflow commits its
            # working tree, so nothing scratch belongs in it.
            #
            # `Implements` rather than `Closes` on purpose. Review here is the point, and
            # auto-closing the issue on the first merge cuts that short - as does merging a
            # partial implementation.
            {
              printf 'Implements #%s.\n\n' "$ISSUE"
              [[ -n "$PLAN_URL" ]] && printf 'Built from the [approved plan](%s).\n\n' "$PLAN_URL"
              if [[ -n "$SUMMARY_FILE" && -f "$SUMMARY_FILE" ]]; then
                cat "$SUMMARY_FILE"
                printf '\n'
              fi
              # Empty here, filled in by the step below. Printing the pair is how this decides
              # where the QA criteria go - under what the agent did, above the review
              # instructions, which is where somebody about to test the change will look.
              printf '%s\n%s\n\n' "$QA_MARKER" "$QA_END_MARKER"
              printf -- '---\n\n'
              printf 'Review happens here from now on. Comment on the lines you want changed and submit the review as **Request changes**, and the next round starts by itself.\n\n'
              # This workflow's own command, said on the pull request rather than only in the
              # hand-off comment back on the issue. It is the answer to "how do I ask for a round"
              # wherever that comes up later - including a revised plan, which the planning
              # workflow announces here without naming a command it does not own.
              printf '`%s` here runs a round too, for when you would rather say what you want in prose than in review comments.\n' "$COMMAND"
            } > "$RUNNER_TEMP/pr-body.md"

            url=$(gh pr create --base "$BASE" --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md")
            # `gh pr create` prints the pull request URL, which ends in its number
            number="${url##*/}"
            echo "Opened $url"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

          {
            printf 'url=%s\n' "$url"
            printf 'number=%s\n' "$number"
          } >> "$GITHUB_OUTPUT"

      # The plan's `QA` criteria are the one part of it written for somebody who will not read
      # the code, and they were stranded on the issue - the pull request is where that person
      # is. Copied rather than summarised, into the marker pair the body already carries.
      #
      # Twice, for two different reasons. A first run seeds a pull request that has just been
      # opened, or one revived from a closed one, whose body predates all of this. A round
      # working to a revised plan refreshes what is there, because criteria a revision has
      # dropped are worse than no copy at all - `ai-plan` refreshes them the moment it revises,
      # and this is what covers a plan that moved while the first run was still working.
      - name: Carry the QA criteria into the pull request
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && (
            (steps.event.outputs.mode == 'initial' && steps.pr.outputs.url != '')
            || (steps.event.outputs.mode == 'round' && steps.revision.outputs.revised == 'true')
          ) }}
        uses: uniquesca/ci/ai-qa-criteria@main
        with:
          pull_request: ${{ steps.pr.outputs.number || steps.event.outputs.pull_request }}
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          plan_file: ${{ steps.stage_issue.outputs.plan_file }}
          plan_url: ${{ steps.stage_issue.outputs.plan_url }}
          marker: ${{ env.QA_MARKER }}
          end_marker: ${{ env.QA_END_MARKER }}

      # The issue is where the work was asked for, so the pull request has to be findable
      # from it. This is also the hand-off: after this comment, the issue is only for the
      # plan.
      - name: Post the pull request link on the issue
        id: post_link
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.event.outputs.mode == 'initial'
          && steps.pr.outputs.url != '' }}
        env:
          ISSUE: ${{ steps.event.outputs.issue }}
          PR_URL: ${{ steps.pr.outputs.url }}
          ACTOR: ${{ steps.event.outputs.actor }}
          USAGE: ${{ steps.report.outputs.summary }}
          COMMAND: ${{ inputs.command }}
        run: |
          {
            printf '<!-- ai-implement -->\n\n'
            printf 'Opened %s with an implementation of the plan.\n\n' "$PR_URL"
            printf 'The work continues there, not here. Comment on the lines you want changed and submit the review as **Request changes** - another round starts by itself. `%s` works in the pull request too.\n\n' "$COMMAND"
            printf 'This issue keeps the plan. Run `/ai-plan` here if the approach itself needs revising, and the next round will pick it up.\n\n'
            printf -- '---\n\n'
            printf 'Requested by @%s.' "$ACTOR"
            [[ -n "$USAGE" ]] && printf ' %s.' "$USAGE"
            printf '\n'
          } > "$RUNNER_TEMP/implement-comment.md"

          cat "$RUNNER_TEMP/implement-comment.md" >> "$GITHUB_STEP_SUMMARY"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/implement-comment.md"

      # An initial run that produced nothing has no pull request to say so in.
      - name: Report an empty implementation
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.event.outputs.mode == 'initial'
          && steps.push.outputs.pushed == 'false' }}
        env:
          ISSUE: ${{ steps.event.outputs.issue }}
          ACTOR: ${{ steps.event.outputs.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --body "@$ACTOR the implementing agent finished without changing any files, so there is nothing to open a pull request with. The run log has what it did: $RUN_URL"

      # Answering each thread is how a review loop closes. Posted after the push, so a reply
      # can talk about work that is actually on the branch, and only for a round - the first
      # run has no threads to answer.
      - name: Post the replies to the review
        id: replies
        if: ${{ success() && env.PROCEED == 'true' && steps.event.outputs.mode == 'round' }}
        uses: uniquesca/ci/ai-post-review-replies@main
        with:
          pull_request: ${{ steps.event.outputs.pull_request }}
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          marker: ${{ env.REPLY_MARKER }}

      # Every round ends with one of these, whether or not it changed a file. It is what the
      # next round counts to find the unattended streak, and what it reads to know where to
      # draw its watermark - so a round that skipped this would have the next one act on the
      # same feedback all over again.
      - name: Close the round
        id: close
        if: ${{ success() && env.PROCEED == 'true' && steps.event.outputs.mode == 'round' }}
        env:
          PR: ${{ steps.event.outputs.pull_request }}
          ACTOR: ${{ steps.event.outputs.actor }}
          TRIGGER: ${{ steps.event.outputs.trigger }}
          ATTENDED: ${{ steps.event.outputs.attended }}
          ROUND: ${{ steps.stage_pr.outputs.round }}
          STAGED_AT: ${{ steps.stage_pr.outputs.staged_at }}
          FEEDBACK_COUNT: ${{ steps.stage_pr.outputs.feedback_count }}
          CHECK_COUNT: ${{ steps.stage_pr.outputs.check_count }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          POSTED: ${{ steps.replies.outputs.posted }}
          SUMMARY_FILE: ${{ steps.report.outputs.result_file }}
          USAGE: ${{ steps.report.outputs.summary }}
          REVISED: ${{ steps.revision.outputs.revised }}
          PLAN_URL: ${{ steps.stage_issue.outputs.plan_url }}
        run: |
          # Built with jq rather than printf, so a timestamp or a flag can never break the
          # line the next round parses
          meta=$(jq -nc \
            --argjson attended "$ATTENDED" \
            --argjson round "$ROUND" \
            --arg staged_at "$STAGED_AT" \
            --arg trigger "$TRIGGER" \
            '{attended: $attended, round: $round, staged_at: $staged_at, trigger: $trigger}')

          {
            printf '%s\n' "$ROUND_MARKER"
            printf '<!-- %s -->\n\n' "$meta"

            # Above the agent's own summary, not in the footer with the counts. A round that
            # reconciled the branch with a new specification did something nobody may have asked
            # for on this pull request - a round the checks started reads the newest plan like any
            # other - and the largest thing it did is the last thing to leave for the small print.
            if [[ "$REVISED" == 'true' ]]; then
              printf '> **A revised plan was found on the issue, so this round worked to it.**'
              printf ' The whole branch was reconciled against the revision, not only the feedback below'
              [[ -n "$PLAN_URL" ]] && printf ' - [read it](%s)' "$PLAN_URL"
              printf '.\n\n'
            fi

            if [[ -n "$SUMMARY_FILE" && -f "$SUMMARY_FILE" ]]; then
              cat "$SUMMARY_FILE"
            else
              printf 'The agent finished without a summary of this round. The run log has what it did.\n'
            fi

            printf '\n\n'
            printf -- '---\n\n'
            printf 'Round %s, on %s feedback item(s)' "$ROUND" "$FEEDBACK_COUNT"
            [[ "$CHECK_COUNT" != '0' ]] && printf ' including %s failing check(s)' "$CHECK_COUNT"
            printf '.'
            # The revised plan is not a feedback item, so the count above does not account for it.
            # Said once here for the record - the reader was already told at the top.
            [[ "$REVISED" == 'true' ]] && printf ' Worked to a revised plan.'
            if [[ "$TRIGGER" == 'review' ]]; then
              printf ' Started by @%s requesting changes.' "$ACTOR"
            else
              printf ' Requested by @%s.' "$ACTOR"
            fi
            [[ -n "$POSTED" && "$POSTED" != '0' ]] && printf ' Answered %s review thread(s).' "$POSTED"
            [[ "$PUSHED" != 'true' ]] && printf ' **No file changed this round.**'
            [[ -n "$USAGE" ]] && printf ' %s.' "$USAGE"
            printf '\n'
          } > "$RUNNER_TEMP/round-comment.md"

          cat "$RUNNER_TEMP/round-comment.md" >> "$GITHUB_STEP_SUMMARY"
          gh issue comment "$PR" --body-file "$RUNNER_TEMP/round-comment.md"

      # Put the work back in a person's review queue. Submitting a review clears their pending
      # request, so without this a round they asked for finishes with nobody assigned to look at
      # the result. Github re-requests a review that was already submitted, which is what makes
      # the pull request reappear in their queue.
      #
      # Deliberately not conditional on anything having been pushed. A round that changed no file
      # is a round where the agent pushed back with a reason instead of complying, and that is
      # precisely when the person who asked needs to read it and decide.
      #
      # Only ever a person, and never the pull request's own author - Github rejects a bot as a
      # requested reviewer, and rejects anybody reviewing their own pull request. A round a bot
      # triggered simply skips this: whoever was asked on an earlier round still has the request.
      - name: Ask the person who triggered it for a review
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && inputs.request_review
          && steps.event.outputs.actor_type == 'User' }}
        env:
          PR: ${{ steps.event.outputs.pull_request || steps.pr.outputs.number }}
          ACTOR: ${{ steps.event.outputs.actor }}
        run: |
          if [[ -z "$PR" ]]; then
            echo "No pull request to request a review on"
            exit 0
          fi

          author=$(gh pr view "$PR" --json author --jq '.author.login' 2> /dev/null || echo '')

          if [[ -n "$author" && "$ACTOR" == "$author" ]]; then
            echo "@$ACTOR opened #$PR, so there is no review to request from them"
            exit 0
          fi

          jq -n --arg login "$ACTOR" '{reviewers: [$login]}' > "$RUNNER_TEMP/reviewer.json"

          # A request that does not land costs the notification, not the work - which is already
          # pushed and already commented on. Warn rather than turn a good round red.
          if gh api --method POST "repos/$GH_REPO/pulls/$PR/requested_reviewers" \
               --input "$RUNNER_TEMP/reviewer.json" > /dev/null; then
            echo "Asked @$ACTOR to review #$PR"
          else
            echo "::warning title=Could not request a review::@$ACTOR was not added as a reviewer on #$PR - they may not have read access to the repository"
          fi

      # Hand the work to a reviewing agent. Last, so that the round comment and the thread
      # replies are already in place - the reviewer reads both, and a review that arrived
      # before them would be reviewing a round it cannot see the end of.
      #
      # `repository_dispatch` rather than letting a `pull_request` trigger notice the push. Such a
      # run does start - the app's push is a real event - but it starts on the push, and there is no
      # holding it until the paragraph above is true. Dispatching last is what orders the two, and it
      # keeps whether to review at all in `dispatch_review` rather than in a trigger the caller has
      # to remember to remove.
      #
      # Nothing is dispatched for a round that changed no file. Reviewing the same commit again
      # produces the same review, and the loop would turn without moving.
      - name: Ask for a review
        id: dispatch
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && inputs.dispatch_review
          && steps.push.outputs.pushed == 'true' }}
        env:
          PR: ${{ steps.event.outputs.pull_request || steps.pr.outputs.number }}
          DISPATCH_TYPE: ${{ inputs.review_dispatch_type }}
        run: |
          if [[ -z "$PR" ]]; then
            echo "::warning title=No pull request to review::Nothing was dispatched"
            exit 0
          fi

          jq -n --arg type "$DISPATCH_TYPE" --argjson pr "$PR" \
            '{event_type: $type, client_payload: {pull_request: $pr}}' \
            > "$RUNNER_TEMP/dispatch.json"

          # A dispatch that does not land costs the review, not the work - which is already
          # pushed and already commented on. Warn rather than turn a good round red.
          if gh api --method POST "repos/$GH_REPO/dispatches" --input "$RUNNER_TEMP/dispatch.json"; then
            echo "Asked for a '$DISPATCH_TYPE' review of #$PR"
          else
            echo "::warning title=Could not ask for a review::The $DISPATCH_TYPE dispatch for #$PR failed - review it yourself, or comment on it to start another round"
          fi

      # A failed run is otherwise invisible from the issue or the pull request - whoever asked
      # is left waiting for something that never appears. Scoped to these steps' own outcomes
      # rather than `failure()`, which would also fire for the permission refusal above, and
      # that already comments for itself.
      #
      # `verdict` and not the two agent steps: one of those goes red for an overrun that cost
      # the work nothing, and a round that was pushed must not also be reported as unfinished.
      - name: Report a failed run
        if: >-
          ${{ always()
          && (steps.pull_request.outcome == 'failure'
          || steps.base.outcome == 'failure'
          || steps.stage_issue.outcome == 'failure'
          || steps.stage_pr.outcome == 'failure'
          || steps.branch.outcome == 'failure'
          || steps.verdict.outcome == 'failure'
          || steps.report.outcome == 'failure'
          || steps.push.outcome == 'failure'
          || steps.pr.outcome == 'failure'
          || steps.post_link.outcome == 'failure'
          || steps.close.outcome == 'failure') }}
        env:
          TARGET: ${{ steps.event.outputs.target }}
          ACTOR: ${{ steps.event.outputs.actor }}
          MODE: ${{ steps.event.outputs.mode }}
          # Why the agent stopped, where it recorded one. It turns "the run went red" into
          # something actionable - an exhausted credit balance and a genuine bug look
          # identical otherwise.
          REASON: ${{ steps.report.outputs.reason }}
          # Why the push was refused, where the refusal had a nameable cause. A rejected push
          # is the failure that loses finished work outright, so "the run log has the detail"
          # is not enough on its own - the detail belongs where somebody will read it.
          PUSH_REASON: ${{ steps.push.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            if [[ "$MODE" == 'initial' ]]; then
              printf '@%s the implementation did not finish, so there is no pull request for this issue.\n\n' "$ACTOR"
            else
              printf '@%s this round did not finish, so the feedback on this pull request has not been acted on.\n\n' "$ACTOR"
            fi
            if [[ -n "$PUSH_REASON" ]]; then
              printf 'The work was written but could not be pushed: %s\n\n' "$PUSH_REASON"
            fi
            if [[ -n "$REASON" ]]; then
              printf 'It stopped with: `%s`\n\n' "$REASON"
            fi
            printf 'The run log has the detail: %s\n' "$RUN_URL"
          } > "$RUNNER_TEMP/failure-comment.md"

          cat "$RUNNER_TEMP/failure-comment.md" >> "$GITHUB_STEP_SUMMARY"

          # A `workflow_run` round whose branch has no open pull request has nowhere to post -
          # both numbers are empty, and `gh issue comment ""` resolves the current branch, finds
          # no checkout and fails. This step exists to explain a failure, so failing inside it
          # buries the thing it was reporting. The summary above has already been written either
          # way, which is the part somebody clicking through from the run will actually read.
          if [[ -z "$TARGET" ]]; then
            echo "::warning title=Nowhere to report the failure::This run has no issue or pull request to comment on - the run summary has the detail"
            exit 0
          fi

          gh issue comment "$TARGET" --body-file "$RUNNER_TEMP/failure-comment.md" \
            || echo "::warning title=Could not report the failure::Nothing was posted on #$TARGET - the run summary has the detail"
