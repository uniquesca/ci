name: Build Docker images

on:
  push:
    tags:
      - '*'
  # The escape hatch out of the change detection below, and the only way to rebuild images whose
  # build failed on the tag that last touched them: a manual run always builds everything
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  # The images are tagged with a PHP version, not a release version, so a tag that changes nothing
  # under `docker/` republishes what is already there under the name it is already published as.
  # That is most tags - this repository is released far more often than its images change
  changes:
    name: Decide whether the images need building
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # The comparison below is against the previous tag, and neither it nor the history
          # reaching back to it survives a shallow clone
          fetch-depth: 0

      - name: Decide whether the images need building
        id: decide
        run: |
          set -u

          # Anything that is not a tag push is somebody asking for a build by hand
          if [[ "$GITHUB_EVENT_NAME" != 'push' ]]; then
            echo "Started by hand - building every image"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [[ -z "$previous" ]]; then
            echo "No tag before $GITHUB_REF_NAME to compare against - building every image"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The workflow counts as an input to the images: a change to how they are built is a
          # reason to build them even when no Dockerfile moved
          watched=( docker/ .github/workflows/build-docker-images.yml )

          if git diff --quiet "$previous" "$GITHUB_REF_NAME" -- "${watched[@]}"; then
            echo "Nothing the images are built from changed between $previous and $GITHUB_REF_NAME - they would be republished byte for byte under the tags they already carry"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed between $previous and $GITHUB_REF_NAME:"
            git diff --stat "$previous" "$GITHUB_REF_NAME" -- "${watched[@]}"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # The three PROD images share nothing but their base, so they are built at once rather than one
  # after another. Each architecture is built natively on its own runner and pushed by digest
  # only; `prod-merge` puts the two under the image's tags
  prod:
    name: PROD ${{ matrix.variant }} (PHP ${{ matrix.php-version }}, ${{ matrix.arch }})
    needs: [ changes ]
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # What lets the run's own token push to ghcr.io. A package these images were first pushed to
    # with a personal access token is linked to no repository, so `GITHUB_TOKEN` is refused until
    # each one grants this repository the Write role under Package settings, Manage Actions access
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Quoted, because YAML reads 5.6 as a number and the value is used as an image tag
        php-version: [ '5.6', '8.1', '8.2', '8.3', '8.4' ]
        variant: [ apachemod, fpm, apachefpm ]
        arch: [ amd64, arm64 ]
        exclude:
          # Apache + FPM was introduced long after 5.6 went end of life, and there is no image
          # of it for that version to build on
          - php-version: '5.6'
            variant: apachefpm
          # 5.6 is being retired. `prod-merge` and `dev-merge` expect one architecture for it
          - php-version: '5.6'
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The default `docker` driver cannot export a build cache, so without this the layer cache
      # below is silently ignored
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve what to build
        id: image
        env:
          PHP_VERSION: ${{ matrix.php-version }}
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -u

          # 5.6 predates every base image the others are built on, and the newest Node it can be
          # asked to carry
          if [[ "$PHP_VERSION" == '5.6' ]]; then
            suite='stretch'
            node_version='16'
          else
            suite='trixie'
            node_version='24'
          fi

          case "$VARIANT" in
            apachemod)
              base="php:${PHP_VERSION}-apache-${suite}"
              # `php-prod` is what the mod_php image was called before there was more than one
              # image, still published under both names so that anything pinned to it keeps working
              tags="ghcr.io/uniquesca/php-apachemod-prod:${PHP_VERSION},ghcr.io/uniquesca/php-prod:${PHP_VERSION}"
              ;;
            fpm)
              base="php:${PHP_VERSION}-fpm-${suite}"
              tags="ghcr.io/uniquesca/php-fpm-prod:${PHP_VERSION}"
              ;;
            apachefpm)
              base="php:${PHP_VERSION}-fpm-${suite}"
              tags="ghcr.io/uniquesca/php-apachefpm-prod:${PHP_VERSION}"
              ;;
            *)
              echo "::error::No PROD image is defined for the variant $VARIANT"
              exit 1
              ;;
          esac

          {
            echo "base=$base"
            echo "tags=$tags"
            echo "repository=ghcr.io/uniquesca/php-${VARIANT}-prod"
            echo "node_version=$node_version"
            # Kept in the image's own package, which already grants this repository the Write role
            # the images are pushed with. One cache per PHP version and architecture: they share a
            # package, and a single ref would have each build overwrite the last one's cache
            echo "cache=ghcr.io/uniquesca/php-${VARIANT}-prod:buildcache-${PHP_VERSION}-${ARCH}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          file: docker/php-${{ matrix.variant }}-prod/Dockerfile
          platforms: linux/${{ matrix.arch }}
          # Untagged: a tag pushed from here would carry one architecture until `prod-merge` ran
          outputs: type=image,name=${{ steps.image.outputs.repository }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
            PHP_BASE_IMAGE=${{ steps.image.outputs.base }}
            NODE_VERSION=${{ steps.image.outputs.node_version }}
          # What makes a one-line change to a Dockerfile cost one layer instead of an apt install,
          # a Node build and every PHP extension. `mode=max` so the intermediate layers are kept
          # too, not just the ones in the final image
          cache-from: type=registry,ref=${{ steps.image.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.image.outputs.cache }},mode=max
          # Buildx would otherwise attach a provenance attestation, listed in the image as an
          # extra `unknown/unknown` platform that nothing here reads
          provenance: false

      - name: Hand the digest to the merge
        env:
          REPOSITORY: ${{ steps.image.outputs.repository }}
          TAGS: ${{ steps.image.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -u
          mkdir image
          echo "$REPOSITORY" > image/repository
          echo "$TAGS" > image/tags
          echo "$DIGEST" > "image/digest-$ARCH"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: prod-${{ matrix.variant }}-${{ matrix.php-version }}-${{ matrix.arch }}
          path: image/
          retention-days: 1

  # Publishes each image under its tags once all its architectures are pushed. `!cancelled()` so
  # one failed build does not hold back every other image; an image missing an architecture
  # fails here instead of being published without it
  prod-merge:
    name: PROD ${{ matrix.variant }} (PHP ${{ matrix.php-version }})
    needs: [ changes, prod ]
    if: ${{ !cancelled() && needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '5.6', '8.1', '8.2', '8.3', '8.4' ]
        variant: [ apachemod, fpm, apachefpm ]
        exclude:
          - php-version: '5.6'
            variant: apachefpm
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          pattern: prod-${{ matrix.variant }}-${{ matrix.php-version }}-*
          path: image
          merge-multiple: true

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish under the image's tags
        env:
          PHP_VERSION: ${{ matrix.php-version }}
        run: &merge |
          set -u
          shopt -s nullglob

          # Mirrors the `arch` excludes in the build job's matrix
          expected=2
          [[ "$PHP_VERSION" == '5.6' ]] && expected=1

          digests=( image/digest-* )
          if (( ${#digests[@]} != expected )); then
            echo "::error::Only ${#digests[@]} of $expected architectures were built - not publishing"
            exit 1
          fi

          repository="$(< image/repository)"
          args=()
          IFS=',' read -ra tags < image/tags
          for tag in "${tags[@]}"; do
            args+=( --tag "$tag" )
          done
          for file in "${digests[@]}"; do
            args+=( "${repository}@$(< "$file")" )
          done

          docker buildx imagetools create "${args[@]}"

  # Every DEV image is its PROD image plus Xdebug, pulled by tag - so this waits for every PROD
  # image to be published, and each runner pulls the architecture it runs on. It is a single layer
  # over an image that was just built, so there is no cache here worth keeping: a fresh PROD digest
  # invalidates it every time
  dev:
    name: DEV ${{ matrix.variant }} (PHP ${{ matrix.php-version }}, ${{ matrix.arch }})
    needs: [ changes, prod-merge ]
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '5.6', '8.1', '8.2', '8.3', '8.4' ]
        variant: [ apachemod, fpm, apachefpm ]
        arch: [ amd64, arm64 ]
        exclude:
          - php-version: '5.6'
            variant: apachefpm
          - php-version: '5.6'
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The default `docker` driver cannot push by digest
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve what to build
        id: image
        env:
          PHP_VERSION: ${{ matrix.php-version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -u

          # No `PHP_BASE_IMAGE`: each DEV Dockerfile defaults it to its own PROD image at this
          # version, which is exactly what `prod-merge` published
          case "$VARIANT" in
            apachemod)
              tags="ghcr.io/uniquesca/php-apachemod-dev:${PHP_VERSION},ghcr.io/uniquesca/php-dev:${PHP_VERSION}"
              ;;
            fpm)
              tags="ghcr.io/uniquesca/php-fpm-dev:${PHP_VERSION}"
              ;;
            apachefpm)
              tags="ghcr.io/uniquesca/php-apachefpm-dev:${PHP_VERSION}"
              ;;
            *)
              echo "::error::No DEV image is defined for the variant $VARIANT"
              exit 1
              ;;
          esac

          {
            echo "tags=$tags"
            echo "repository=ghcr.io/uniquesca/php-${VARIANT}-dev"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          file: docker/php-${{ matrix.variant }}-dev/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.image.outputs.repository }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
          provenance: false

      - name: Hand the digest to the merge
        env:
          REPOSITORY: ${{ steps.image.outputs.repository }}
          TAGS: ${{ steps.image.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -u
          mkdir image
          echo "$REPOSITORY" > image/repository
          echo "$TAGS" > image/tags
          echo "$DIGEST" > "image/digest-$ARCH"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: dev-${{ matrix.variant }}-${{ matrix.php-version }}-${{ matrix.arch }}
          path: image/
          retention-days: 1

  dev-merge:
    name: DEV ${{ matrix.variant }} (PHP ${{ matrix.php-version }})
    needs: [ changes, dev ]
    if: ${{ !cancelled() && needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '5.6', '8.1', '8.2', '8.3', '8.4' ]
        variant: [ apachemod, fpm, apachefpm ]
        exclude:
          - php-version: '5.6'
            variant: apachefpm
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          pattern: dev-${{ matrix.variant }}-${{ matrix.php-version }}-*
          path: image
          merge-multiple: true

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish under the image's tags
        env:
          PHP_VERSION: ${{ matrix.php-version }}
        run: *merge
