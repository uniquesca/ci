name: Tests

on:
  push:
    branches:
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Node 24 matches the runtime the actions in this repository declare in their action.yml
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      # No install step: node_modules is committed, the actions rely on it at runtime
      - name: Run tests
        run: npm test
