name: Release flow

# Starts `release/<version>` from develop, prepares it, then does what `git flow release finish`
# would. Each job needs the one before it, so nothing is merged or tagged unless the preparation
# succeeded. Publishing is left to the caller, as a job that needs this one.
#
# The branch, the pushes to the main branch and develop, and the tag are made with a token of the
# release GitHub App: the rulesets let only the app create release branches and tags, so nobody
# releases by hand. What the app makes starts workflows, so a caller must not prepare on branch
# creation or publish on tags itself - this run does both.
#
# What is merged is the commit the preparation left, never a later push to the branch: changes to
# a release go to develop, and the release runs again.
on:
  workflow_call:
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: 'Private key of the release GitHub App'
        required: true
      COMPOSER_ACCESS_TOKEN:
        description: 'Access token for cloning Uniques private repositories, for the preparation'
        required: false
      NPM_ACCESS_TOKEN:
        description: 'Access token for authentication with the NPM registry, for the preparation'
        required: false
    inputs:
      version:
        description: 'Version to release, x.y.z'
        required: true
        type: string
      release_app_id:
        description: 'App ID or client ID of the release GitHub App'
        required: true
        type: string
      main_branch:
        description: 'Branch the release is merged into besides develop'
        required: false
        default: 'main'
        type: string
      qa_workflow:
        description: 'File name(s) of the workflow(s) that have to have passed on the develop commit being released, separated by spaces'
        required: false
        default: 'qa-checks.yml'
        type: string
      generate_changelog:
        description: 'Passed to prepare-release.yml'
        required: false
        default: true
        type: boolean
      generate_coverage_badge:
        description: 'Passed to prepare-release.yml'
        required: false
        default: false
        type: boolean
      generate_coverage_report:
        description: 'Passed to prepare-release.yml'
        required: false
        default: false
        type: boolean
      changelog_dir:
        description: 'Passed to prepare-release.yml'
        required: false
        default: '.'
        type: string
      coverage_badge_file:
        description: 'Passed to prepare-release.yml'
        required: false
        default: 'coverage.svg'
        type: string
      coverage_report_file:
        description: 'Passed to prepare-release.yml'
        required: false
        default: 'docs/coverage.md'
        type: string
      use_db:
        description: 'Passed to prepare-release.yml'
        required: false
        default: false
        type: boolean
      update_db:
        description: 'Passed to prepare-release.yml'
        required: false
        default: false
        type: boolean
      sql_command:
        description: 'Passed to prepare-release.yml'
        required: false
        default: ''
        type: string
      mysql_version:
        description: 'Passed to prepare-release.yml'
        required: false
        default: '8.0'
        type: string
      mysql_config:
        description: 'Passed to prepare-release.yml'
        required: false
        default: ''
        type: string
      db_dump_path:
        description: 'Passed to prepare-release.yml'
        required: false
        default: ''
        type: string
      migration_command:
        description: 'Passed to prepare-release.yml'
        required: false
        default: './vendor/bin/phinx migrate'
        type: string
      pre_cmd:
        description: 'Passed to prepare-release.yml'
        required: false
        default: ''
        type: string
      post_cmd:
        description: 'Passed to prepare-release.yml'
        required: false
        default: ''
        type: string
      node_version:
        description: 'Passed to prepare-release.yml'
        required: false
        default: 20
        type: number
      env_variables:
        description: 'Passed to prepare-release.yml'
        required: false
        default: '{}'
        type: string

defaults:
  run:
    shell: bash

env:
  VERSION: ${{ inputs.version }}
  BRANCH: release/${{ inputs.version }}
  MAIN: ${{ inputs.main_branch }}

jobs:
  start:
    name: Start the release branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      # Anyone with write access can run a workflow by hand. `role_name`, not `permission`: the
      # latter reports a maintainer as "write"
      - name: Check the user is a maintainer or an admin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() {
            echo "::error::$1"
            echo "**The release did not start.** $1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq .role_name)
          if [ "$role" != "admin" ] && [ "$role" != "maintain" ]; then
            fail "Only repository maintainers and admins can release, and $GITHUB_ACTOR is '$role'"
          fi

      # Before anything else, so a wrong key or an app not installed here fails before a branch exists
      - name: Get a release app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.release_app_id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0
          filter: blob:none

      - name: Check the version and develop
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          QA_WORKFLOW: ${{ inputs.qa_workflow }}
        run: |
          fail() {
            echo "::error::$1"
            echo "**The release did not start.** $1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            fail "The version must look like 1.2.3, got '$VERSION'"
          fi

          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            fail "Tag $VERSION already exists"
          fi

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            fail "Branch \`$BRANCH\` already exists. Finish or delete it first"
          fi

          latest=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            fail "$VERSION is not above the latest release, $latest"
          fi

          # The preparation runs PHPUnit on one PHP version at most; the full QA matrix, and e2e
          # tests where a repository lists them, are what already ran on develop. No workflow runs
          # on the release branch
          sha=$(git rev-parse HEAD)
          for workflow in $QA_WORKFLOW; do
            qa=$(gh run list --workflow "$workflow" --commit "$sha" --event push --limit 1 \
              --json status,conclusion,url --jq '.[0] // empty')
            at="on develop at \`${sha:0:7}\`"
            if [ -z "$qa" ]; then
              fail "No $workflow run found $at. Push develop or rerun QA, then release again"
            fi
            url=$(jq -r .url <<< "$qa")
            conclusion=$(jq -r '.conclusion // empty' <<< "$qa")
            if [ "$(jq -r .status <<< "$qa")" != "completed" ]; then
              fail "$workflow is still running $at ([run]($url)). Release again once it passes"
            elif [ "$conclusion" != "success" ]; then
              fail "$workflow ended with '$conclusion' $at ([run]($url)). Fix develop, then release again"
            fi
          done

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION from develop at \`${sha:0:7}\`, previous release $latest" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the release branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ steps.check.outputs.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$SHA" > /dev/null

  prepare:
    name: Prepare release
    needs: [ start ]
    permissions:
      contents: write
    uses: uniquesca/ci/.github/workflows/prepare-release.yml@v11
    secrets:
      COMPOSER_ACCESS_TOKEN: ${{ secrets.COMPOSER_ACCESS_TOKEN }}
      NPM_ACCESS_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
    with:
      version: ${{ inputs.version }}
      ref: release/${{ inputs.version }}
      generate_changelog: ${{ inputs.generate_changelog }}
      generate_coverage_badge: ${{ inputs.generate_coverage_badge }}
      generate_coverage_report: ${{ inputs.generate_coverage_report }}
      changelog_dir: ${{ inputs.changelog_dir }}
      coverage_badge_file: ${{ inputs.coverage_badge_file }}
      coverage_report_file: ${{ inputs.coverage_report_file }}
      use_db: ${{ inputs.use_db }}
      update_db: ${{ inputs.update_db }}
      sql_command: ${{ inputs.sql_command }}
      mysql_version: ${{ inputs.mysql_version }}
      mysql_config: ${{ inputs.mysql_config }}
      db_dump_path: ${{ inputs.db_dump_path }}
      migration_command: ${{ inputs.migration_command }}
      pre_cmd: ${{ inputs.pre_cmd }}
      post_cmd: ${{ inputs.post_cmd }}
      node_version: ${{ inputs.node_version }}
      env_variables: ${{ inputs.env_variables }}

  close:
    name: Merge and tag
    needs: [ prepare ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get a release app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.release_app_id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: develop
          fetch-depth: 0

      - name: Merge into the main branch and develop
        id: merge
        env:
          PREPARED: ${{ needs.prepare.outputs.sha }}
        run: |
          git config user.email "gha@uniques.ca"
          git config user.name "GitHub Actions"

          git fetch origin "$BRANCH"
          if [ -z "$PREPARED" ] || [ "$(git rev-parse "origin/$BRANCH")" != "$PREPARED" ]; then
            echo "::error::$BRANCH is not at the commit the preparation left. Changes to a release go to develop; release again"
            exit 1
          fi

          git checkout -B "$MAIN" "origin/$MAIN"
          git merge --no-ff "$PREPARED" -m "Merge branch '$BRANCH'"

          # Under the tag's name, as `git flow release finish` records it. The tag itself is made
          # in the next step
          git checkout -B develop origin/develop
          git merge --no-ff "$MAIN" -m "Merge tag '$VERSION' into develop"

          # All or nothing, so a rejected push cannot leave the main branch released and develop
          # behind
          git push --atomic origin "$MAIN" develop

          echo "main_sha=$(git rev-parse "$MAIN")" >> "$GITHUB_OUTPUT"
          echo "Merged into \`$MAIN\` at \`$(git rev-parse --short "$MAIN")\` and \`develop\` at \`$(git rev-parse --short develop)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ steps.merge.outputs.main_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$VERSION" -f message="$VERSION" -f object="$SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$tag_sha" > /dev/null
          GH_TOKEN="$GITHUB_TOKEN" gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
          echo "Tagged $VERSION and deleted \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Explain a failure
        if: failure()
        run: |
          echo "**Closing the release failed.** If \`$MAIN\` and \`develop\` were pushed but no tag was made, ask an org admin to finish it: only the release app can create the tag, and the caller's publish job has to run after it." >> "$GITHUB_STEP_SUMMARY"

  # A failed or cancelled release leaves nothing behind, so running it again starts clean from
  # develop - which is also where the fix for a failed preparation goes. Only after `start`
  # succeeded: that is when the branch is this run's own, not one that already existed
  clean-up:
    name: Delete the release branch
    needs: [ start, prepare, close ]
    if: always() && needs.start.result == 'success' && needs.close.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" > /dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
            echo "The release failed, so \`$BRANCH\` was deleted. Fix the cause and run the release again." >> "$GITHUB_STEP_SUMMARY"
          fi
