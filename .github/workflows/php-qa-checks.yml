name: PHP QA Checks

on:
  workflow_call:
    secrets:
      COMPOSER_ACCESS_TOKEN:
        description: 'Access token for cloning Uniques private repositories'
        required: true
      AUTOFIX_ACCESS_TOKEN:
        description: 'Access token the automatic code style fixes are pushed with. Supply one and the fix commit starts its own checks, so a fixable problem is fixed and reported green without anybody touching it. Without it the fixes are pushed with the run''s own `GITHUB_TOKEN` - which works, but needs `permissions: contents: write` on the calling job and leaves the run for the fix commit waiting on "Approve workflows to run"'
        required: false
    inputs:
      auto_fix:
        description: 'Whether to run PHP_CodeSniffer in fixing mode before the checks and commit what it fixed back to the pull request branch, so that a fixable problem does not become a check a developer has to act on'
        required: false
        default: true
        type: boolean
      setup_cmd:
        description: 'Command to run to set up environment before the QA checks execution'
        required: false
        default: ''
        type: string
      use_db:
        description: 'Whether a database is needed (for example for unit tests)'
        required: false
        default: false
        type: boolean
      mysql_version:
        description: 'Version of MySQL to set up'
        required: false
        default: "8.0"
        type: string
      mysql_config:
        description: 'MySQL config to apply (syntax similar to my.cnf)'
        required: false
        default: ""
        type: string
      db_dump_path:
        description: 'Path to the DB dump file - ignored if `use_db` is not set to `true`'
        required: false
        type: string
      db_migration_cmd:
        description: 'Migration cmd for the DB - will execute before running unit tests'
        required: false
        type: string
        default: ''
      env_variables:
        description: 'JSON string representing an object with environment variables to set up an environment'
        required: false
        default: '{}'
        type: string

jobs:
  matrix:
    name: Get CI job matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get QA matrix
        id: matrix
        uses: uniquesca/ci/qa-ci-matrix@main

  php-qa:
    name: Run PHP QA checks
    needs: [ matrix ]
    runs-on: ${{ matrix.setup.os }}
    env:
      phpunit: 0
      # Where each check's output is kept, and what gets uploaded as an artifact at the end.
      # An implementing agent cannot read job logs, and a check run on its own carries nothing
      # but `Process completed with exit code 1` - this is how it finds out what actually broke
      AI_REPORT_DIR: ${{ github.workspace }}/.ai-reports
    strategy:
      fail-fast: false
      matrix:
        setup: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.setup.php.version }}
          extensions: ${{ matrix.setup.php.extensions }}
          # Off here and turned on for the one step that needs it, further down. The matrix adds
          # `xdebug` to every leg, and in coverage mode it costs every line of PHP that runs under
          # it - Composer, PHP_CodeSniffer and Psalm all pay for a report only PHPUnit produces
          ini-values: xdebug.mode=off

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run setup cmd (if specified)
        run: ${{ inputs.setup_cmd }}

      - name: Prepare the report directory
        run: mkdir -p "$AI_REPORT_DIR"

      - name: Check if we have PHPUnit
        run: |
          if [[ -f "phpunit.xml" ]] || [[ -f "phpunit.xml.dist" ]]; then
            echo "phpunit=1" >> $GITHUB_ENV
          else
            echo "No PHPUnit configuration file found, skipping tests."
          fi

      - name: Prepare environment variables
        id: merge_environment_vars
        uses: uniquesca/ci/merge-environment-variables@main
        with:
          variables1: ${{ inputs.env_variables }}
          variables2: '{"db.dbname":"phpunit","db.username":"root","db.password":"root","db.host":"127.0.0.1","db.port":"3306"}'

      - name: Set up environment
        uses: uniquesca/ci/prepare-environment@main
        with:
          env_variables: ${{ steps.merge_environment_vars.outputs.variables }}

      - name: Prepare Composer cmd
        id: prep-composer-cmd
        run: |
          composer_cmd="composer install --no-scripts"
          lock_file="composer.lock"
          alt_lock_file="composer.${{ matrix.setup.php.version }}.lock"
          if [[ "${{ matrix.setup.locked }}" == "false"  ]]; then
            if [[ -f "$alt_lock_file" ]]; then
              # We have an alternative lock file, so we are just going to use it
              echo "Alternative Composer lock file $alt_lock_file found"
              lock_file="$alt_lock_file"
            else
              echo "Alternative Composer lock file $alt_lock_file not found, will run composer update"
              composer_cmd="composer update --no-scripts"
            fi
          fi
          echo "lock_file=$lock_file" >> $GITHUB_OUTPUT
          echo "cmd=$composer_cmd" >> $GITHUB_OUTPUT

      - name: Install dependencies
        uses: uniquesca/ci/install-packages@main
        with:
          composer_access_token: ${{ secrets.COMPOSER_ACCESS_TOKEN }}
          composer_cmd: ${{ steps.prep-composer-cmd.outputs.cmd }}
          composer_lock: ${{ steps.prep-composer-cmd.outputs.lock_file }}
          skip_npm_yarn: true

      # Before the tests rather than next to the code style check below, so that a failing test
      # cannot stop a fix that is ready from landing. What is left after this is what the check
      # reports - the problems no tool can fix.
      #
      # Every leg of the matrix does this, and they sort out between themselves which one lands its
      # fixes: the loser of a race starts over from what the winner pushed, runs the fixer again and
      # lands whatever its own PHP version fixes on top. A leg that still cannot land reverts, so its
      # check reports the branch as it really is - no leg is ever green on the strength of a fix that
      # is not on the branch
      #
      # `AUTOFIX_ACCESS_TOKEN` is what makes this fix and report green on its own: a `pull_request`
      # run that the run's own `GITHUB_TOKEN` triggered is held until somebody presses "Approve
      # workflows to run", so falling back to it fixes the code but still asks for a person. Without
      # the secret the calling job needs `contents: write` for even that much
      - name: Fix the code style
        if: ${{ inputs.auto_fix && hashFiles('phpcs.xml', 'phpcs.xml.dist') != '' }}
        uses: uniquesca/ci/cs-fix@main
        with:
          token: ${{ secrets.AUTOFIX_ACCESS_TOKEN }}
          report_dir: ${{ env.AI_REPORT_DIR }}
          # One attempt per leg of the matrix: that is how many jobs can be racing to land a fix,
          # and every one that wins costs the others the attempt they were mid-way through
          attempts: ${{ strategy.job-total }}

      - name: Set up MySQL
        if: inputs.use_db == true && env.phpunit == 1
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: ${{ inputs.mysql_version }}
          my-cnf: ${{ inputs.mysql_config }}
          root-password: 'root'
          auto-start: true

      - name: Start MySQL and create a database
        if: inputs.use_db == true && env.phpunit == 1
        run: mysql -uroot -proot -h127.0.0.1 -e 'CREATE DATABASE phpunit;'

      - name: Import database dump
        if: inputs.use_db == true && env.phpunit == 1
        uses: uniquesca/ci/mysql-import@main
        with:
          dump_file_path: ${{ inputs.db_dump_path }}
          db_name: 'phpunit'

      - name: Run DB migration
        if: inputs.use_db == true && env.phpunit == 1
        run: ${{ inputs.db_migration_cmd }}

      # Every check below tees its output to a file as well as the log. `set -o pipefail` is
      # there because a `run:` step that does not name its shell does not get it, and without
      # it `tee` would return success for a tool that failed - turning every red check green.
      - name: Run PHPUnit
        if: env.phpunit == 1
        # `XDEBUG_MODE` overrides the `xdebug.mode` the setup step left off, and only for this
        # step - so coverage is collected where it is wanted and nowhere else
        env:
          XDEBUG_MODE: coverage
        run: |
          set -o pipefail
          php ./vendor/bin/phpunit 2>&1 | tee "$AI_REPORT_DIR/phpunit.log"

      - name: Run PHP Codesniffer
        run: |
          set -o pipefail
          if [[ -f "phpcs.xml" ]] || [[ -f "phpcs.xml.dist" ]]; then
            ./vendor/bin/phpcs 2>&1 | tee "$AI_REPORT_DIR/phpcs.log"
          else
            echo "No PHP_Codesniffer configuration file found, skipping code check."
          fi

      - name: Run Psalm
        run: |
          set -o pipefail
          if [[ -f "psalm.xml" ]]; then
            ./vendor/bin/psalm 2>&1 | tee "$AI_REPORT_DIR/psalm.log"
          elif [[ -f "psalm.xml.dist" ]]; then
            ./vendor/bin/psalm --config=psalm.xml.dist 2>&1 | tee "$AI_REPORT_DIR/psalm.log"
          else
            echo "No Psalm configuration file found, skipping code check."
          fi

      # `always()`, because the only run anybody wants these from is the one that failed - and a
      # failed step skips everything after it by default. Short retention: this is written to be
      # read by the next implementing round, within minutes, not kept.
      #
      # The name carries the matrix leg because artifact names have to be unique within a run,
      # and because which PHP version went red is part of the answer.
      - name: Upload the check reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-report-php-${{ matrix.setup.php.version }}-${{ matrix.setup.os }}
          path: ${{ env.AI_REPORT_DIR }}
          retention-days: 1
          # `.ai-reports` is a dot-directory, and upload-artifact excludes hidden files by
          # default - without this the report is written and then silently dropped
          include-hidden-files: true
          if-no-files-found: ignore
