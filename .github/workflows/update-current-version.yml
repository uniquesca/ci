name: Update current version branch

on:
  push:
    branches:
      - main

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history, because a shallow clone has no merge base for the merge below
          fetch-depth: 0
          # The merge needs the file contents of the two tips and their merge base, and git
          # fetches those when it reaches them. What this skips is every other version of every
          # file in the history, which the merge never looks at
          filter: blob:none
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --local user.email "service@uniques.ca"
          git config --local user.name "CI"

      - name: Merge main into the current version branch
        env:
          VERSION_BRANCH: v11
        run: |
          git fetch origin "$VERSION_BRANCH:$VERSION_BRANCH"
          git checkout "$VERSION_BRANCH"
          git merge origin/main -m "CI: merge main into $VERSION_BRANCH [skip-ci]"
          git push origin "$VERSION_BRANCH"
