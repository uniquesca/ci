name: Update current version branch

on:
  push:
    branches:
      - main

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --local user.email "service@uniques.ca"
          git config --local user.name "CI"

      - name: Merge main into the current version branch
        env:
          VERSION_BRANCH: v9
        run: |
          git fetch origin "$VERSION_BRANCH:$VERSION_BRANCH"
          git checkout "$VERSION_BRANCH"
          git merge origin/main -m "CI: merge main into $VERSION_BRANCH [skip-ci]"
          git push origin "$VERSION_BRANCH"
