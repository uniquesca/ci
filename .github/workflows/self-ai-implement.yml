name: AI Implement

# Two events, and both are needed. `issue_comment` carries `/ai-do` on an issue, which starts
# the work, and `/ai-do` on the pull request, which runs another round of it.
# `pull_request_review` is what lets a review asking for changes start a round without anybody
# typing a command.
#
# The reusable workflow declares only `workflow_call`, so the events are the caller's to
# subscribe to. Leaving `pull_request_review` out is not an error - reviews simply never start
# anything, silently.
on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  implement:
    name: Run AI Implement agent
    uses: uniquesca/ci/.github/workflows/ai-implement.yml@main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
