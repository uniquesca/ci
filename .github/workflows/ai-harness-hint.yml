name: AI Harness Hint

on:
  workflow_call:
    inputs:
      anthropic_federation_rule_id:
        description: 'Identity federation rule the job authenticates against. The agent is called with a short-lived token minted from this run''s own Github OIDC identity, and the rule is what decides which repositories and branches are allowed to mint one. An identifier rather than a secret'
        required: true
        type: string
      anthropic_organization_id:
        description: 'Anthropic organization the federation rule belongs to. Found in the Claude Console under Settings, Organization'
        required: true
        type: string
      anthropic_service_account_id:
        description: 'Service account the minted token acts as. Usage and rate limits are attributed to it'
        required: true
        type: string
      anthropic_workspace_id:
        description: 'Workspace the minted token is scoped to. Only needed when the federation rule covers more than one workspace'
        required: false
        default: ''
        type: string
      qa_workflow:
        description: 'Name of the QA workflow, as it appears in its `name:`. Its first run on the pull request failing is one of the signs'
        required: true
        type: string
      ignore_job_patterns:
        description: 'Case-insensitive regular expression matching QA jobs whose failure does not count, for checks the harness could not have run either - ones needing secrets, external services or a deployed environment. Empty counts every failed job'
        required: false
        default: ''
        type: string
      copilot_login:
        description: 'Login the Copilot reviewer submits its reviews as, as the reviews API reports it'
        required: false
        default: 'copilot-pull-request-reviewer[bot]'
        type: string
      copilot_rounds:
        description: 'How many rounds of fixes after a Copilot review make a hint. A round is a Copilot review of a commit the pull request has since moved on from'
        required: false
        default: 2
        type: number
      branch_prefix:
        description: 'Prefix of the branches the implementing workflow pushes to. A pull request on one came from the harness already and gets no hint. Keep it the same as the implementing workflow branch_prefix'
        required: false
        default: 'ai-feature/'
        type: string
      skip_label:
        description: 'A pull request carrying this label gets no hint'
        required: false
        default: 'no-ai-hint'
        type: string
      docs_url:
        description: 'Where the hint sends somebody to get started with the harness'
        required: false
        # pin-ci-version: skip - a page for people to read, and main is the one kept current
        default: 'https://github.com/uniquesca/ci/blob/main/docs/ai.md'
        type: string
      shadow:
        description: 'Write the hint to the job summary instead of posting it. For tuning the inputs on real pull requests before anybody sees a comment'
        required: false
        default: true
        type: boolean
      max_reason_chars:
        description: 'Longest reason the agent may give. A longer one is cut at the last whole sentence that fits'
        required: false
        default: 300
        type: number
      model:
        description: 'Model that judges whether the change suited the harness'
        required: false
        default: 'claude-sonnet-5-5'
        type: string
      effort:
        description: 'How much reasoning the agent spends - `low`, `medium`, `high`, `xhigh` or `max`. Empty leaves the model on whatever the CLI defaults it to'
        required: false
        default: 'low'
        type: string
      max_turns:
        description: 'How many turns the agent may spend reading the change before it has to decide'
        required: false
        default: 15
        type: number
      max_diff_bytes:
        description: 'Longest diff to stage. A bigger change is truncated, and the agent is told so'
        required: false
        default: 100000
        type: number
      timeout_minutes:
        description: 'How long the whole job may run'
        required: false
        default: 15
        type: number

defaults:
  run:
    shell: bash

jobs:
  hint:
    name: Check whether the harness would have suited this
    # Once the pull request is merged, when every sign is on record. Two are looked for, each a
    # round trip the harness would have taken in its sandbox: QA going red on the first run, and
    # Copilot reviews answered by more pushes. A pull request closed without merging was not
    # worth the work, so it gets no hint, and one from a fork gets no `id-token` to mint the
    # agent's credential from.
    if: >-
      ${{ github.event_name == 'pull_request'
          && github.event.action == 'closed'
          && github.event.pull_request.merged
          && github.event.pull_request.head.repo.full_name == github.repository
          && !startsWith(github.event.pull_request.head.ref, inputs.branch_prefix) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      # Posting the hint. `gh pr comment` goes through GraphQL, which asks for the pull request
      # scope rather than the issue one
      pull-requests: write
      issues: write
      # The QA runs, to find the first and name the jobs that failed in it
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HINT_MARKER: '<!-- ai-harness-hint -->'
      # `Gather the evidence` sets this to false when there is nothing to hint, and every step
      # after it must test `env.PROCEED == 'true'` in its `if`.
      PROCEED: 'true'
    steps:
      - name: Gather the evidence
        id: evidence
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CREATED: ${{ github.event.pull_request.created_at }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          QA_WORKFLOW: ${{ inputs.qa_workflow }}
          IGNORE_JOBS: ${{ inputs.ignore_job_patterns }}
          COPILOT_LOGIN: ${{ inputs.copilot_login }}
          COPILOT_ROUNDS: ${{ inputs.copilot_rounds }}
          SKIP_LABEL: ${{ inputs.skip_label }}
        run: |
          stand_down() {
            echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"
            echo 'PROCEED=false' >> "$GITHUB_ENV"
            exit 0
          }

          [[ "$AUTHOR_TYPE" != 'Bot' ]] || stand_down "#$NUMBER was opened by a bot."
          pr=$(gh api "repos/$GH_REPO/pulls/$NUMBER")
          if [[ -n "$SKIP_LABEL" ]] && jq -e --arg l "$SKIP_LABEL" 'any(.labels[]; .name == $l)' <<<"$pr" >/dev/null; then
            stand_down "#$NUMBER carries $SKIP_LABEL."
          fi

          # Outside the workspace: the checkout below empties it on a fresh runner
          staged="$RUNNER_TEMP/ai-harness-hint"
          mkdir -p "$staged"
          evidence="$staged/evidence.md"
          : > "$evidence"

          # The first QA run once the pull request was ready for review, on its first attempt: red
          # checks on a draft are work in progress, and a re-run that went green does not undo the
          # round trip. Counting from then also leaves out runs of an older pull request that used
          # the same branch name. One opened as a draft first leaves draft with `ready_for_review`;
          # one opened ready was ready from the start, whatever happened later.
          ready=$CREATED
          read -r first_event first_at < <(gh api --paginate "repos/$GH_REPO/issues/$NUMBER/timeline?per_page=100" \
            --jq '.[] | select(.event == "ready_for_review" or .event == "convert_to_draft") | "\(.event) \(.created_at)"' | sed -n 1p) || true
          if [[ "${first_event:-}" == 'ready_for_review' ]]; then
            ready=$first_at
          fi
          workflow_id=$(gh api --paginate "repos/$GH_REPO/actions/workflows?per_page=100" \
            --jq ".workflows[] | select(.name == \"$QA_WORKFLOW\") | .id" | sed -n 1p)
          if [[ -z "$workflow_id" ]]; then
            echo "::warning title=No QA workflow::No workflow named \"$QA_WORKFLOW\" in $GH_REPO, so QA failures are not counted. Check the qa_workflow input."
          else
            first=$(gh api --paginate "repos/$GH_REPO/actions/workflows/$workflow_id/runs?branch=$HEAD_REF&event=pull_request&per_page=100" \
              --jq ".workflow_runs[] | select(.created_at >= \"$ready\") | .id" | sort -n | sed -n 1p)
            if [[ -n "$first" && $(gh api "repos/$GH_REPO/actions/runs/$first/attempts/1" --jq .conclusion) == 'failure' ]]; then
              failed=$(gh api --paginate "repos/$GH_REPO/actions/runs/$first/attempts/1/jobs?per_page=100" \
                --jq '.jobs[] | select(.conclusion == "failure") | .name')
              if [[ -n "$IGNORE_JOBS" ]]; then
                failed=$(grep -Eiv -- "$IGNORE_JOBS" <<<"$failed" || true)
              fi
              if [[ -n "$failed" ]]; then
                jobs=$(jq -Rr '"`\(.)`"' <<<"$failed" | paste -sd, -)
                jobs=${jobs//,/, }
                echo "- QA failed on its first run: $jobs. The harness runs the checks before it opens a pull request." >> "$evidence"
              fi
            fi
          fi

          # Each Copilot review records the commit it read, so one on a commit the pull request
          # moved on from was answered by a push - a round of fixes. Commit dates would not do: a
          # rebase or a local commit pushed later carries a time that says nothing about when it
          # reached the pull request.
          rounds=$(gh api --paginate "repos/$GH_REPO/pulls/$NUMBER/reviews?per_page=100" \
            --jq ".[] | select(.user.login == \"$COPILOT_LOGIN\" and .commit_id != \"$HEAD_SHA\") | .commit_id" | sort -u | wc -l)
          if (( rounds >= COPILOT_ROUNDS )); then
            echo "- Copilot review took $rounds rounds of fixes. The harness answers review feedback itself before a person is asked." >> "$evidence"
          fi

          [[ -s "$evidence" ]] || stand_down "#$NUMBER: nothing to hint ($rounds Copilot rounds)."

          {
            echo "number=$NUMBER"
            echo "head_sha=$HEAD_SHA"
            echo "author=$AUTHOR"
          } >> "$GITHUB_OUTPUT"
          jq '{title, body, author: .user.login, base: .base.ref, head: .head.ref,
               additions, deletions, changed_files}' <<<"$pr" > "$staged/pull-request.json"

      - name: Check out the pull request
        if: ${{ env.PROCEED == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.evidence.outputs.head_sha }}
          persist-credentials: false

      - name: Stage the diff
        id: diff
        if: ${{ env.PROCEED == 'true' }}
        env:
          NUMBER: ${{ steps.evidence.outputs.number }}
          MAX_BYTES: ${{ inputs.max_diff_bytes }}
        run: |
          mv "$RUNNER_TEMP/ai-harness-hint" .ai-harness-hint

          # Github refuses a diff past 300 files. The agent has the checkout and the file list, so
          # it still decides, from less.
          gh pr diff "$NUMBER" > .ai-harness-hint/full.patch || true
          head -c "$MAX_BYTES" .ai-harness-hint/full.patch > .ai-harness-hint/diff.patch
          if (( $(wc -c < .ai-harness-hint/full.patch) > MAX_BYTES )) || [[ ! -s .ai-harness-hint/full.patch ]]; then
            echo 'truncated=true' >> "$GITHUB_OUTPUT"
          fi
          rm .ai-harness-hint/full.patch
          gh pr diff "$NUMBER" --name-only > .ai-harness-hint/changed-files.txt || true

      - name: Read the style guide
        id: style
        if: ${{ env.PROCEED == 'true' }}
        uses: uniquesca/ci/ai-style-guide@v11

      - name: Judge the change
        id: agent
        if: ${{ env.PROCEED == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: ${{ inputs.anthropic_federation_rule_id }}
          anthropic_organization_id: ${{ inputs.anthropic_organization_id }}
          anthropic_service_account_id: ${{ inputs.anthropic_service_account_id }}
          anthropic_workspace_id: ${{ inputs.anthropic_workspace_id }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            A person opened pull request #${{ steps.evidence.outputs.number }} of this repository
            by hand, and it went back and forth before it was merged.

            Decide whether this change was a good fit for the AI harness instead. The harness
            takes a Github issue, writes a plan people approve, implements it, runs the QA checks
            and answers review feedback on its own.

            Read:

            - `.ai-harness-hint/evidence.md` - the back and forth above.
            - `.ai-harness-hint/pull-request.json` - title, description and size.
            - `.ai-harness-hint/diff.patch` - the change.
              ${{ steps.diff.outputs.truncated == 'true' && 'It was TRUNCATED: `.ai-harness-hint/changed-files.txt` and the checkout have the rest.' || '' }}

            A good fit: the goal could have been written down as an issue before any code
            existed, and a reviewer can tell from the result whether it was met. Following a
            pattern the repository already has is a strong sign. A change across many files or
            areas is a good fit too, because the plan shows its impact before anything is written.

            Not a fit: the right answer was an open design question; it touches authentication,
            payments, secrets or production data; it depends on something outside the repository,
            such as a vendor console or production debugging; or it is an urgent hotfix.

            Write `.ai-harness-hint/verdict.json` and nothing else:

            {"candidate": true or false, "reason": "..."}

            `reason` is one or two short sentences to the author about this change: what about it
            made it a fit or not. At most ${{ inputs.max_reason_chars }} characters. Use plain,
            everyday words a person new to the team would follow. No praise, no restating the
            evidence, no advice.

            ${{ steps.style.outputs.text }}
          claude_args: |
            --model ${{ inputs.model }}
            ${{ inputs.effort && format('--effort {0}', inputs.effort) || '' }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "Read,Grep,Glob,LS,Write"

      - name: Post the hint
        if: ${{ env.PROCEED == 'true' }}
        env:
          NUMBER: ${{ steps.evidence.outputs.number }}
          DOCS_URL: ${{ inputs.docs_url }}
          AUTHOR: ${{ steps.evidence.outputs.author }}
          MAX_CHARS: ${{ inputs.max_reason_chars }}
          SHADOW: ${{ inputs.shadow }}
        run: |
          verdict=.ai-harness-hint/verdict.json
          if ! jq -e '(.candidate | type == "boolean") and (.reason | type == "string")' "$verdict" >/dev/null 2>&1; then
            echo '::error title=No verdict::The agent did not write a valid .ai-harness-hint/verdict.json'
            exit 1
          fi
          reason=$(jq -r .reason "$verdict")
          # The comment is for a person to read in a few seconds, so the limit holds whatever the
          # agent wrote. Cut back to the last sentence that fits, or to the last word if none does.
          if (( ${#reason} > MAX_CHARS )); then
            cut=${reason:0:MAX_CHARS}
            if [[ "$cut" == *[.!?]\ * ]]; then
              reason=$(sed -E 's/^(.*[.!?]) .*$/\1/' <<<"$cut")
            else
              reason="${cut% *}…"
            fi
          fi

          if [[ $(jq -r .candidate "$verdict") != 'true' ]]; then
            echo "#$NUMBER is not a fit: $reason" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "$HINT_MARKER"
            echo "@$AUTHOR, this pull request looks like a good fit for the AI harness."
            echo
            cat .ai-harness-hint/evidence.md
            echo
            echo "$reason"
            echo
            echo "Next time, open an issue and comment \`/ai-plan\` on it. [How to start]($DOCS_URL)"
          } > .ai-harness-hint/comment.md

          if [[ "$SHADOW" == 'true' ]]; then
            { echo "Shadow mode, not posted to #$NUMBER:"; echo; cat .ai-harness-hint/comment.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr comment "$NUMBER" --body-file .ai-harness-hint/comment.md
          fi
