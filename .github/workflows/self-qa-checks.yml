name: QA Checks

on:
  push:
    branches:
      - 'develop'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - 'develop'

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The workflows and actions here reference each other at the active version branch. One left
      # at `@main` ships a caller that pulls the tip of the next version's code
      - name: Check the internal references are pinned
        run: |
          chmod +x bin/pin-ci-version.sh 
          bin/pin-ci-version.sh --check

      # Also runs shellcheck on every `run:` block - the runner image has it installed. What it
      # deliberately lets through is in .github/actionlint.yaml
      - name: Lint the workflows
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

      # Node 24 matches the runtime the actions in this repository declare in their action.yml
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      # No install step: node_modules is committed, the actions rely on it at runtime
      - name: Run tests
        run: npm test
