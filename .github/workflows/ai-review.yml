name: AI Review

on:
  workflow_call:
    secrets:
      AI_REVIEW_APP_ID:
        description: 'GitHub App id for the AI Review app. The review is submitted as this app, which is what makes it a different identity from the one that opened the pull request - and Github rejects a REQUEST_CHANGES review from the identity that opened it'
        required: true
      AI_REVIEW_PRIVATE_KEY:
        description: 'Private key for the AI Review GitHub App. Used only to mint a short-lived installation token for submitting the review; never passed to the agent'
        required: true
    inputs:
      anthropic_federation_rule_id:
        description: 'Identity federation rule the job authenticates against. The agent is called with a short-lived token minted from this run''s own Github OIDC identity, and the rule is what decides which repositories and branches are allowed to mint one. An identifier rather than a secret'
        required: true
        type: string
      anthropic_organization_id:
        description: 'Anthropic organization the federation rule belongs to. Found in the Claude Console under Settings, Organization'
        required: true
        type: string
      anthropic_service_account_id:
        description: 'Service account the minted token acts as. Usage and rate limits are attributed to it'
        required: true
        type: string
      anthropic_workspace_id:
        description: 'Workspace the minted token is scoped to. Only needed when the federation rule covers more than one workspace - a rule bound to a single workspace resolves it on its own, and naming it here is what an ambiguous rule fails for'
        required: false
        default: ''
        type: string
      command:
        description: 'Comment command that asks for a review, has to be at the very beginning of the comment on a pull request. This is how a pull request a person wrote is reviewed - nothing dispatches one for it'
        required: false
        default: '/ai-review'
        type: string
      allowed_permissions:
        description: 'Space-separated repository permission levels allowed to run the command. Github reports the maintain role as `write` and the triage role as `read`, so `admin write` covers owners, maintainers and developers'
        required: false
        default: 'admin write'
        type: string
      dispatch_type:
        description: 'The `repository_dispatch` event type this reacts to. The implementing workflow sends it as the last thing it does in a round, which is what starts a review - a `pull_request` trigger would fire on the push instead, before the round comment and the thread replies the reviewer has to read are in place'
        required: false
        default: 'ai-review'
        type: string
      branch_prefix:
        description: 'Prefix of the branches the implementing workflow pushes to. A dispatched review is only accepted for a branch carrying it, and the prefix is also what tells a pull request that workflow opened from one somebody wrote by hand - which decides whether the agent is told about the plan and the round it is part of. Keep it the same as the implementing workflow branch_prefix'
        required: false
        default: 'ai-feature/'
        type: string
      timeout_minutes:
        description: 'How long the whole job may run. Keep it a few minutes above agent_timeout_minutes'
        required: false
        default: 30
        type: number
      agent_timeout_minutes:
        description: 'How long the reviewing agent itself may run before it is given up on'
        required: false
        default: 25
        type: number
      max_turns:
        description: 'How many turns the agent may spend reading the code before it has to review with what it found. A ceiling to work under rather than one the agent is held to - the SDK enforces it exactly on a short run and lets a long one past it, so leave room above what a review here actually costs'
        required: false
        default: 40
        type: number
      model:
        description: 'Model used to review'
        required: false
        default: 'claude-opus-4-8'
        type: string
      max_comments:
        description: 'How many inline comments one review may carry'
        required: false
        default: 30
        type: number
      max_diff_bytes:
        description: 'Longest diff to stage. A change bigger than this is truncated, and the agent is told so - it has the repository on disk and can read the files themselves'
        required: false
        default: 400000
        type: number
      max_unattended_rounds:
        description: 'Only used to tell the agent how close the loop is to needing a person. The limit itself is enforced by the implementing workflow, so keep the two the same'
        required: false
        default: 5
        type: number
      ignore_check_patterns:
        description: 'Case-insensitive regular expression matching check runs to leave out of the context, default covers the AI workflows own check runs'
        required: false
        default: '(ai.implement|ai.plan|ai.review)'
        type: string
      debug:
        description: 'Log the raw agent transcript as JSON, on top of the readable summary that is always printed. Tool results contain whatever the agent read, so do not turn this on in a public repository'
        required: false
        default: false
        type: boolean

jobs:
  review:
    name: Review the pull request
    # Two ways in. The implementing workflow dispatches a review as the last thing it does in a
    # round, and a person asks for one by commenting the command on a pull request.
    #
    # Neither is a pull request event. `pull_request: opened` would fire on an implementing push
    # before the round comment and the thread replies the reviewer is meant to read are in place,
    # and on a pull request somebody wrote it would spend a review on every push - so a review is
    # something either the loop or a person asks for, never something a branch moving produces.
    #
    # A pre-filter and not the real test. `startsWith` here is case-insensitive, and neither branch
    # proves the pull request is open or that its head is in this repository. `Resolve the pull
    # request` below re-checks all of it against what the API says, and that check is the one that
    # decides.
    if: >-
      ${{ (github.event_name == 'repository_dispatch'
           && github.event.action == inputs.dispatch_type)
          || (github.event_name == 'issue_comment'
              && github.event.action == 'created'
              && github.event.issue.pull_request
              && startsWith(github.event.comment.body, inputs.command)) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # One review per pull request at a time. Queued rather than cancelled: a second push
    # deserves its own review, and cancelling would leave the loop with nothing to answer.
    #
    # The number comes from whichever event carried it - the dispatch payload, or the pull request
    # the command was typed on. The group has to name the same pull request either way, or a review
    # a person asked for runs alongside the dispatched one for the same branch.
    concurrency:
      group: ai-review-${{ github.repository }}-${{ github.event.client_payload.pull_request || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      # Read-only on the code. The reviewing agent has no shell and nothing here pushes, so
      # this is the boundary that actually holds - the same shape as the planner.
      contents: read
      # Submitting the review, and replying in the pull request conversation when it could
      # not be submitted
      pull-requests: write
      issues: write
      # Failing checks are context: a reviewer should not spend its comments on something CI
      # already said
      checks: read
      # What lets the job ask Github for the OIDC token the agent's credential is minted from.
      # A called workflow can only narrow the token it is given, so the caller has to grant this
      # too - without it there is nothing to exchange and the agent step fails before it reads
      # anything.
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # Same contract as the implementing workflow: `Resolve the pull request` can set this to
      # false, and **every step after it must test `env.PROCEED == 'true'` in its `if`**. A step
      # that forgets runs after the job has given up, against outputs that were never written -
      # which in ai-implement.yml meant `gh pr view ""` failing a job that had correctly decided
      # it had nothing to do.
      #
      # Cheaper to hold to here than there. `Resolve the pull request` is the one place PROCEED
      # is ever set, whichever event started the run, and everything below it is downstream of
      # that one place. The two steps above it answer the commenter and touch nothing else. The
      # three that deliberately do not test it are the two `always()` reporters at the end and
      # the step that tells somebody their command cannot run here - and that one fires precisely
      # *because* PROCEED is false.
      #
      # There is no job-level branch filter, because neither payload can answer the question
      # without an API call: `repository_dispatch` carries a pull request number and nothing else,
      # and `issue_comment` carries the conversation without the branch behind it.
      PROCEED: 'true'
      REVIEW_MARKER: '<!-- ai-review -->'
    steps:
      # Only for a typed command. A dispatch comes from the implementing workflow, which has run
      # its own gates before sending it, and the collaborators API has no answer for a bot in any
      # case. This is what keeps an Anthropic credential and the reviewing app's installation
      # token away from anybody who can merely comment on a pull request.
      #
      # A bot that typed the command is refused rather than looked up, and there is deliberately
      # no list of allowed bots here. The one bot with a reason to ask for a review is the
      # implementing workflow, which dispatches instead - and a bot able to type this could trade
      # rounds with that workflow with nothing bounding the two.
      - name: Check the commenter permissions
        id: permissions
        if: ${{ github.event_name == 'issue_comment' }}
        env:
          ALLOWED: ${{ inputs.allowed_permissions }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENTER_TYPE: ${{ github.event.comment.user.type }}
        run: |
          allowed='false'

          if [[ "$COMMENTER_TYPE" == 'Bot' ]]; then
            permission='bot'
          elif permission=$(gh api "repos/$GH_REPO/collaborators/$COMMENTER/permission" --jq '.permission' 2> error.log); then
            echo "@$COMMENTER has the '$permission' permission in $GH_REPO"
            for level in $ALLOWED; do
              if [[ "$permission" == "$level" ]]; then
                allowed='true'
                break
              fi
            done
          elif grep -q 'Not Found' error.log; then
            # Not a collaborator at all - expected, no permission to run the command
            permission='none'
          else
            # Anything other than a 404 is a real failure, do not silently treat it as a refusal
            cat error.log
            echo "::error title=Permission check failed::Could not read the permissions of @$COMMENTER"
            exit 1
          fi

          echo "permission=$permission" >> "$GITHUB_OUTPUT"
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

      # Refusals stop the job, so the steps below only ever run for an allowed commenter
      - name: Refuse the request
        if: >-
          ${{ github.event_name == 'issue_comment'
          && steps.permissions.outputs.allowed != 'true' }}
        env:
          COMMAND: ${{ inputs.command }}
          PERMISSION: ${{ steps.permissions.outputs.permission }}
          COMMENTER: ${{ github.event.comment.user.login }}
          PR: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$PR" --body "@$COMMENTER you are not allowed to run \`$COMMAND\` in this repository - your access level is \`$PERMISSION\`. Ask an owner, a maintainer or a developer to run it for you." \
            || echo "::warning title=Could not post the refusal::@$COMMENTER was refused, but nothing could be said on #$PR"

          echo "::error title=Permission denied::@$COMMENTER ($PERMISSION) is not allowed to run $COMMAND"
          exit 1

      # Which pull request, and whether this job may touch it at all. The number arrives either
      # in the dispatch payload - arbitrary JSON that anybody with `contents: write` could have
      # sent - or as the pull request a command was typed on. Neither is taken on trust: the
      # number is validated and the pull request itself is then read from the API.
      - name: Resolve the pull request
        id: pull_request
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_PR: ${{ github.event.client_payload.pull_request }}
          COMMENT_PR: ${{ github.event.issue.number }}
          PREFIX: ${{ inputs.branch_prefix }}
        run: |
          if [[ "$EVENT_NAME" == 'repository_dispatch' ]]; then
            trigger='dispatch'
            pr="$PAYLOAD_PR"
          else
            trigger='command'
            pr="$COMMENT_PR"
          fi

          if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
            echo "::error title=Bad event payload::'$pr' is not a pull request number"
            exit 1
          fi

          # `body` is whatever the author typed, and it is read back off this file with `jq`
          # below rather than through an expression - nothing anybody wrote is ever expanded
          # into this YAML.
          gh pr view "$pr" --json number,state,title,url,body,baseRefName,headRefName,headRefOid,headRepositoryOwner,headRepository \
            > "$RUNNER_TEMP/pull-request.json"

          state=$(jq -r '.state' "$RUNNER_TEMP/pull-request.json")
          head_ref=$(jq -r '.headRefName' "$RUNNER_TEMP/pull-request.json")
          head_repo="$(jq -r '.headRepositoryOwner.login' "$RUNNER_TEMP/pull-request.json")/$(jq -r '.headRepository.name' "$RUNNER_TEMP/pull-request.json")"

          # Whether the implementing workflow pushed this branch. Everything the agent is told
          # about plans and rounds turns on this rather than on which event started the run, so
          # a review a person asks for on a branch that workflow pushed is still part of its
          # loop, and one on a branch somebody wrote is judged on its own description.
          ai_authored='false'
          [[ "$head_ref" == "$PREFIX"* ]] && ai_authored='true'

          # The boundary that actually holds, and it holds for both events. Nothing here checks
          # out somebody else's code: this job holds an Anthropic credential and the AI Review
          # app's installation token, which reaches further than `GITHUB_TOKEN` does - and
          # `issue_comment` hands both to a run started from a fork's pull request.
          reason=''
          if [[ "$head_repo" != "$GH_REPO" ]]; then
            reason="its branch lives in \`$head_repo\` rather than in this repository"
          elif [[ "$state" != 'OPEN' ]]; then
            reason="it is $(echo "$state" | tr '[:upper:]' '[:lower:]')"
          elif [[ "$trigger" == 'dispatch' && "$ai_authored" != 'true' ]]; then
            # Only the loop is held to the branch prefix. A dispatch naming a branch the
            # implementing workflow never pushed did not come from a round whatever it claims,
            # while a review somebody asked for has the permission gate above in front of it.
            reason="its branch \`$head_ref\` was not created by the implementing workflow"
          fi

          if [[ -n "$reason" ]]; then
            echo "PROCEED=false" >> "$GITHUB_ENV"

            # Read by the step that answers a typed command, which is the only trigger this is
            # ever said out loud for
            {
              printf 'trigger=%s\n' "$trigger"
              printf 'number=%s\n' "$pr"
              printf 'stand_down=%s\n' "$reason"
            } >> "$GITHUB_OUTPUT"

            echo "Not reviewing #$pr: $reason"
            exit 0
          fi

          # The issue behind the change, which is where the plan lives. Optional: a pull request
          # somebody wrote may answer to no issue at all, and the review is then built from the
          # description instead.
          issue=''
          if [[ "$ai_authored" == 'true' ]]; then
            # The branch name carries the number, and that branch is the implementing workflow's
            # own construction rather than prose anybody can edit.
            candidate="${head_ref##*issue-}"
            if [[ "$candidate" =~ ^[0-9]+$ ]]; then
              issue="$candidate"
            elif [[ "$trigger" == 'dispatch' ]]; then
              # An invariant of the loop, so a round that has lost it fails loudly rather than
              # being reviewed against no plan. A command typed on such a branch is answered by
              # reviewing it as a pull request somebody wrote, which is the more useful of the two.
              echo "::error title=Cannot find the issue::Branch $head_ref carries no issue number"
              exit 1
            fi
          fi

          if [[ -z "$issue" ]]; then
            # A closing keyword in the description is how a pull request written by hand says
            # which issue it is for
            candidate=$(
              jq -r '.body // ""' "$RUNNER_TEMP/pull-request.json" \
                | grep -ioE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
                | head -n 1 | grep -oE '[0-9]+'
            ) || candidate=''

            # `#12` is a number and nothing more - it may name a pull request, or an issue of
            # some other repository. One lookup settles it, and anything that is not an issue
            # here leaves the review to work from the description.
            if [[ -n "$candidate" ]]; then
              kind=$(gh api "repos/$GH_REPO/issues/$candidate" \
                --jq 'if .pull_request then "a pull request" else "an issue" end' 2> /dev/null) || kind=''

              if [[ "$kind" == 'an issue' ]]; then
                issue="$candidate"
              else
                echo "#$candidate is ${kind:-not readable}, not an issue of this repository - reviewing without one"
              fi
            fi
          fi

          {
            printf 'number=%s\n' "$pr"
            printf 'trigger=%s\n' "$trigger"
            printf 'ai_authored=%s\n' "$ai_authored"
            printf 'issue=%s\n' "$issue"
            printf 'branch=%s\n' "$head_ref"
            printf 'base=%s\n' "$(jq -r '.baseRefName' "$RUNNER_TEMP/pull-request.json")"
            printf 'head_sha=%s\n' "$(jq -r '.headRefOid' "$RUNNER_TEMP/pull-request.json")"
            printf 'url=%s\n' "$(jq -r '.url' "$RUNNER_TEMP/pull-request.json")"
          } >> "$GITHUB_OUTPUT"

          echo "Reviewing #$pr on $head_ref${issue:+, for issue #$issue}"

      # The typed-command half of standing down. A dispatch that cannot be acted on says nothing
      # on the pull request - it came from a machine and the run log is where that is read - but
      # somebody who typed the command is waiting for an answer, and no review arriving is not one.
      #
      # Deliberately without the `PROCEED` test every other step carries: this step exists
      # because PROCEED is false.
      - name: Say the command cannot run here
        if: >-
          ${{ success()
          && steps.pull_request.outputs.trigger == 'command'
          && steps.pull_request.outputs.stand_down != '' }}
        env:
          PR: ${{ steps.pull_request.outputs.number }}
          REASON: ${{ steps.pull_request.outputs.stand_down }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMAND: ${{ inputs.command }}
        run: |
          gh issue comment "$PR" --body "@$COMMENTER I cannot run \`$COMMAND\` on #$PR - $REASON. A review checks out the branch, so it only runs on an open pull request whose branch lives in this repository." \
            || echo "::warning title=Could not say the command cannot run::Nothing was posted on #$PR"

      # Minted once and used only to submit the review. The reviewing agent writes review.json on
      # disk and never receives this token, so it cannot post, edit or request changes itself.
      - name: Create AI Review app token
        id: ai_review
        if: ${{ success() && env.PROCEED == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AI_REVIEW_APP_ID }}
          private-key: ${{ secrets.AI_REVIEW_PRIVATE_KEY }}

      # The branch itself, at full depth so the base branch is there to diff against
      - name: Check out the pull request branch
        if: ${{ success() && env.PROCEED == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pull_request.outputs.branch }}
          fetch-depth: 0
          # Nothing here pushes, and the agent can read the whole working tree - without this,
          # checkout leaves a live `x-access-token:ghs_...` in .git/config for it to find
          persist-credentials: false

      # The agent has no shell, so it cannot run `git diff` itself. Three dots rather than two:
      # what this branch changed since it left the base, not everything that has happened on
      # the base since.
      - name: Stage the diff
        id: diff
        if: ${{ success() && env.PROCEED == 'true' }}
        env:
          BASE: ${{ steps.pull_request.outputs.base }}
          MAX_DIFF_BYTES: ${{ inputs.max_diff_bytes }}
        run: |
          mkdir -p .ai-review

          git diff "origin/$BASE...HEAD" > "$RUNNER_TEMP/full.diff"
          git diff --stat "origin/$BASE...HEAD" > .ai-review/diffstat.txt
          git diff --name-only "origin/$BASE...HEAD" > .ai-review/changed-files.txt

          size=$(wc -c < "$RUNNER_TEMP/full.diff")
          truncated='false'

          if [[ "$size" -gt "$MAX_DIFF_BYTES" ]]; then
            # Truncated rather than dropped, and the agent is told - it has the files on disk
            # and can read whatever the diff stops short of
            head -c "$MAX_DIFF_BYTES" "$RUNNER_TEMP/full.diff" > .ai-review/diff.patch
            truncated='true'
            echo "::warning title=Diff truncated::The diff is $size bytes, staged the first $MAX_DIFF_BYTES"
          else
            cp "$RUNNER_TEMP/full.diff" .ai-review/diff.patch
          fi

          {
            printf 'truncated=%s\n' "$truncated"
            printf 'files=%s\n' "$(wc -l < .ai-review/changed-files.txt)"
          } >> "$GITHUB_OUTPUT"

          echo "Staged a $size byte diff over $(wc -l < .ai-review/changed-files.txt) file(s)"

      # A review that does not know what the change was meant to do is a style check. The plan
      # is the specification, and "this does not do what the plan says" is the most valuable
      # thing a reviewer can find.
      #
      # Only when there is an issue to read it from. A pull request somebody wrote may answer to
      # no issue, and its own title and description are then what the change is measured against
      # - `ai-stage-pull-request` below writes those out either way.
      - name: Stage the issue and its plan
        id: stage_issue
        if: >-
          ${{ success() && env.PROCEED == 'true'
          && steps.pull_request.outputs.issue != '' }}
        uses: uniquesca/ci/ai-stage-issue@main
        with:
          issue: ${{ steps.pull_request.outputs.issue }}
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # What has already been said on this pull request, and what CI already thinks. Answered
      # threads are kept here, unlike for the implementing agent: a thread where the previous
      # concern was addressed - or argued with - is exactly what this agent has to read before
      # deciding whether to raise it again.
      - name: Stage the review history
        id: stage_pr
        if: ${{ success() && env.PROCEED == 'true' }}
        uses: uniquesca/ci/ai-stage-pull-request@main
        with:
          pull_request: ${{ steps.pull_request.outputs.number }}
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          head_sha: ${{ steps.pull_request.outputs.head_sha }}
          include_answered_threads: true
          ignore_check_patterns: ${{ inputs.ignore_check_patterns }}

      - name: Review the change
        id: agent
        if: ${{ success() && env.PROCEED == 'true' }}
        timeout-minutes: ${{ inputs.agent_timeout_minutes }}
        # This step failing does not settle anything - `Judge the agent's own result` below
        # reads the transcript and decides what the failure meant. See the note there
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          # The action exchanges this job's Github OIDC token for a short-lived Anthropic one,
          # against the rule named here. Nothing static is passed in, and the credential it does
          # get expires on its own
          anthropic_federation_rule_id: ${{ inputs.anthropic_federation_rule_id }}
          anthropic_organization_id: ${{ inputs.anthropic_organization_id }}
          anthropic_service_account_id: ${{ inputs.anthropic_service_account_id }}
          anthropic_workspace_id: ${{ inputs.anthropic_workspace_id }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: ${{ inputs.debug }}
          # The action refuses to run for a bot actor unless the bot is listed here, and a
          # dispatched review is started by one: the implementing workflow sends the event with
          # `GITHUB_TOKEN`, so the actor is `github-actions[bot]`. Without this the agent quits
          # before it reads anything on every review the loop asks for. Comma-separated, and
          # unrelated to the `allowed_bots` input of the implementing workflow, which gates who
          # may trigger a round and is checked by that workflow itself
          allowed_bots: 'github-actions[bot],github-actions'
          prompt: |
            You are a senior engineer reviewing a colleague's pull request. Review
            #${{ steps.pull_request.outputs.number }} of this repository. You are reviewing it,
            not fixing it - ${{ steps.pull_request.outputs.ai_authored == 'true' && 'another agent does that, from what you write here.' || 'the person who wrote it does that, from what you write here.' }}

            Everything has been fetched for you. Read these first:

            - `.ai-review/diff.patch` - the change under review, against
              `${{ steps.pull_request.outputs.base }}`. This is what you are reviewing.
              ${{ steps.diff.outputs.truncated == 'true' && 'It was TRUNCATED because it is large, so it stops partway. Read the files themselves for the rest.' || '' }}
            - `.ai-review/diffstat.txt` and `.ai-review/changed-files.txt` - the shape of it.
            - `.ai-review/pull-request.json` - the title and description the author gave it.
              ${{ steps.stage_issue.outputs.has_plan == 'true' && 'Context around the plan below.' || '**This is the specification.** What the author says the change is for is what to measure it against, and a description that does not match the diff is itself worth saying.' }}
            - `.ai-plan/plan.md` - the approved plan the change was built from, when this pull
              request answers to an issue carrying one. If the file is not there, it does not,
              and nothing is missing. Where it is there it is the specification, and "this does
              not do what the plan says" is the most valuable finding you can produce. Its items
              are numbered `S1` for a step, `R1` for a risk, `U1` for an unknown or an
              assumption, `C1` for a check that proves the work is done and `QA1` for an
              acceptance criterion a tester verifies by hand, each naming the steps it covers.
              Those ids are what to check the diff against, and what to cite when something is
              missing. An older plan may not have them, in which case refer to its steps by
              their titles.
            - `.ai-plan/issue.json` - why the work was wanted in the first place, when there is
              an issue behind it.
            - `.ai-review/feedback.json` - what has already been said on this pull request, and
              what CI currently thinks. Each entry has a `source` (`thread` for an inline
              comment, `review`, `comment`, `check` for a failing check), an `anchor`, a
              `state`, and for a thread an `answered` flag.

            **The working tree is the branch.** Do not review the diff in isolation - open the
            files it touches and read around each hunk. A comment that misses the function
            three lines below the hunk is worse than no comment, and this is the single biggest
            difference between a useful review and a noisy one.

            ${{ steps.pull_request.outputs.ai_authored == 'true' && format('This is round {0}. After {1} rounds in a row without a person involved, the loop stops and asks for one. If you are near that and the same problem is still not fixed, say so plainly in your summary and stop trying to get it fixed by repetition.', steps.stage_pr.outputs.round, inputs.max_unattended_rounds) || 'A review of your own may already be on this pull request, and it is in the feedback below if so. If a problem you raised then is still not fixed, say so plainly in your summary - a person is reading this, and being told the change has not moved is more use to them than the same inline comment twice.' }}

            ${{ steps.pull_request.outputs.trigger == 'command' && 'Somebody asked for this review by commenting on the pull request, and their comment is in the feedback below. If it names something to look at, look at that first - it is the closest thing you have to being briefed.' || '' }}

            Before you raise anything, read `.ai-review/feedback.json` properly:

            - A thread with `answered: true` is one where
              ${{ steps.pull_request.outputs.ai_authored == 'true' && 'the implementing agent' || 'the author' }}
              has already replied. Read the reply. If it made the change, do not raise it
              again. If it gave a reasoned argument for not making it, either accept the
              argument or say in your summary that a person should settle it - **do not simply
              repeat the original comment**.
              ${{ steps.pull_request.outputs.ai_authored == 'true' && 'Two agents restating positions at each other is the failure mode this whole mechanism has to avoid.' || 'Restating a position the author has already answered is what makes a reviewer worth ignoring.' }}
            - An unanswered open thread is already raised. Do not duplicate it.
            - A failing `check` is already visible to whoever pushed the commit. Do not spend an
              inline comment restating what a linter said
              ${{ steps.pull_request.outputs.ai_authored == 'true' && '- it has already reached the implementing agent, which is working on it.' || '- though where the change cannot be right while a check is red, that belongs in your summary.' }}

            **You must be willing to find nothing.** A change that does what it set out to do
            and reads like the surrounding code should get the `comment` verdict and a short
            summary saying so. Do not manufacture a concern to justify the review, and do not
            request changes over a preference.
            ${{ steps.pull_request.outputs.ai_authored == 'true' && 'Every unnecessary round costs real money and moves nothing forward, and a reviewer that always finds something is worse than no reviewer at all because the loop never ends.' || 'A reviewer that always finds something is worse than no reviewer at all, because whoever reads it learns to stop.' }}

            Request changes only for things that genuinely should not merge as they are:

            - it does not do what the plan, the issue or its own description asked
            - a real bug, a broken edge case, a race, a resource leak
            - a security problem, or untrusted input reaching somewhere it should not
            - it breaks or bypasses an existing convention in this repository, in a way that
              will have to be undone later
            - it needs a test that is missing, where the rest of the repository tests that
              kind of thing

            Everything smaller is a `comment` verdict, or not worth saying.

            A missing `CHANGELOG.md` entry is never a finding. Every repository here generates
            that file from the git log when it releases, so nothing in a pull request should be
            editing it - and if something does, that is worth an inline comment the other way.

            Where the plan lists `QA` criteria, they are for a person to test by hand and you
            cannot run them. Not being able to verify one is not a finding, and it is not grounds
            for requesting changes. What is worth saying is that the code cannot satisfy one as
            written, or that nothing in the diff addresses the steps a criterion covers - both of
            those you can see. Where the change looks right but only a tester can settle it, say
            which criteria those are in your summary, so whoever picks it up knows where to start.

            Do the reading yourself, in this run. You have no helpers to delegate to and
            nothing is arriving later, so never end a turn saying you are waiting on anything -
            there is nothing to wait for, and a run that stops to wait writes no review at all.
            Where you could not settle something from the code, say so in the summary and move
            on.

            Write your review to `.ai-review/review.json` and nothing else. Do not modify any
            other file - your edits are discarded, this job cannot push, and time spent
            changing code is time not spent reviewing it. The file is:

            ```json
            {
              "verdict": "changes_requested",
              "summary": "markdown, for the top of the review",
              "comments": [
                {"path": "src/config.js", "line": 42, "body": "markdown, for this line"}
              ]
            }
            ```

            - `verdict` - `changes_requested` or `comment`. Nothing else. You cannot approve;
              merging is a person's decision. `comment` says nothing in the diff has to change, so
              anything you left inline under it reads as a note rather than a demand.
            - `summary` - what you looked at, what you concluded, and anything that does not
              belong on one line. If your verdict is `comment` because it is fine, say that in
              a sentence or two rather than padding it.
              ${{ steps.stage_issue.outputs.has_plan == 'true' && 'Cite the plan''s ids in brackets after what you are already saying - "the retry never backs off (S3)", "nothing here covers the migration (S6, QA2)". Never an id on its own: the plan lives on the issue, and whoever reads this review has your words and nothing else. `S3` alone tells them nothing, while the sentence with `S3` after it tells them everything and lets them go and find it. The same goes for an inline comment.' || '' }}
            - `comments` - inline comments. `line` is the line number **in the new file**, and
              it has to be a line the diff actually contains: an added line or a context line
              inside a hunk. A comment on any other line is dropped before the review is
              submitted, so check `.ai-review/diff.patch` for the number rather than guessing.
              At most ${{ inputs.max_comments }}. Each one says what is wrong and what to do
              instead - whoever acts on it has your words and the code, nothing else.

            Your final message is not published anywhere. Put everything you want said in
            `review.json`; the final message is only for the run log, so a sentence on what
            you concluded is plenty.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "Read,Grep,Glob,LS,TodoWrite,Write"
            ${{ inputs.debug && '--debug' || '' }}

      - name: Report on the run
        id: report
        if: ${{ always() && steps.agent.outcome != 'skipped' }}
        uses: uniquesca/ci/ai-run-report@main
        with:
          execution_file: ${{ steps.agent.outputs.execution_file }}
          verb: 'Reviewed'

      # A workaround for `claude-code-action`, which fails the agent step when a run used more
      # turns than `--max-turns` allowed even though the agent stopped of its own accord and
      # the review is finished.
      #
      # Two upstream problems stacked. `--max-turns` does not enforce anything on a long run:
      # the SDK stops a short run exactly on time and lets a long one straight past the limit
      # (anthropics/claude-code-action#1577). Their answer is a check that runs after the agent
      # has already stopped and reports the run as failed if the turns overran - so a finished
      # review arrives a few turns over and the step goes red for it. Nothing is saved by that:
      # the run is billed either way, and the whole point of a turn limit is to not spend the
      # money. All it does is throw away a `review.json` that was written and ready to submit,
      # because every step after the agent is skipped once one has failed - and this is the
      # step the loop turns on, so losing it stalls the round as well.
      #
      # So that step is allowed to fail without stopping the job, and this one works out what
      # its failure meant from the agent's own closing record. A review the agent finished is
      # submitted, with the overrun reported as a warning. Anything else fails here, which
      # takes `success()` false and skips the submission exactly as before - half a review is
      # worse than none, because the round after it acts on what the review says.
      #
      # `!cancelled()` rather than `always()`: this step decides whether the run is red, and a
      # job somebody cancelled is neither finished nor broken.
      - name: Judge the agent's own result
        id: verdict
        if: ${{ !cancelled() && steps.agent.outcome == 'failure' }}
        env:
          COMPLETED: ${{ steps.report.outputs.completed }}
          TURNS: ${{ steps.report.outputs.turns }}
          MAX_TURNS: ${{ inputs.max_turns }}
        run: |
          if [[ "$COMPLETED" != 'true' ]]; then
            echo "::error title=The reviewing agent did not finish::Its own closing record does not report a completed run - the step's log has what went wrong"
            exit 1
          fi

          echo "::warning title=The reviewing agent overran its turn limit::It finished on its own after ${TURNS:-more} turns, past the $MAX_TURNS it was given, and claude-code-action fails the step for that. The review is complete, so it was submitted anyway - raise max_turns if this keeps happening."

      # This is where the loop turns, on a branch the implementing workflow pushed. The app's
      # review creates a `pull_request_review` event, and that event is what starts the next
      # implementing round - which is why the review is submitted on an installation token and not
      # on this job's own. Github raises no event for a review made with `GITHUB_TOKEN`, so one
      # submitted that way would block a merge and start nothing.
      #
      # On a pull request somebody wrote it starts nothing either way, because the implementing
      # workflow only reacts to a review on a branch carrying its own prefix. What it does there
      # is what a review from a colleague does: block the merge until somebody deals with it.
      - name: Submit the review
        id: submit
        if: ${{ success() && env.PROCEED == 'true' }}
        uses: uniquesca/ci/ai-post-review@main
        with:
          pull_request: ${{ steps.pull_request.outputs.number }}
          repository: ${{ github.repository }}
          token: ${{ steps.ai_review.outputs.token }}
          head_sha: ${{ steps.pull_request.outputs.head_sha }}
          marker: ${{ env.REVIEW_MARKER }}
          max_comments: ${{ inputs.max_comments }}

      # Whatever happened to the review, what the agent concluded should be visible on the pull
      # request. On the happy path this is a short line under a review that speaks for itself;
      # when the review could not be submitted it carries the whole thing.
      - name: Say what came of it
        id: comment
        if: ${{ success() && env.PROCEED == 'true' }}
        env:
          PR: ${{ steps.pull_request.outputs.number }}
          SUBMITTED: ${{ steps.submit.outputs.submitted }}
          EVENT: ${{ steps.submit.outputs.event }}
          VERDICT: ${{ steps.submit.outputs.verdict }}
          POSTED: ${{ steps.submit.outputs.comments_posted }}
          DROPPED: ${{ steps.submit.outputs.comments_dropped }}
          ROUND: ${{ steps.stage_pr.outputs.round }}
          # Rounds are the implementing workflow's count of its own work, so they are only worth
          # naming on a branch it pushed. On a pull request somebody wrote there is one review
          # per time it was asked for and nothing to number them against
          AI_AUTHORED: ${{ steps.pull_request.outputs.ai_authored }}
          SUMMARY_FILE: ${{ steps.report.outputs.result_file }}
          USAGE: ${{ steps.report.outputs.summary }}
        run: |
          if [[ "$AI_AUTHORED" == 'true' ]]; then
            what="round $ROUND"
          else
            what="#$PR"
          fi

          if [[ "$SUBMITTED" == 'true' ]]; then
            # `REQUEST_CHANGES` and `COMMENT` are how Github names what was submitted, and
            # `COMMENT` reads like the review reached no conclusion. Say the verdict instead -
            # and the verdict rather than the event, because a changes-requested review Github
            # would only take as a comment still requests changes, which is what the paragraph
            # below is about.
            if [[ "$VERDICT" == 'changes_requested' ]]; then
              outcome='changes are requested'
            else
              outcome='no changes needed'
            fi
            {
              printf 'Reviewed %s' "$what"
              [[ "$POSTED" != '0' ]] && printf ' with %s inline comment(s)' "$POSTED"
              printf ' - %s.' "$outcome"
              [[ "$DROPPED" != '0' ]] && printf ' %s comment(s) could not be placed on a line the diff contains; see the run log.' "$DROPPED"
              if [[ "$VERDICT" == 'changes_requested' && "$EVENT" != 'REQUEST_CHANGES' ]]; then
                printf '\n\n**Github would not take this as a changes-requested review.** It does not allow one from the identity that opened this pull request, so this landed as a comment and it does not block merging.'
                if [[ "$AI_AUTHORED" == 'true' ]]; then
                  printf ' It will not start another round on its own either - run `/ai-do` here to act on it, and check that the reviewing app is a different app from the implementing one.'
                else
                  printf ' Check that the reviewing app is a different app from the one that opened this pull request.'
                fi
              fi
              [[ -n "$USAGE" ]] && printf '\n\n%s.' "$USAGE"
              printf '\n'
            } > "$RUNNER_TEMP/outcome.md"
          else
            # The review itself never reached Github, so the whole thing goes in a comment
            # rather than being lost with the run
            {
              printf 'The review could not be submitted, so here it is as a comment.\n\n'
              if [[ -n "$SUMMARY_FILE" && -f "$SUMMARY_FILE" ]]; then
                cat "$SUMMARY_FILE"
              else
                printf 'The reviewing agent produced nothing. The run log has what it did.\n'
              fi
              printf '\n\n'
              printf -- '---\n\n'
              [[ "$AI_AUTHORED" == 'true' ]] && printf 'Round %s.' "$ROUND"
              [[ -n "$USAGE" ]] && printf ' %s.' "$USAGE"
              printf '\n'
            } > "$RUNNER_TEMP/outcome.md"
          fi

          cat "$RUNNER_TEMP/outcome.md" >> "$GITHUB_STEP_SUMMARY"
          gh issue comment "$PR" --body-file "$RUNNER_TEMP/outcome.md"

      # A failed review is otherwise invisible from the pull request, and it is the step that
      # would have started the next round - so silence here stalls the whole loop.
      #
      # `verdict` and not `agent`: the agent step goes red for an overrun that cost the review
      # nothing, and a review that was submitted must not also be reported as unfinished.
      - name: Report a failed review
        if: >-
          ${{ always() && env.PROCEED == 'true'
          && (steps.diff.outcome == 'failure'
          || steps.stage_issue.outcome == 'failure'
          || steps.stage_pr.outcome == 'failure'
          || steps.verdict.outcome == 'failure'
          || steps.report.outcome == 'failure'
          || steps.submit.outcome == 'failure'
          || steps.comment.outcome == 'failure') }}
        env:
          PR: ${{ steps.pull_request.outputs.number }}
          REASON: ${{ steps.report.outputs.reason }}
          AI_AUTHORED: ${{ steps.pull_request.outputs.ai_authored }}
          COMMAND: ${{ inputs.command }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            if [[ "$AI_AUTHORED" == 'true' ]]; then
              printf 'The reviewing agent did not finish, so this round has not been reviewed.\n\n'
            else
              printf 'The reviewing agent did not finish, so this pull request has not been reviewed.\n\n'
            fi

            if [[ -n "$REASON" ]]; then
              printf 'It stopped with: `%s`\n\n' "$REASON"
            fi

            printf 'Nothing is waiting on it - review it yourself'
            if [[ "$AI_AUTHORED" == 'true' ]]; then
              printf ', or comment `/ai-do` to run another implementing round'
            else
              printf ', or comment `%s` to try again' "$COMMAND"
            fi
            printf '. The run log has the detail: %s\n' "$RUN_URL"
          } > "$RUNNER_TEMP/failure.md"

          cat "$RUNNER_TEMP/failure.md" >> "$GITHUB_STEP_SUMMARY"
          gh issue comment "$PR" --body-file "$RUNNER_TEMP/failure.md"
