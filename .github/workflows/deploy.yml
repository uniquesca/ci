name: Deploy

on:
  workflow_call:
    secrets:
      SSH_KEY:
        description: 'SSH private key to use to connect to the host'
        required: true
      UNIQUES_GITHUB_ACCESS_TOKEN:
        description: 'Access token for cloning Uniques private repositories from GitHub'
        required: true
      NODE_AUTH_TOKEN:
        description: 'Access token for authentication with the NPM registry'
        required: false
    inputs:
      host:
        description: 'Address of the server'
        required: true
        type: string
      username:
        description: 'SSH login'
        required: true
        type: string
      port:
        description: 'SSH password'
        required: false
        default: '22'
        type: string
      deployment_path:
        description: 'Working directory of the project on the server'
        required: true
        type: string
      ref:
        description: 'Git branch or tag to use for the project on the server'
        required: true
        type: string
      db_migration_cmd:
        description: 'DB migration command to execute after git update is complete'
        required: false
        default: ''
        type: string
      clean_cache_cmd:
        description: 'Command for clearing cache to execute after git update is complete'
        required: false
        default: ''
        type: string
      pre_cmd:
        description: 'Command to execute on the REMOTE after pulling latest code and before everything else'
        required: false
        default: ''
        type: string
      post_cmd:
        description: 'Command to execute after deployment is complete'
        required: false
        default: ''
        type: string
      node_version:
        description: 'Node version to use when deploying'
        required: false
        default: '24'
        type: string
      timeout:
        description: 'Timeout for the deployment'
        required: false
        type: string
        default: '5m'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Connect and deploy
        # v1 rather than the v0.1.8 this used to pin: the exit code of the remote script is what
        # decides this step, and that pin predates the plugin's exit-code handling being reworked.
        # `script_stop` went with it - the script sets `-e` itself, which is what replaced it
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ inputs.host }}
          username: ${{ inputs.username }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ inputs.port }}
          timeout: ${{ inputs.timeout }}
          command_timeout: ${{ inputs.timeout }}
          script: |
            # Making it more strict for the script to fail in case of an error.
            # `pipefail` because without it only the last command of a pipeline is allowed to fail
            # the script, and the failure of anything upstream of a `|` is discarded - `curl ... |
            # bash` installing nvm reported success on a download that never happened
            set -euxo pipefail;

            # Where this script records its verdict for the verification step below. The run and
            # attempt number make it this deployment's alone, so no previous run's file can be
            # mistaken for this one's
            DEPLOYMENT_STATUS_FILE="/tmp/ci-deployment-${{ github.run_id }}-${{ github.run_attempt }}.status"

            # Whatever stops this script names itself, writes that down and carries its status out,
            # so a failure ten commands deep is not reported as "the last thing I ran was fine"
            trap 'status=$?; set +x; echo "❌ Deployment failed at line $LINENO: $BASH_COMMAND (exit $status)"; echo "failed at line $LINENO: $BASH_COMMAND (exit $status)" > "$DEPLOYMENT_STATUS_FILE"; exit $status' ERR

            echo "Changing work dir"
            cd ${{ inputs.deployment_path }}

            echo "Cleaning git"
            git clean -fd
            
            echo "Pruning git"
            git remote prune origin
            
            echo "Retrieving the latest updates"
            git fetch

            # This part is commented because it doesn't work well - if there are any changes done, 
            # or some commits are ahead autodeployment will fail
            # if git show-ref -q --verify "refs/heads/${{ inputs.ref }}" 2>/dev/null; then
            #   echo "Branch detected, switching and pulling"
            #   git checkout ${{ inputs.ref }}
            #   git pull
            # else
            #   echo "Non-branch detected, performing get reset"
            
            echo "Checking if it's a pull request"
            ref="${{ inputs.ref }}"
            if [[ ${{ inputs.ref }} =~ ^refs/pull/[0-9]+/merge$ ]]; then
              echo "Pull request detected"
              # Handling pull requests
              echo "Performing hard reset"
              git reset --hard
              echo "Switching to PR branch with detached HEAD"
              git fetch -u origin pull/${{ github.event.pull_request.number }}/head && git checkout FETCH_HEAD
            else
              echo "Pull request not detected"
              echo "Checking if remote branch exists"
              # This is just regular branch
              branch_exists="$(git ls-remote --heads origin "$ref" | wc -l)"

              # `[[ branch_exists > 0 ]]` - without the `$` and with `>` comparing strings - was
              # always true, so a tag or a sha took the branch path and reset to `origin/<tag>`
              if [[ "$branch_exists" -gt 0 ]]; then
                echo "Remote branch ${{ inputs.ref }} exists, performing hard reset to it"
                git reset --hard origin/${{ inputs.ref }}
              else
                echo "Remote branch ${{ inputs.ref }} not found, performing hard reset"
                git reset --hard ${{ inputs.ref }}
              fi
            fi
            
            echo "Executing pre-deployment command"
            ${{ inputs.pre_cmd }}
            
            rm -f auth.json
            if [ -f "composer.json" ]; then
              echo "Installing composer dependencies"
              if [ ! -f "composer.phar" ]; then
                echo "Installing Composer"
                php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
                php composer-setup.php
                php -r "unlink('composer-setup.php');"
              fi
              echo "Installing Composer dependencies"
              chmod +x composer.phar
              php composer.phar config --auth github-oauth.github.com ${{ secrets.UNIQUES_GITHUB_ACCESS_TOKEN }}
              php composer.phar install --no-dev
            fi
            rm -f auth.json
            
            rm -f .npmrc
            if [ -f "package.json" ]; then
              echo "Preparing .npmrc file"
              echo "@uniquesca:registry=https://npm.pkg.github.com/" > .npmrc
              echo "//npm.pkg.github.com/:_authToken=${{ secrets.NODE_AUTH_TOKEN }}" >> .npmrc
              echo "always-auth=true" >> .npmrc
            
              export NVM_DIR="$([ -z "${XDG_CONFIG_HOME-}" ] && printf %s "${HOME}/.nvm" || printf %s "${XDG_CONFIG_HOME}/nvm")"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" # This loads nvm
              if ! command -v nvm &> /dev/null; then
                echo "Installing NVM"
                curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
                export NVM_DIR="$([ -z "${XDG_CONFIG_HOME-}" ] && printf %s "${HOME}/.nvm" || printf %s "${XDG_CONFIG_HOME}/nvm")"
                [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" # This loads nvm
                echo "  Using node v${{ inputs.node_version }}"
                nvm install ${{ inputs.node_version }}
              fi

              nvm use ${{ inputs.node_version }}
              if ! command -v yarn &> /dev/null; then
                echo "Installing Yarn"
                (r=2;while ! npm install -g yarn ; do ((--r))||exit;sleep 5;done)
              fi

              echo "Installing NPM/Yarn dependencies"
              # Commands below run yarn in a way it doesn't emit non-zero exit code, so we don't stop,
              # yet we capture stderr, so we can check it
              output=$(yarn install 2>&1 || true)
              echo "$output"
              # Check for "401 Unauthorized" in stderr - this is a workaround for the intermittent bug 
              # with yarn authentication
              if echo "$output" | grep -q "401 Unauthorized"; then
                echo "Could not install yarn dependencies, retrying..."
                echo "@uniquesca:registry=https://npm.pkg.github.com/" > .npmrc
                echo "//npm.pkg.github.com/:_authToken=${{ secrets.NODE_AUTH_TOKEN }}" >> .npmrc
                echo "always-auth=true" >> .npmrc
                rm yarn.lock
                npm cache clean --force
                yarn cache clean 
                echo "Deleted yarn.lock, running yarn install again..."
                yarn install
              fi
            fi
            rm -f .npmrc

            if [ -f "vendor/bin/phinx" ]; then
              echo "Executing Phinx migrations"
              if [ -f "phinx.php" ]; then
                chmod +x ./vendor/bin/phinx
                chmod +x ./vendor/robmorgan/phinx/bin/phinx
                ./vendor/bin/phinx migrate -c phinx.php
              fi
            fi
            
            echo "Executing DB migration command"
            ${{ inputs.db_migration_cmd }}
            
            echo "Executing cache cleaning command"
            ${{ inputs.clean_cache_cmd }}
            
            echo "Executing post-deployment command"
            ${{ inputs.post_cmd }}

            # Reached only if every command above succeeded - this is what the step below looks for
            echo "complete" > "$DEPLOYMENT_STATUS_FILE"

      # A deployment is called successful on two conditions, not one: the step above did not fail,
      # AND the script itself says it reached its last line. The second is what makes the verdict
      # independent of an exit code surviving the trip back through the remote shell, the SSH
      # session and the action - if the script stopped early it wrote why, and if it never got to
      # write anything at all the file is missing. Either way this step fails, whatever the step
      # above concluded. It catches a dropped session and a killed shell for the same reason
      - name: Verify the deployment ran to completion
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ inputs.host }}
          username: ${{ inputs.username }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ inputs.port }}
          command_timeout: 1m
          script: |
            set -eu

            status_file="/tmp/ci-deployment-${{ github.run_id }}-${{ github.run_attempt }}.status"

            if [ ! -f "$status_file" ]; then
              echo "❌ The deployment left no status behind - it did not reach its last line, so the server is in an unknown state. The deployment output above ends where it stopped"
              exit 1
            fi

            status="$(cat "$status_file")"
            rm -f "$status_file"

            if [ "$status" != "complete" ]; then
              echo "❌ The deployment reported: $status"
              exit 1
            fi

            echo "✅ The deployment script ran to completion"
