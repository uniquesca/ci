name: Prepare the workspace for an AI agent

description: Brings the application up and installs its dependencies so an AI agent can run this project's checks on its own work, and says which commands it can run.

inputs:
  spin_up_docker:
    description: 'Bring the application up in Docker when the repository has a `task.sh` or a compose file'
    required: false
    default: 'true'
  docker_profile:
    description: 'Docker Compose profile to bring up'
    required: false
    default: ''
  node_working_directory:
    description: 'Directory holding the `package.json` to install from'
    required: false
    default: '.'
  node_version:
    description: 'Node version to install under, on the runner'
    required: false
    default: '20'
  env_variables:
    description: 'JSON object of configuration tokens the config templates are rendered with. The agent can read them'
    required: false
    default: '{}'
  github_token:
    description: 'Token to pull images from ghcr.io with. Needs `packages: read`'
    required: false
    default: ${{ github.token }}
  composer_access_token:
    description: 'Token for the Uniques private Composer registry'
    required: false
    default: ''
  npm_access_token:
    description: 'Token for the Uniques private NPM registry'
    required: false
    default: ''

outputs:
  instructions:
    description: 'Text for the agent prompt: what is installed, whether the application is up, and the commands CI checks its work with'
    value: ${{ steps.instructions.outputs.text }}
  docker:
    description: 'Outcome of bringing the application up: `success`, `failure`, or empty when it was not tried'
    value: ${{ steps.docker_up.outcome }}

runs:
  using: composite
  steps:
    # The application first, and the toolchain below it: `./task.sh composer install` needs
    # something to exec into.
    #
    # Detection rather than configuration: what the repository has is what decides. Two
    # independent things are being looked for, and a repository can have either, both or neither.
    - name: Work out how this application is set up
      id: setup
      env:
        SPIN_UP: ${{ inputs.spin_up_docker }}
      shell: bash
      run: |
        environment='false'
        if [[ -f '_ci_environment.json' ]]; then
          environment='true'
          echo "_ci_environment.json is here, so bringing the application up renders this repository's config templates"
        fi

        # `task.sh` first, because that is what this organisation's repositories drive compose
        # with and `docker-spin-up` prefers it. The compose file names are the ones Docker itself
        # looks for, so a repository using any of them is one `docker compose up` can start.
        docker='false'
        for candidate in task.sh docker-compose.yml docker-compose.yaml compose.yml compose.yaml; do
          if [[ -f "$candidate" ]]; then
            docker='true'
            echo "$candidate is here, so this repository has an application that can be brought up"
            break
          fi
        done

        # Said out loud rather than passed over in silence. A repository that has a container and
        # does not get one is the case where the agent's checks quietly become the artifact loop
        # again, and the reason for it is a workflow input somebody set months ago.
        if [[ "$docker" == 'true' && "$SPIN_UP" != 'true' ]]; then
          echo "spin_up_docker is off, so it is left down and the agent works without it"
        fi

        {
          printf 'environment=%s\n' "$environment"
          printf 'docker=%s\n' "$docker"
        } >> "$GITHUB_OUTPUT"

    # A rendered config file holds the credentials it was rendered from, and the agent's commit takes
    # its working tree with `git add -A`. Without this, the first run on a repository whose
    # config is generated pushes that config to a branch and opens a pull request showing it.
    #
    # In front of the spin-up, which is what renders them - `.git/info/exclude` is read when
    # `git add` runs rather than when it is written, but the ordering is what makes that obvious.
    #
    # The same mechanism and the same limitation as `Keep the install out of the commit`:
    # `.git/info/exclude` only hides what git is not already tracking. A repository that commits
    # a rendered config cannot be helped this way, so it is named in a warning instead - there is
    # no safe thing to do with it here, and quietly reverting the file would leave the
    # application running against a configuration the working tree does not have.
    - name: Keep the rendered configuration out of the commit
      if: >-
        ${{ steps.setup.outputs.environment == 'true'
        && steps.setup.outputs.docker == 'true' && inputs.spin_up_docker == 'true' }}
      shell: bash
      run: |
        tracked=()
        excluded=0

        # `.configs[]?` rather than `.configs[]`, so a file declaring only `token_fallbacks` is
        # not an error. `while read` and not a `for`, because a path may legitimately have a
        # space in it.
        while IFS= read -r path; do
          [[ -z "$path" ]] && continue

          # `.git/info/exclude` patterns are matched from the repository root when they start
          # with a slash, and a path out of this file may or may not be written `./like/this`
          path="${path#./}"

          if git ls-files --error-unmatch -- "$path" > /dev/null 2>&1; then
            tracked+=("$path")
            continue
          fi

          printf '/%s\n' "$path" >> .git/info/exclude
          excluded=$((excluded + 1))
        done < <(jq -r '.configs[]?.path // empty' _ci_environment.json)

        echo "$excluded rendered config file(s) will be kept out of the agent's commit"

        if [[ ${#tracked[@]} -gt 0 ]]; then
          echo "::warning title=This repository commits a file it renders::${tracked[*]} - rendering writes the configuration this run was given into ${#tracked[@]} file(s) git already tracks, so they will be part of the agent's commit and whatever they hold will be in the pull request. Add them to .gitignore, or do not give this workflow credentials you would mind seeing there"
        fi

    # The application itself. This renders the configs, runs `_ci_environment.json`'s
    # `init_script`, starts the containers as the runner's own user and waits for MySQL if
    # `task.sh` can be asked about it - see the action.
    #
    # `ghcr.io` and nothing else, because that is where this organisation's images are built and
    # pushed - a repository pulling from anywhere else is pulling something public, and a
    # registry nobody logs into still serves those.
    #
    # The run's own token by default, so there is no secret to configure. The calling job needs
    # `packages: read`, and an image first pushed with a personal access token has to grant this
    # repository the Read role (Package settings, Manage Actions access).
    #
    # Its own step rather than `docker-spin-up`'s registry inputs: this is one fixed registry
    # authenticated one fixed way, and passing it through three inputs said the same thing at
    # more length. Allowed to fail for the same reason as the spin-up below - a login that does
    # not work is a run without a container, not a run that cannot happen.
    - name: Log in to the container registry
      if: >-
        ${{ steps.setup.outputs.docker == 'true' && inputs.spin_up_docker == 'true' }}
      continue-on-error: true
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    # This is what makes a repository whose checks live inside its container checkable at all.
    # Until it, `./task.sh cs-check` had nothing to exec into, and the agent's only account of
    # what CI would say was an artifact from an hour earlier.
    #
    # `|| '{}'` because a secret nobody configured is an empty string, and passing one explicitly
    # overrides the action's own `{}` default rather than falling back to it - an empty object is
    # `{}`, not ``.
    - name: Spin the application up in Docker
      id: docker_up
      if: >-
        ${{ steps.setup.outputs.docker == 'true' && inputs.spin_up_docker == 'true' }}
      continue-on-error: true
      uses: uniquesca/ci/docker-spin-up@v11
      with:
        env_variables: ${{ inputs.env_variables || '{}' }}
        profile: ${{ inputs.docker_profile }}

    # The spin-up is allowed to fail, so somewhere has to say that it did. A warning and not an
    # error: the run goes on, and what it lost is a way for the agent to check itself rather
    # than the work.
    #
    # `success()` still holds when it failed - that is what `continue-on-error` does to a step's
    # conclusion - so this reads its outcome rather than the job's state.
    - name: Say the application could not be brought up
      if: >-
        ${{ steps.docker_up.outcome == 'failure' }}
      shell: bash
      run: |
        echo "::warning title=The application could not be brought up::Docker did not come up, so the agent has no container to run this project's checks in and is back to the artifact reports for what CI says. The step's log has why - an unresolvable token in a config template, an image on ghcr.io this repository has not been granted access to, and a compose file the branch itself broke, are the three to look at first"

    # Which checks the agent can run on itself before it pushes, and whether anything has to
    # be installed for it to. A red linter found here costs the agent a few turns; found after
    # the push it costs a whole round - a second agent run, on a fresh context, working from an
    # artifact instead of from the tool.
    #
    # **Detection is deliberately the same tests php-qa-checks makes** - a config file's
    # presence, and for Psalm which of the two names it has. The two have to agree: an agent
    # that checks a different set than CI reports itself clean and then goes red on the push,
    # which is worse than not checking at all, because the round that would have caught it has
    # already been spent.
    #
    # Where the install runs is the other half of the answer, and the container decides it: a
    # `vendor/` resolved against the runner's PHP is not the one the image would have. The
    # compose files bind-mount the working tree, so either route lands on the disk the agent
    # reads from.
    #
    # The two ecosystems are answered independently, and route independently - a PHP application
    # with an Angular front end is both, and `task.sh` carries the tasks it carries.
    - name: Work out what the agent can check its work with
      id: verify
      env:
        DOCKER_UP: ${{ steps.docker_up.outcome }}
      shell: bash
      run: |
        # `task.sh`'s own answer about itself, so a repository that has renamed or dropped a
        # task is never handed one it cannot run. Nothing is up, nothing is supported, and
        # everything below falls back to the runner.
        supports() {
          [[ -f 'task.sh' && "$DOCKER_UP" == 'success' ]] || return 1
          ./task.sh supports "$1" > /dev/null 2>&1
        }

        # Handed to the agent verbatim by the step below, so that what it runs and what CI runs
        # cannot drift apart in a prompt somebody edited later.
        #
        # One list across both ecosystems, in the order the agent should work through it: the
        # fixer before the checker, for the same reason php-qa-checks runs it first - what a
        # tool can fix should never reach a reviewer, and what is left after it is what the
        # check will actually report.
        commands=()

        php='false'
        php_runner='false'
        composer_cmd='composer install --no-scripts'
        if [[ -f 'composer.json' ]]; then
          if supports composer; then
            # No linter configuration is consulted here: the container's tasks and the
            # application itself both run out of `vendor/`, recognised config or not.
            php='true'
            composer_cmd='./task.sh composer install --no-scripts'
            echo "Composer dependencies are installed in the container: $composer_cmd"
          else
            # On the runner, `vendor/` is installed only where there is something in it to run.
            # A repository with a `composer.json` and no linter configuration is left alone: the
            # install would cost the round a minute and buy the agent nothing it is told about.
            php_commands=()
            if [[ -f 'phpcs.xml' || -f 'phpcs.xml.dist' ]]; then
              php_commands+=('./vendor/bin/phpcbf' './vendor/bin/phpcs')
            fi

            # `--config` for the `.dist` name only. Psalm finds `psalm.xml` by itself and stops
            # with "Could not locate a config file" on the other one.
            if [[ -f 'psalm.xml' ]]; then
              php_commands+=('./vendor/bin/psalm')
            elif [[ -f 'psalm.xml.dist' ]]; then
              php_commands+=('./vendor/bin/psalm --config=psalm.xml.dist')
            fi

            if [[ ${#php_commands[@]} -gt 0 ]]; then
              php='true'
              php_runner='true'
              commands+=("${php_commands[@]}")
              echo "Composer dependencies are installed on the runner: $composer_cmd"
            else
              echo "composer.json is here but there is no phpcs or psalm configuration - nothing to install Composer dependencies for"
            fi
          fi
        fi

        # `package.json` alone is enough, and deliberately a looser test than the runner's PHP
        # one above. A JavaScript project keeps its whole toolchain in `node_modules` - the type
        # checker, the framework CLI, the test runner are all binaries it unpacks - so there is
        # always something for the agent to run, whether or not the package declares a script
        # this workflow knows the name of.
        #
        # `node_dir` is where the manifest is, which is the root unless the caller says
        # otherwise. It is the runner's route only: a project whose install and checks go
        # through `task.sh` is driven from the root, because the container knows its own layout
        # and this workflow has no business second-guessing it.
        node_dir='${{ inputs.node_working_directory }}'
        node='false'
        node_runner='false'
        npm_cmd='npm install'
        yarn_cmd='yarn install --production=false'
        if [[ -f "$node_dir/package.json" ]]; then
          node='true'

          # Yarn is chosen by `.yarnrc`, which is the test install-packages and npm-qa-checks
          # both make - so the tool that installs is the tool CI installs with.
          #
          # A lock file is installed from rather than resolved against, because the agent's
          # working tree is committed: `npm install` rewrites `package-lock.json`, and where the
          # repository tracks that file the rewrite goes into the pull request as a change
          # nobody asked for.
          if [[ -f "$node_dir/.yarnrc" ]]; then
            manager='yarn'
            [[ -f "$node_dir/yarn.lock" ]] && yarn_cmd='yarn install --frozen-lockfile --production=false'
          else
            manager='npm'
            [[ -f "$node_dir/package-lock.json" ]] && npm_cmd='npm ci'
          fi

          # The same package manager either way, run where this project's toolchain is:
          # `node_modules` holds platform binaries, and the two machines cannot use each other's.
          #
          # A manifest below the root goes to the runner even where the container could take it.
          # `task.sh` is driven from the root and this workflow does not know what directory it
          # would install in, so the only install it can place with certainty is its own.
          if [[ "$node_dir" == '.' ]] && supports "$manager"; then
            if [[ "$manager" == 'yarn' ]]; then
              yarn_cmd="./task.sh $yarn_cmd"
              echo "Yarn is what this package is installed with, in the container: $yarn_cmd"
            else
              npm_cmd="./task.sh $npm_cmd"
              echo "NPM is what this package is installed with, in the container: $npm_cmd"
            fi
          else
            node_runner='true'
            if [[ "$manager" == 'yarn' ]]; then
              echo "Yarn is what this package is installed with, on the runner: $yarn_cmd"
            else
              echo "NPM is what this package is installed with, on the runner: $npm_cmd"
            fi
          fi

          # `npm run`, whichever package manager installed, because that is what npm-qa-checks
          # runs the scripts with - and the agent has to be told what CI does rather than what
          # the repository's own convention is. In the container the script is reached through
          # the manager `task.sh` supports, which is the only place its `node_modules` exists.
          #
          # Only these two names. A script this workflow invented would be one CI never runs,
          # which is the one thing the agent must not be told.
          #
          # `jq`'s stderr is left alone: a `package.json` it cannot parse says so in the log
          # rather than looking like a package that declares no scripts.
          for script in lint test; do
            if jq -e ".scripts.\"$script\"" "$node_dir/package.json" > /dev/null; then
              if [[ "$node_runner" == 'true' ]]; then
                # A subshell rather than a bare `cd`, so the agent can paste the line anywhere
                # in a session without the directory it leaves behind changing what runs next.
                if [[ "$node_dir" == '.' ]]; then
                  commands+=("npm run $script")
                else
                  commands+=("(cd $node_dir && npm run $script)")
                fi
              else
                commands+=("./task.sh $manager run $script")
              fi
            fi
          done
        elif [[ "$node_dir" != '.' ]]; then
          echo "::warning title=node_working_directory has no package.json::\`$node_dir\` was given as the directory the JavaScript dependencies are installed from, and there is no \`package.json\` in it. Nothing is installed for Node, and the agent is told it cannot run this project's JavaScript checks"
        fi

        # A container install fills the container's cache volume, leaving the runner directory
        # actions/cache is pointed at empty - so the container route is namespaced away from the
        # key php-qa-checks reads, which would otherwise restore that empty cache.
        cache_key=''
        if [[ "$php" == 'true' && "$php_runner" == 'false' ]] \
            || [[ "$node" == 'true' && "$node_runner" == 'false' ]]; then
          cache_key='ai-container'
        fi

        # The commands leave as an output rather than as prose, because what the agent is told
        # is the business of the step that knows whether their install worked.
        #
        # Deliberately never called "checks". That word already means the plan's `C` items in
        # both prompts, and a second meaning for it here is how an agent ends up reporting `C2`
        # as discharged because a linter came back clean.
        {
          printf 'php=%s\n' "$php"
          printf 'php_runner=%s\n' "$php_runner"
          printf 'node=%s\n' "$node"
          printf 'node_runner=%s\n' "$node_runner"
          printf 'node_dir=%s\n' "$node_dir"
          printf 'composer_cmd=%s\n' "$composer_cmd"
          printf 'npm_cmd=%s\n' "$npm_cmd"
          printf 'yarn_cmd=%s\n' "$yarn_cmd"
          printf 'cache_key=%s\n' "$cache_key"
          echo 'commands<<COMMANDS'
          [[ ${#commands[@]} -gt 0 ]] && printf '%s\n' "${commands[@]}"
          echo 'COMMANDS'
        } >> "$GITHUB_OUTPUT"

        if [[ "$php" == 'false' && "$node" == 'false' ]]; then
          echo "There is nothing here to install, and the agent works out what it can run for itself"
        fi

    # Which PHP the checks run under, read from the same `_ci_environment.json` the QA matrix is
    # built from. Without it the agent gets whatever `ubuntu-latest` happens to ship, which need
    # not satisfy `composer.json`'s platform constraint - and the install then fails on the
    # platform rather than on anything the agent did.
    #
    # One version, not the matrix. Proving every leg green stays CI's job; this is here so the
    # agent can check itself before it pushes.
    #
    # The runner's install only. A container install runs under the image's PHP.
    - name: Work out the PHP version to check under
      id: php
      if: >-
        ${{ steps.verify.outputs.php_runner == 'true' }}
      uses: uniquesca/ci/get-default-ci-environment@v11

    - name: Set up PHP
      if: >-
        ${{ steps.verify.outputs.php_runner == 'true' }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ fromJSON(steps.php.outputs.env)[0].php.version }}
        extensions: ${{ fromJSON(steps.php.outputs.env)[0].php.extensions }}

    # `_ci_environment.json` describes PHP and nothing else, so unlike the version above this
    # one is an input rather than something read out of the repository. `package-manager-cache`
    # is off because install-packages does the caching, keyed on the lock file.
    - name: Set up Node
      if: >-
        ${{ steps.verify.outputs.node_runner == 'true' }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node_version }}
        package-manager-cache: false

    # Installing with no lock file writes one, and a library here does not commit one - so
    # without this `git add -A` picks up a `composer.lock` or a `package-lock.json`
    # the agent never asked for and pushes it as part of the change. The dependency directories
    # are here for the repository that neither commits nor gitignores them, where the commit
    # would otherwise push every file the install wrote.
    #
    # `.git/info/exclude` only hides what git is not already tracking, so a repository that does
    # commit its lock file still commits a real change to it - which is why the install is given
    # a command that installs from the lock file rather than resolving against it. The trade is
    # that a plan asking for a lock file to be *added* needs it added by hand - the rarer of the
    # two, and the one that is obvious from the diff.
    - name: Keep the install out of the commit
      if: >-
        ${{ (steps.verify.outputs.php == 'true' || steps.verify.outputs.node == 'true') }}
      shell: bash
      run: |
        # Each pattern is anchored, so the JavaScript ones carry the directory the install
        # actually runs in - left at the root they exclude nothing a nested workspace writes.
        node_dir='${{ steps.verify.outputs.node_dir }}'
        node_prefix=''
        [[ -n "$node_dir" && "$node_dir" != '.' ]] && node_prefix="/${node_dir#./}"

        {
          printf '/composer.lock\n'
          printf '/vendor/\n'
          printf '%s/package-lock.json\n' "$node_prefix"
          printf '%s/yarn.lock\n' "$node_prefix"
          printf '%s/node_modules/\n' "$node_prefix"
        } >> .git/info/exclude

        # What the install is measured against below. Bringing the application up renders this
        # repository's config templates, and those are not the install's doing.
        git diff --name-only | sort > "$RUNNER_TEMP/tracked-before-install"

    # A call per ecosystem, because the action installs one directory and the two manifests
    # need not share one: a PHP application with an Angular workspace under it keeps
    # `composer.json` at the root and `package.json` below it. Each command carries its own
    # route - the container's through `task.sh`, the runner's not - and a container install is
    # driven from the root whatever directory the manifest is in, because `task.sh` runs there.
    #
    # `--no-scripts` for the same reason php-qa-checks uses it: Composer's post-install scripts
    # are arbitrary code out of the repository, and this job can mint a Claude API token from its
    # own Github OIDC identity. NPM's lifecycle scripts have no such flag here, because
    # npm-qa-checks runs them and half a JavaScript toolchain arrives as a platform binary a
    # post-install script puts in place - an install that skipped them would leave the agent
    # with a `node_modules` CI never has.
    #
    # Both tokens are scoped to this step, and `env:` in Actions is per-step - so the agent below
    # inherits a populated `vendor/` and `node_modules`, and neither credential that filled them.
    # Same property as `persist-credentials: false` on the checkout. Either route reads them out
    # of the working tree the action writes them to, which is what the step below is a net under.
    #
    # No `--prefer-lowest` and no alternative lock file. The matrix legs that need those are
    # CI's business; this installs what the branch says it depends on.
    #
    # `continue-on-error`, because a run the agent cannot check itself in is worth more than
    # no run at all.
    - name: Install the Composer dependencies
      id: install_composer
      if: >-
        ${{ steps.verify.outputs.php == 'true' }}
      continue-on-error: true
      uses: uniquesca/ci/install-packages@v11
      with:
        skip_npm_yarn: true
        composer_access_token: ${{ inputs.composer_access_token }}
        composer_cmd: ${{ steps.verify.outputs.composer_cmd }}
        cache_key: ${{ steps.verify.outputs.cache_key }}

    - name: Install the NPM dependencies
      id: install_npm
      if: >-
        ${{ steps.verify.outputs.node == 'true' }}
      continue-on-error: true
      uses: uniquesca/ci/install-packages@v11
      with:
        # The runner's directory. A container install goes through `task.sh` at the root, and
        # its command already carries that route.
        working_directory: ${{ steps.verify.outputs.node_runner == 'true' && steps.verify.outputs.node_dir || '.' }}
        skip_composer: true
        npm_access_token: ${{ inputs.npm_access_token }}
        npm_install_cmd: ${{ steps.verify.outputs.npm_cmd }}
        yarn_install_cmd: ${{ steps.verify.outputs.yarn_cmd }}
        cache_key: ${{ steps.verify.outputs.cache_key }}

    # The install writes each registry's credentials into the working tree while it runs and
    # takes them back out itself. This is a net under that: the agent below has a shell, and the
    # working tree is committed with `git add -A` - so a token left behind is a token pushed
    # to a branch.
    #
    # `always()` so a failed install does not skip it. A file the repository itself commits is
    # put back under its own name by the action, so what is left here to find is only ever
    # generated.
    - name: Take the registry credentials back out of the working tree
      if: >-
        ${{ always()
        && (steps.verify.outputs.php == 'true' || steps.verify.outputs.node == 'true') }}
      shell: bash
      run: |
        # Each install writes its credentials into its own working directory, so the sweep
        # covers both: Composer's at the root, NPM's wherever the manifest is.
        for leftover in auth.json .npmrc '${{ inputs.node_working_directory }}/.npmrc'; do
          if [[ -f "$leftover" ]]; then
            echo "::warning title=The install left a credential file behind::$leftover was still in the working tree after the install, so it was deleted before the agent could read it or it could be committed. The install step's log has why it did not clean up after itself"
            rm -f "$leftover"
          fi
        done

    # The install is allowed to fail, so somewhere has to say that it did. A warning and not an
    # error: what the run lost is the agent's way of checking itself rather than the work.
    # Reads the step's own outcome, because `continue-on-error` leaves the job successful.
    - name: Say the dependencies could not be installed
      if: >-
        ${{ (steps.install_composer.outcome == 'failure'
        || steps.install_npm.outcome == 'failure') }}
      shell: bash
      run: |
        echo "::warning title=The dependencies could not be installed::The agent works without them: it is told they are missing and to leave them alone, and the artifact reports are what CI says about its work. Worth fixing even so - an agent that can run the checks catches its own mistakes. The step's log has why, and a private registry with no token configured, a token that has expired, and a lock file the branch itself broke, are the three to look at first"

    # Whether installing changed anything git already tracks. A repository that commits its
    # `vendor/` or its `node_modules` is the case that matters: the install then turns up inside
    # the agent's commit, and in the diff somebody has to review.
    #
    # Against the baseline taken before the install rather than against `HEAD`, so a rendered
    # config is not read back as something the install wrote.
    #
    # Reported rather than acted on. A repository that commits its dependencies arguably wants
    # the install committed, and quietly reverting it here would break exactly those - so this
    # says what happened and leaves it.
    - name: Say what installing changed
      if: >-
        ${{ (steps.verify.outputs.php == 'true' || steps.verify.outputs.node == 'true') }}
      shell: bash
      run: |
        git diff --name-only | sort > "$RUNNER_TEMP/tracked-after-install"

        mapfile -t changed < <(comm -13 \
          "$RUNNER_TEMP/tracked-before-install" "$RUNNER_TEMP/tracked-after-install")

        if [[ ${#changed[@]} -gt 0 ]]; then
          echo "::warning title=Installing the dependencies changed tracked files::This repository commits files the install writes to, so they will be part of the agent's commit. The run log lists them."
          echo "::group::Tracked files the install changed"
          git diff --name-status -- "${changed[@]}"
          echo "::endgroup::"
        fi

    # What the agent is told about its dependencies, and it has to be the truth: an agent told
    # to run a linter out of a `vendor/` that is not there spends turns finding out. Silence
    # costs the same turns and reads worse - an agent with a shell and a plan full of checks
    # takes it as the environment being its to build, and one run went two thirds of its turns
    # on a substitute dependency tree, stubs for the packages it could not reach and a linter
    # under `/tmp`, then was cut off before it wrote anything down.
    #
    # Read off the disk rather than from the install's outcome, because those are not the same
    # answer - a partial install and a repository that commits its dependencies both end up here.
    - name: Tell the agent what it can check its work with
      id: verify_prompt
      env:
        COMMANDS: ${{ steps.verify.outputs.commands }}
        # Whether anything was meant to be installed at all. An empty `vendor/` means something
        # different in a repository with a `composer.json` than in one without.
        PHP: ${{ steps.verify.outputs.php }}
        NODE: ${{ steps.verify.outputs.node }}
        # Where the JavaScript install put `node_modules`. The container route leaves nothing on
        # the runner to find, and an empty value here reads the root - which is the truth then.
        NODE_DIR: ${{ steps.verify.outputs.node_runner == 'true' && steps.verify.outputs.node_dir || '.' }}
      shell: bash
      run: |
        # Named by directory rather than by ecosystem, because a repository can have a
        # `composer.json` this workflow installs nothing for and a `package.json` it does - and
        # "your dependencies are installed" would then be a claim about a `vendor/` that is not
        # there.
        node_modules='node_modules'
        [[ -n "$NODE_DIR" && "$NODE_DIR" != '.' ]] && node_modules="${NODE_DIR%/}/node_modules"

        installed=()
        [[ -d 'vendor' ]] && installed+=('`vendor/`')
        [[ -d "$node_modules" ]] && installed+=("\`$node_modules\`")

        # A command is only worth naming where the install behind it is on the disk.
        commands=()
        if [[ ${#installed[@]} -gt 0 ]]; then
          while IFS= read -r command; do
            [[ -n "$command" ]] && commands+=("$command")
          done <<< "$COMMANDS"
        fi

        {
          echo 'instructions<<PROMPT'

          if [[ ${#installed[@]} -gt 0 ]]; then
            echo "This project's dependencies are installed, under $(printf '%s and ' "${installed[@]}" | sed 's/ and $//')."

            # The binaries are not on the `PATH` a shell starts with. Unplaced deliberately:
            # `./node_modules/.bin` is a container install's binaries named on the machine that
            # cannot execute them.
            if [[ -d "$node_modules" ]]; then
              echo 'Its own type checker, framework CLI and test runner are binaries among them:'
              echo 'run those, at the version this project pins.'
            fi

            if [[ ${#commands[@]} -gt 0 ]]; then
              echo
              echo 'CI runs these on whatever you push, whether or not the task mentions them:'
              echo
              printf -- '- `%s`\n' "${commands[@]}"
              echo
              echo 'Run a fixer before a reporter. Passing these is the minimum, not the whole job.'
            fi
          elif [[ "$PHP" == 'true' || "$NODE" == 'true' ]]; then
            echo "This project's dependencies could not be installed here, so no test runner,"
            echo 'linter or static analysis is available. Do not install them again or build a'
            echo 'substitute. Verify by reading, and report the checks you could not run as'
            echo '`not_run`, with why - CI runs them on the pull request.'
          fi

          echo 'PROMPT'
        } >> "$GITHUB_OUTPUT"

        if [[ ${#installed[@]} -eq 0 ]]; then
          if [[ "$PHP" == 'true' || "$NODE" == 'true' ]]; then
            echo "The dependencies are not on the disk, and the agent is told to expect none and to leave them alone"
          else
            echo "There are no dependency directories in the working tree, and the agent is told nothing about any"
          fi
        elif [[ ${#commands[@]} -gt 0 ]]; then
          echo "The agent can run: ${commands[*]}"
        else
          echo "The dependencies are installed, and there is no command this workflow can name for the agent to check itself with"
        fi

    # What the agent can run now that there is a container to run it in - the tasks
    # `docker-qa-checks` runs, asked about the same way, so that what the agent checks and what
    # CI checks cannot drift apart. A repository supporting none of them gets none listed.
    #
    # `code-quality` is the exception to that symmetry, and deliberately: it is the other three
    # code style tasks in one call, which is what the agent wants and what `docker-qa-checks`
    # must not have - a blended log cannot be split back into the per-check reports the artifact
    # loop uploads. Same tools either way, so nothing about the answer drifts.
    #
    # Only after a spin-up that worked. Handing an agent commands that exec into a container
    # which is not running costs it several turns to find out, and the answer it gets back says
    # nothing about its own work.
    - name: Work out what the agent can check its work with in the container
      id: container
      if: >-
        ${{ steps.docker_up.outcome == 'success' }}
      shell: bash
      run: |
        commands=()
        names=()
        fixer='false'
        tests='false'

        # `supports` is `task.sh`'s own answer about itself, so a repository that has renamed or
        # dropped a task is never told it can run one. A compose file without a `task.sh` has no
        # equivalent to ask, and gets the paragraph below without a list.
        if [[ -f 'task.sh' ]]; then
          # Fixer first, for the same reason the composer branch orders them that way: what a
          # tool can fix should never reach a reviewer, and what survives it is what the check
          # reports. `code-quality` above the three it wraps, so that an agent taking the first
          # thing that covers its work takes the one call rather than three.
          #
          # Each task carries what it does, because the set overlaps: told only the names, an
          # agent runs `code-quality` and then the three tools inside it again.
          for entry in \
              'cs-fix|fixes every code style problem a tool can fix' \
              'code-quality|the fixer, the code style check and the static analysis in one call - prefer it to running them one at a time' \
              'cs-check|reports the code style problems the fixer cannot fix' \
              'psalm|static analysis' \
              'test|the unit tests'; do
            task=${entry%%|*}

            if ./task.sh supports "$task" > /dev/null 2>&1; then
              commands+=("\`./task.sh $task\` - ${entry#*|}")
              names+=("$task")

              [[ "$task" == 'cs-fix' ]] && fixer='true'
              [[ "$task" == 'test' ]] && tests='true'
            fi
          done
        fi

        {
          echo 'instructions<<PROMPT'
          echo "This project's application runs in Docker on this runner. Run anything that needs"
          echo 'the application, its database or its dependencies in its containers, not on the'
          echo 'runner.'

          if [[ ${#commands[@]} -gt 0 ]]; then
            echo
            echo 'CI runs these on whatever you push, whether or not the task mentions them. Each'
            echo 'runs inside the container:'
            echo
            printf -- '- %s\n' "${commands[@]}"

            # Only where the standalone fixer is one of them: `code-quality` orders it already
            if [[ "$fixer" == 'true' ]]; then
              echo
              echo 'Run the fixer before the reporters.'
            fi

            # A second run reads state the first left in the shared database, and an agent that
            # does not know it chases that as a defect
            if [[ "$tests" == 'true' ]]; then
              echo
              echo 'The unit tests leave state in a shared database: run `./task.sh test` once,'
              echo 'when the change is otherwise finished. A failure only a second run shows is'
              echo 'not proof of a defect.'
            fi

            echo
            echo 'Passing these is the minimum, not the whole job.'
          fi

          echo 'PROMPT'
        } >> "$GITHUB_OUTPUT"

        if [[ ${#names[@]} -gt 0 ]]; then
          echo "The agent can run: ${names[*]}"
        elif [[ -f 'task.sh' ]]; then
          echo "The application is up, but task.sh supports none of these checks - the agent is told only that it is running"
        else
          echo "The application is up, and without a task.sh there is nothing to ask about what it can check - the agent is told only that it is running"
        fi

    - name: Put the instructions together
      id: instructions
      shell: bash
      env:
        DEPENDENCIES: ${{ steps.verify_prompt.outputs.instructions }}
        CONTAINER: ${{ steps.container.outputs.instructions }}
      run: |
        {
          echo 'text<<PROMPT'
          printf '%s\n' "$DEPENDENCIES"
          [[ -n "$DEPENDENCIES" && -n "$CONTAINER" ]] && echo
          printf '%s\n' "$CONTAINER"
          echo 'PROMPT'
        } >> "$GITHUB_OUTPUT"
