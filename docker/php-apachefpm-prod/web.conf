[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
autorestart=true
stopasgroup=true
killasgroup=true

[program:apache]
; Not apache2ctl: it stays as a shell wrapper, so supervisord could not signal Apache itself
command=/bin/bash -c "source /etc/apache2/envvars && mkdir -p $APACHE_RUN_DIR $APACHE_LOCK_DIR && exec /usr/sbin/apache2 -D FOREGROUND"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
autorestart=true
stopasgroup=true
killasgroup=true
