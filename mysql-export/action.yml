name: 'mysql-export'

inputs:
  dump_file_path:
    description: 'Path to the DB dump'
    required: true
  db_name:
    description: 'DB name to export dump from'
    required: true
  schema_only:
    description: 'Dump the schema only, without any table data'
    required: false
    default: 'false'
  host:
    description: 'MySQL server address'
    required: false
    default: '127.0.0.1'
  username:
    description: 'MySQL server username'
    required: false
    default: 'root'
  password:
    description: 'MySQL server password'
    required: false
    default: 'root'
  port:
    description: 'MySQL port'
    required: false
    default: '3306'

runs:
  using: "composite"
  steps:
    - name: MySQL export
      run: |
        EXTRA_ARGS=()
        if [[ "${{ inputs.schema_only }}" == 'true' ]]; then
          EXTRA_ARGS+=(--no-data)
        fi

        mysqldump -q --routines --triggers --single-transaction --max_allowed_packet=512M \
          "${EXTRA_ARGS[@]}" \
          --user=${{inputs.username}} \
          --password=${{inputs.password}} \
          --host=${{inputs.host}} \
          --port=${{inputs.port}} \
          --result-file=${{ inputs.dump_file_path }} \
          ${{ inputs.db_name }}
        # Remove DEFINER from the dump 
        sed -i -e 's/DEFINER[ ]*=[ ]*[^*]*\*/\*/' ${{ inputs.dump_file_path }} 
        sed -i -e 's/DEFINER[ ]*=[ ]*[^*]*PROCEDURE/PROCEDURE/' ${{ inputs.dump_file_path }} 
        sed -i -e 's/DEFINER[ ]*=[ ]*[^*]*FUNCTION/FUNCTION/' ${{ inputs.dump_file_path }}
        # Remove dump end time to avoid unnecessary commits every time
        sed -i '/^-- Dump completed on/d' ${{ inputs.dump_file_path }}
        sed -i '/^-- Host:/d' ${{ inputs.dump_file_path }}
        sed -i -E "s/^-- Dumping routines for database '.+'$/-- Dumping routines/" ${{ inputs.dump_file_path }}

        # Without the data, AUTO_INCREMENT is the last id the table happened to reach, so it moves
        # on every run and defeats the point of a committable dump.
        if [[ "${{ inputs.schema_only }}" == 'true' ]]; then
          sed -i -E 's/ AUTO_INCREMENT=[0-9]+//' ${{ inputs.dump_file_path }}
        fi
      shell: bash
