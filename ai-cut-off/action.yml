name: AI cut off

description: Clean up after an AI run that stopped before its own clean-up ran, most likely because it ran out of time. Never fails the job

inputs:
  number:
    description: 'Issue or pull request the run was working on'
    required: true
  message:
    description: 'What did not finish and how to try again. A line saying the run was stopped, with a link to it, goes under it. Empty posts nothing'
    required: false
    default: ''
  subject:
    description: 'GraphQL node id of the comment or review that started the run. Its 👀 is swapped for 😕. Empty leaves reactions alone'
    required: false
    default: ''
  label:
    description: 'Label to take off. Empty takes nothing off'
    required: false
    default: ''
  review_token:
    description: 'Post the message as an AI Review failure review with this token, so it starts the next round the way a finished review does. Falls back to a comment. Empty posts a comment'
    required: false
    default: ''
  token:
    description: 'Github token. Needs `issues: write`, and `pull-requests: write` on a pull request'
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        NUMBER: ${{ inputs.number }}
        MESSAGE: ${{ inputs.message }}
        LABEL: ${{ inputs.label }}
        REVIEW_TOKEN: ${{ inputs.review_token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [[ -n "$MESSAGE" ]]; then
          printf '%s\n\nThe run was stopped before it could say why, most likely because it ran out of time. The run log has the detail: %s\n' \
            "$MESSAGE" "$RUN_URL" > "$RUNNER_TEMP/cut-off.md"

          # The same markers AI Review puts on its own failure review
          posted='false'
          if [[ -n "$REVIEW_TOKEN" ]] && head=$(gh pr view "$NUMBER" --json headRefOid --jq '.headRefOid'); then
            jq -n --rawfile text "$RUNNER_TEMP/cut-off.md" --arg sha "$head" \
              '{commit_id: $sha, event: "COMMENT", body: ("<!-- ai-review -->\n<!-- ai-review-failed -->\n\n" + $text)}' \
              | GH_TOKEN="$REVIEW_TOKEN" gh api "repos/$GH_REPO/pulls/$NUMBER/reviews" --method POST --input - > /dev/null \
              && posted='true'
          fi
          [[ "$posted" == 'true' ]] \
            || gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/cut-off.md" \
            || echo "::warning title=Could not report the failure::Nothing was posted on #$NUMBER"
        fi

        if [[ -n "$LABEL" ]]; then
          name=$(jq -rn --arg name "$LABEL" '$name | @uri')
          gh api "repos/$GH_REPO/issues/$NUMBER/labels/$name" --method DELETE > /dev/null 2>&1 || true
        fi

    - uses: uniquesca/ci/ai-react@v11
      with:
        subject: ${{ inputs.subject }}
        remove: EYES
        add: CONFUSED
        token: ${{ inputs.token }}
