name: 'mysql-import'

inputs:
  dump_file_path:
    description: 'Path to the DB dump. A path ending in `.gz` is decompressed on the way in, so a dump large enough to slow the checkout that carries it can be committed compressed'
    required: true
  db_name:
    description: 'DB name to export dump from'
    required: true
  host:
    description: 'MySQL server address'
    required: false
    default: '127.0.0.1'
  username:
    description: 'MySQL server username'
    required: false
    default: 'root'
  password:
    description: 'MySQL server password'
    required: false
    default: 'root'
  port:
    description: 'MySQL port'
    required: false
    default: '3306'

runs:
  using: "composite"
  steps:
    - name: MySQL import
      run: |
        # `pipefail` for the compressed branch below: without it a dump that failed to
        # decompress is reported by whatever `mysql` made of the truncated stream, which is
        # usually success
        set -euo pipefail

        dump="${{ inputs.dump_file_path }}"

        # Both checks off for the length of the connection. `mysqldump` turns them off in its
        # own preamble, so this is what covers a dump that something else wrote - a hand-made
        # file, or an extract of a larger one
        mysql_cmd=(
          mysql
          -u "${{ inputs.username }}" -p"${{ inputs.password }}"
          --host "${{ inputs.host }}" --port "${{ inputs.port }}"
          --init-command="SET unique_checks=0, foreign_key_checks=0"
          "${{ inputs.db_name }}"
        )

        if [[ "$dump" == *.gz ]]; then
          gzip -dc "$dump" | "${mysql_cmd[@]}"
        else
          "${mysql_cmd[@]}" < "$dump"
        fi
      shell: bash
