name: AI render plan

description: Check the plan a planning agent wrote as JSON against the plan before it, and render it as the markdown posted on the issue. Never fails the job

inputs:
  plan_file:
    description: 'File the agent wrote. See `src/ai-plan.js` for its shape'
    required: false
    default: '.ai-plan/new-plan.json'
  previous_file:
    description: 'The plan before this one, as `ai-stage-issue` staged it. Its ids are carried as retired where this plan drops them'
    required: false
    default: '.ai-plan/plan.json'
  fallback_file:
    description: 'What to post instead when the plan is missing or unusable - the final message the agent ended on'
    required: false
    default: ''
  cost_line:
    description: 'The `cost_line` output of `ai-run-report`, to add what was posted to'
    required: false
    default: ''

outputs:
  rendered:
    description: 'Whether the JSON plan was usable - "true" or "false"'
    value: ${{ steps.render.outputs.rendered }}
  plan_file:
    description: 'The rendered plan, with the whole plan folded under it as JSON for the agents and the next revision - or a copy of `fallback_file`. Empty when there was neither'
    value: ${{ steps.render.outputs.plan_file }}
  has_qa:
    description: 'Whether the plan has QA acceptance criteria - "true" or "false"'
    value: ${{ steps.render.outputs.has_qa }}
  cost_line:
    description: 'The `cost_line` input with the length of the visible plan, whether it was laid out from JSON, and what the checks found. Empty when the input was'
    value: ${{ steps.render.outputs.cost_line }}

runs:
  using: composite
  steps:
    - id: render
      shell: bash
      env:
        INPUT_PLAN_FILE: ${{ inputs.plan_file }}
        INPUT_PREVIOUS_FILE: ${{ inputs.previous_file }}
        INPUT_FALLBACK_FILE: ${{ inputs.fallback_file }}
        INPUT_COST_LINE: ${{ inputs.cost_line }}
      run: node "$GITHUB_ACTION_PATH/render.js"
