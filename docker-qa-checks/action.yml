name: QA Checks

inputs:
  setup_cmd:
    description: 'Command to run to set up environment before the QA checks execution'
    required: false
    default: ''
    type: string
  report_name:
    description: 'Name of the artifact the check output is uploaded as. Anything starting with `ai-report-` is picked up by the AI implementing workflow, which is how an agent finds out what a red check printed. Artifact names have to be unique within a run, so give each leg its own if this runs more than once'
    required: false
    default: 'ai-report-qa-checks'
    type: string
  auto_fix:
    description: 'Whether to fix what the code style check reports, with `cs-fix`, and commit the fixes back to the pull request branch, so that a fixable problem does not become a check a developer has to act on. Nothing is fixed when the check comes back clean. The job needs `permissions: contents: write` for the commit to land'
    required: false
    default: 'true'
    type: string
  autofix_token:
    description: 'Access token the automatic code style fixes are pushed with. Supply one and the fix commit starts its own checks, so a fixable problem is fixed and reported green without anybody touching it. Without it the fixes are pushed with the run''s own `GITHUB_TOKEN`, which needs `permissions: contents: write` and leaves the run for the fix commit waiting on "Approve workflows to run"'
    required: false
    default: ''
    type: string

runs:
  using: "composite"
  steps:
    - name: Run setup cmd (if specified)
      shell: bash
      run: ${{ inputs.setup_cmd }}

    - name: Prepare the report directory
      shell: bash
      # Anchored to the workspace, not relative: this is a composite action, so a caller that
      # sets a working-directory would otherwise write the reports somewhere the upload below
      # does not look
      run: mkdir -p "$GITHUB_WORKSPACE/.ai-reports"

    - name: Check whether the code style can be fixed automatically
      id: cs_fix_support
      if: ${{ inputs.auto_fix == 'true' }}
      shell: bash
      run: |
        if ./task.sh supports cs-fix > /dev/null; then
          echo "supported=true" >> "$GITHUB_OUTPUT"
        fi

    # Every check below tees its output to a file as well as the log, and the files go up as an
    # artifact at the end - an implementing agent cannot read job logs, and a check run on its own
    # carries nothing but `Process completed with exit code 1`.
    #
    # `set -o pipefail` so that `tee` cannot return success for a task that failed, which would
    # turn every red check green.

    # A failure here is held back for the fixer below, and reported by the re-check after it.
    # Without a fixer to run, it is reported here.
    - name: Run code quality checks
      id: cs_check
      shell: bash
      env:
        FIXABLE: ${{ steps.cs_fix_support.outputs.supported }}
      run: |
        set -o pipefail
        if ! ./task.sh supports cs-check > /dev/null; then
          exit 0
        fi

        status=0
        ./task.sh cs-check 2>&1 | tee "$GITHUB_WORKSPACE/.ai-reports/cs-check.log" || status=$?
        if (( status != 0 )) && [[ "$FIXABLE" == 'true' ]]; then
          echo 'failed=true' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        exit "$status"

    - name: Fix the code style
      id: cs_fix
      if: ${{ steps.cs_check.outputs.failed == 'true' }}
      uses: uniquesca/ci/cs-fix@v11
      with:
        cmd: './task.sh cs-fix'
        token: ${{ inputs.autofix_token }}
        report_dir: ${{ github.workspace }}/.ai-reports

    # What the fixer could not fix, which is the failure the check above held back
    - name: Re-run code quality checks
      if: ${{ steps.cs_fix.outcome == 'success' }}
      shell: bash
      run: |
        set -o pipefail
        ./task.sh cs-check 2>&1 | tee "$GITHUB_WORKSPACE/.ai-reports/cs-check.log"

    - name: Run tests
      shell: bash
      run: |
        set -o pipefail
        if ./task.sh supports test > /dev/null; then
          ./task.sh test 2>&1 | tee "$GITHUB_WORKSPACE/.ai-reports/test.log"
        fi

    - name: Run Psalm
      shell: bash
      run: |
        set -o pipefail
        if ./task.sh supports psalm > /dev/null; then
          ./task.sh psalm 2>&1 | tee "$GITHUB_WORKSPACE/.ai-reports/psalm.log"
        fi

    # `always()`, because the only run anybody wants these from is the one that failed - and a
    # failed step skips everything after it by default. Short retention: this is written to be read
    # by the next implementing round, within minutes, not kept.
    - name: Upload the check reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.report_name }}
        path: ${{ github.workspace }}/.ai-reports
        retention-days: 1
        # `.ai-reports` is a dot-directory, and upload-artifact excludes hidden files by
        # default - without this the report is written and then silently dropped
        include-hidden-files: true
        if-no-files-found: ignore
